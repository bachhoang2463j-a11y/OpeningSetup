<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转场样式预览 · 雾港谜案 1925</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #12161f, #0a0d13 55%);
    color: #e8dcc0;
    font-family: 'Noto Serif SC', 'Songti SC', SimSun, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 16px 40px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #e6cf9a; }
  .subtitle { margin: 0 0 18px; font-size: 12px; letter-spacing: .3em; color: rgba(232,220,192,.5); }

  /* ============ 样式切换器 ============ */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .tab {
    padding: 8px 18px; border: 1px solid rgba(198,161,84,.32); border-radius: 999px;
    background: transparent; color: rgba(232,220,192,.72);
    font-family: inherit; font-size: 13px; letter-spacing: .08em; cursor: pointer;
    transition: all .25s ease;
  }
  .tab:hover { border-color: rgba(224,185,102,.7); color: #f0dba8; }
  .tab.on { background: rgba(198,161,84,.18); border-color: #d9b45c; color: #f2e2b8; }

  .run {
    display: block; margin: 0 auto 16px; padding: 11px 34px;
    border: 1px solid rgba(224,185,102,.85); border-radius: 3px 16px 3px 16px;
    background: rgba(217,180,92,.14); color: #f0dba8;
    font-family: inherit; font-size: 15px; letter-spacing: .18em; cursor: pointer;
    transition: all .25s ease;
  }
  .run:hover { background: rgba(217,180,92,.26); box-shadow: 0 0 26px rgba(217,180,92,.22); }
  .run:disabled { opacity: .45; cursor: wait; }

  /* ============ 舞台 ============ */
  .stage {
    position: relative; width: min(940px, 94vw); aspect-ratio: 16 / 9;
    border: 1px solid rgba(198,161,84,.3); border-radius: 16px;
    background: #0b0e15; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 0 80px rgba(0,0,0,.4);
  }
  .desc { margin-top: 14px; font-size: 12.5px; color: rgba(232,220,192,.62); letter-spacing: .05em; text-align: center; max-width: 720px; line-height: 1.7; }

  /* ============ A/B 两面内容 ============ */
  .face {
    position: absolute; inset: 0; padding: 30px 38px;
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; pointer-events: none;
  }
  .face.active { opacity: 1; pointer-events: auto; }
  .face .eyebrow { font-size: 10px; letter-spacing: .34em; color: #c69a5f; margin-bottom: 10px; }
  .face h2 { margin: 0 0 14px; font-size: clamp(22px, 3.4vw, 34px); font-weight: 600; color: #efe6cf; }
  .face p { margin: 0; max-width: 560px; font-size: 14px; line-height: 2; color: rgba(226,214,190,.82); }
  .face .hint { margin-top: 22px; font-size: 11px; letter-spacing: .22em; color: rgba(198,161,84,.65); }

  /* 战斗面（B） */
  .face.combat { align-items: stretch; justify-content: flex-start; }
  .combat-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .combat-row .who { width: 96px; font-size: 13px; color: #e8dcc0; }
  .hpbar { flex: 1; height: 10px; border: 1px solid rgba(198,161,84,.4); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.45); }
  .hpbar i { display: block; height: 100%; border-radius: 999px; }
  .hp-en i { width: 86%; background: linear-gradient(90deg, #8c3b34, #c26a55); }
  .hp-me i { width: 72%; background: linear-gradient(90deg, #3f7a5c, #75d6ae); }
  .skills { display: flex; gap: 10px; margin-top: 22px; }
  .skills span {
    padding: 9px 16px; border: 1px solid rgba(198,161,84,.4); border-radius: 6px;
    font-size: 12.5px; color: #e6cf9a; background: rgba(217,180,92,.08); letter-spacing: .08em;
  }

  /* ============ overlay 公共 ============ */
  .ov { position: absolute; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }

  /* ================================================================
     样式一 · 灰白窗帘（结构源自 Aisela 丝绒幕拆解，配色改灰白剧院布）
     时序：close 640ms → hold 140ms → open 720ms
     ================================================================ */
  .ov-curtain .c-track {
    position: absolute; z-index: 1; top: 0; left: 0; right: 0; height: 13px;
    background: linear-gradient(180deg, rgba(24,23,21,.98), rgba(52,50,46,.94) 58%, rgba(16,15,14,.94)),
                repeating-linear-gradient(90deg, rgba(200,195,184,.22) 0 2px, transparent 2px 15px);
    box-shadow: 0 3px 16px rgba(0,0,0,.6);
    opacity: 0; transition: opacity 180ms ease;
  }
  .ov-curtain.is-closing .c-track, .ov-curtain.is-closed .c-track, .ov-curtain.is-opening .c-track { opacity: 1; }

  .c-panel {
    position: absolute; z-index: 2; top: 0; bottom: 0; width: 51.5%; overflow: hidden;
    background-color: #c8c3b8;
    background-image:
      linear-gradient(90deg, rgba(20,18,16,.32), transparent 9%, rgba(255,255,255,.16) 27%, transparent 42%, rgba(20,18,16,.28) 64%, transparent 81%, rgba(255,255,255,.10));
  }
  /* 竖向织纹 */
  .c-panel::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(58,55,50,.20) 0 3.5%, rgba(250,247,240,.22) 4.3% 5.6%, rgba(35,33,30,.24) 7% 9.4%, rgba(58,55,50,.08) 10.5% 12.5%);
    mix-blend-mode: multiply; opacity: .85; pointer-events: none;
  }
  /* 大面明暗起伏 */
  .c-panel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,252,244,.20), transparent 16%, rgba(0,0,0,.10) 74%, rgba(0,0,0,.34));
    pointer-events: none;
  }
  /* 三道褶皱阴影带 */
  .c-panel i {
    position: absolute; top: -12%; bottom: -12%; width: 16%;
    background: linear-gradient(90deg, transparent, rgba(30,28,25,.34), rgba(250,247,240,.14), transparent);
    filter: blur(1.6px); transform: skewX(-1.6deg);
  }
  .c-panel i:nth-of-type(1) { left: 17%; } .c-panel i:nth-of-type(2) { left: 48%; } .c-panel i:nth-of-type(3) { left: 79%; }
  /* 帘布内边缘 */
  .c-panel b { position: absolute; top: 0; bottom: 0; width: 26px; background: linear-gradient(90deg, transparent, rgba(25,23,20,.5), rgba(120,114,102,.25), rgba(25,23,20,.55)); }
  .c-left  { left: 0;  transform: translateX(-102%); box-shadow: inset -1px 0 rgba(120,114,102,.35), inset 0 0 60px rgba(30,28,25,.42); }
  .c-right { right: 0; transform: translateX(102%);  box-shadow: inset 1px 0 rgba(120,114,102,.35), inset 0 0 60px rgba(30,28,25,.42); }
  .c-left b { right: -6px; } .c-right b { left: -6px; transform: scaleX(-1); }

  .c-seam {
    position: absolute; z-index: 4; top: 0; bottom: 0; left: 50%; width: 6px; transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(255,252,242,.55) 50%, transparent);
    box-shadow: 0 0 14px rgba(255,250,238,.35); opacity: 0;
  }

  .ov-curtain.is-closing .c-left  { animation: cw-close-l var(--t-close, 640ms) cubic-bezier(.58,.03,.2,.98) both; }
  .ov-curtain.is-closing .c-right { animation: cw-close-r var(--t-close, 640ms) cubic-bezier(.58,.03,.2,.98) both; }
  .ov-curtain.is-closed .c-left, .ov-curtain.is-closed .c-right { transform: translateX(0); }
  .ov-curtain.is-closing .c-seam { animation: cw-seam-in var(--t-close, 640ms) ease both; }
  .ov-curtain.is-closed .c-seam { opacity: .9; }
  .ov-curtain.is-opening .c-seam { animation: cw-seam-out var(--t-open, 720ms) ease both; }
  .ov-curtain.is-opening .c-left  { animation: cw-open-l var(--t-open, 720ms) cubic-bezier(.48,.04,.2,.98) both; }
  .ov-curtain.is-opening .c-right { animation: cw-open-r var(--t-open, 720ms) cubic-bezier(.48,.04,.2,.98) both; }

  @keyframes cw-close-l { 0% { transform: translateX(-102%); } 72% { transform: translateX(2.1%); } 88% { transform: translateX(-.7%); } 100% { transform: translateX(0); } }
  @keyframes cw-close-r { 0% { transform: translateX(102%); } 72% { transform: translateX(-2.1%); } 88% { transform: translateX(.7%); } 100% { transform: translateX(0); } }
  @keyframes cw-open-l  { 0% { transform: translateX(0); } 78% { transform: translateX(-103.4%); } 100% { transform: translateX(-102%); } }
  @keyframes cw-open-r  { 0% { transform: translateX(0); } 78% { transform: translateX(103.4%); } 100% { transform: translateX(102%); } }
  @keyframes cw-seam-in  { 0%, 62% { opacity: 0; } 88%, 100% { opacity: .9; } }
  @keyframes cw-seam-out { 0% { opacity: .9; } 65%, 100% { opacity: 0; } }

  /* ================================================================
     样式二 · 浓雾涌漫（八团雾自两侧涌入 → 漫满 → 继续漂远散去）
     时序：close 1050ms → hold 260ms → open 1150ms
     ================================================================ */
  .ov-fog { background: transparent; }
  .f-base {
    position: absolute; inset: -10%;
    background:
      radial-gradient(120% 90% at 12% 88%, rgba(214,212,206,.95), transparent 55%),
      radial-gradient(110% 85% at 88% 20%, rgba(206,204,198,.92), transparent 58%),
      linear-gradient(120deg, rgba(198,196,190,.55), rgba(222,220,214,.66));
    opacity: 0;
  }
  .ov-fog.is-closing .f-base, .ov-fog.is-closed .f-base { opacity: 1; transition: opacity 900ms ease; }
  .ov-fog.is-opening .f-base, .ov-fog.is-idle-back .f-base { opacity: 0; transition: opacity 1050ms ease; }

  .f-blob {
    position: absolute; left: var(--x); top: var(--y);
    width: 46%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, rgba(224,222,216,.94) 0%, rgba(214,212,206,.55) 42%, rgba(210,208,202,0) 72%);
    filter: blur(26px);
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) scale(var(--s, 1));
  }
  .ov-fog.is-closing .f-blob, .ov-fog.is-closed .f-blob {
    opacity: 1;
    transform: translate(0, 0) scale(var(--s, 1));
    transition: transform 1050ms cubic-bezier(.4,.1,.35,.96), opacity 800ms ease;
  }
  .ov-fog.is-opening .f-blob {
    opacity: 0;
    transform: translate(calc(var(--dx) * 2.3), calc(var(--dy) * 2.3)) scale(calc(var(--s, 1) * 1.25));
    transition: transform 1150ms cubic-bezier(.45,.05,.4,.95), opacity 950ms ease .1s;
  }
  /* 全闭期间雾面缓慢呼吸漂移（背景层位移，不与 blob 的 transform 冲突） */
  .ov-fog.is-closed .f-base { animation: fog-drift 7s ease-in-out infinite alternate; }
  @keyframes fog-drift { from { background-position: 0% 0%, 100% 100%, 0 0; } to { background-position: 6% 3%, 94% 96%, 3% 2%; } }

  /* ================================================================
     样式三 · 影棚百叶（14 片竖百叶依次拍落 → 反向斜收）
     时序：单条 240ms + 间隔 42ms → close 800ms → hold 140ms → open 800ms
     ================================================================ */
  .ov-blind .b-slat {
    position: absolute; top: 0; bottom: 0; width: calc(100% / 14 + 1px);
    left: calc(var(--i) * 100% / 14);
    background: linear-gradient(180deg, #3c3c40, #232327 58%, #151518);
    box-shadow: inset 1px 0 rgba(255,255,255,.07), inset -1px 0 rgba(0,0,0,.55), inset 0 0 24px rgba(0,0,0,.35);
    transform: scaleY(0); transform-origin: top;
  }
  .ov-blind .b-slat:nth-child(odd)  { filter: brightness(1.06); }
  .ov-blind.is-closing .b-slat, .ov-blind.is-closed .b-slat {
    transform: scaleY(1);
    transition: transform 240ms cubic-bezier(.6,.05,.3,1);
    transition-delay: calc(var(--i) * 42ms);
  }
  .ov-blind.is-opening .b-slat {
    transform: scaleY(0); transform-origin: bottom;
    transition: transform 240ms cubic-bezier(.6,.05,.3,1);
    transition-delay: calc((13 - var(--i)) * 42ms);
  }
  /* 百叶合拢后的冷光扫线（closed 期间一次性掠过，像灯管扫过百叶缝隙） */
  .ov-blind .b-sheen {
    position: absolute; inset: 0; z-index: 2; opacity: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(226,222,212,.14) 46%, rgba(226,222,212,.03) 54%, transparent 70%);
  }
  .ov-blind.is-closed .b-sheen { animation: blind-sheen 900ms ease .15s both; }
  @keyframes blind-sheen { 0% { opacity: 0; transform: translateX(-30%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(30%); } }

  /* ================================================================
     样式四 · 镁光爆闪（1925 镁光灯：爆闪白幕 + 快门抖动 + 显影回落）
     时序：close 170ms → hold 110ms → open 320ms
     ================================================================ */
  .ov-flash .fl-veil { position: absolute; inset: 0; background: #f4f1e8; opacity: 0; }
  .ov-flash .fl-core {
    position: absolute; left: 50%; top: 46%; width: 46%; aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(.5); border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,252,238,.75) 34%, rgba(255,250,232,0) 70%);
  }
  .ov-flash .fl-vig {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(120% 120% at 50% 50%, transparent 46%, rgba(10,8,5,.5) 100%);
  }
  .ov-flash.is-closing .fl-veil  { opacity: 1; transition: opacity 150ms ease-out; }
  .ov-flash.is-closing .fl-core  { opacity: 1; transform: translate(-50%,-50%) scale(1); transition: all 150ms ease-out; }
  .ov-flash.is-closing .fl-vig   { opacity: .5; transition: opacity 150ms ease-out; }
  .ov-flash.is-closed .fl-veil { opacity: 1; }
  .ov-flash.is-closed .fl-core { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .ov-flash.is-closed .fl-vig  { opacity: .5; }
  .ov-flash.is-opening .fl-veil { opacity: 0; transition: opacity 300ms ease-in; }
  .ov-flash.is-opening .fl-core { opacity: 0; transform: translate(-50%,-50%) scale(1.65); transition: all 330ms ease-in; }
  .ov-flash.is-opening .fl-vig  { opacity: 0; transition: opacity 300ms ease-in; }

  /* 快门抖动：closing 时作用于旧面；显影：opening 时作用于新面（face 声明在 overlay 之前，用 ~ 联动） */
  .ov-flash.is-closing ~ .face.active { animation: cam-shake 230ms ease-out; }
  .ov-flash.is-opening ~ .face.active { animation: develop 340ms ease-out; }
  @keyframes cam-shake {
    0% { filter: brightness(1); transform: none; }
    30% { filter: brightness(1.5); transform: translate(-3px, 2px) scale(1.012); }
    60% { filter: brightness(1.25); transform: translate(3px, -2px); }
    100% { filter: brightness(1); transform: none; }
  }
  @keyframes develop {
    0% { filter: brightness(1.45) contrast(1.1); }
    100% { filter: brightness(1) contrast(1); }
  }
</style>
</head>
<body>

<h1>转场样式预览</h1>
<p class="subtitle">雾港谜案 1925 · 叙事 ⇄ 战斗 换幕四式</p>

<div class="tabs">
  <button class="tab on" data-fx="curtain" type="button">灰白窗帘</button>
  <button class="tab" data-fx="fog" type="button">浓雾涌漫</button>
  <button class="tab" data-fx="blind" type="button">百叶快落</button>
  <button class="tab" data-fx="flash" type="button">镁光爆闪</button>
</div>
<button class="run" id="runBtn" type="button">演示过渡</button>

<div class="stage" id="stage">
  <!-- overlay 1 · 灰白窗帘 -->
  <div class="ov ov-curtain" data-fx="curtain">
    <div class="c-track"></div>
    <div class="c-panel c-left"><i></i><i></i><i></i><b></b></div>
    <div class="c-panel c-right"><i></i><i></i><i></i><b></b></div>
    <div class="c-seam"></div>
  </div>
  <!-- overlay 2 · 浓雾 -->
  <div class="ov ov-fog" data-fx="fog" style="display:none">
    <div class="f-base"></div>
    <div class="f-blob" style="--x:-14%; --y:52%; --dx:-70%; --dy:6%;  --s:1.5"></div>
    <div class="f-blob" style="--x:72%;  --y:-8%; --dx:75%;  --dy:-10%; --s:1.3"></div>
    <div class="f-blob" style="--x:58%;  --y:64%; --dx:85%;  --dy:14%;  --s:1.6"></div>
    <div class="f-blob" style="--x:22%;  --y:-16%;--dx:-60%; --dy:-12%; --s:1.2"></div>
    <div class="f-blob" style="--x:-10%; --y:6%;  --dx:-80%; --dy:-4%;  --s:1.4"></div>
    <div class="f-blob" style="--x:38%;  --y:36%; --dx:70%;  --dy:8%;   --s:1.1"></div>
    <div class="f-blob" style="--x:12%;  --y:70%; --dx:-65%; --dy:10%;  --s:1.35"></div>
    <div class="f-blob" style="--x:66%;  --y:30%; --dx:90%;  --dy:0%;   --s:1.25"></div>
  </div>
  <!-- overlay 3 · 百叶 -->
  <div class="ov ov-blind" data-fx="blind" style="display:none">
    <div class="b-slat" style="--i:0"></div><div class="b-slat" style="--i:1"></div>
    <div class="b-slat" style="--i:2"></div><div class="b-slat" style="--i:3"></div>
    <div class="b-slat" style="--i:4"></div><div class="b-slat" style="--i:5"></div>
    <div class="b-slat" style="--i:6"></div><div class="b-slat" style="--i:7"></div>
    <div class="b-slat" style="--i:8"></div><div class="b-slat" style="--i:9"></div>
    <div class="b-slat" style="--i:10"></div><div class="b-slat" style="--i:11"></div>
    <div class="b-slat" style="--i:12"></div><div class="b-slat" style="--i:13"></div>
    <div class="b-sheen"></div>
  </div>
  <!-- overlay 4 · 镁光 -->
  <div class="ov ov-flash" data-fx="flash" style="display:none">
    <div class="fl-vig"></div>
    <div class="fl-veil"></div>
    <div class="fl-core"></div>
  </div>

  <!-- A/B 两面内容（声明在 overlay 之后，供 `.ov ~ .face` 兄弟选择器联动快门抖动/显影） -->
  <!-- A 面 · 叙事 -->
  <section class="face story active">
    <div class="eyebrow">CHAPTER · 叙事</div>
    <h2>雨夜的第三封电报</h2>
    <p>1925 年 11 月，雾从码头爬上石阶，把煤气灯泡成一圈圈昏黄的晕。你把第三封电报折好塞进大衣内袋——发报人署名是三个月前就已沉海的那个人。楼下的门环，恰在此时响了三下。</p>
    <div class="hint">再点「演示过渡」→ 进入战斗</div>
  </section>
  <!-- B 面 · 战斗 -->
  <section class="face combat">
    <div class="eyebrow">BATTLE · 战斗</div>
    <h2>雾中来袭者</h2>
    <div class="combat-row"><span class="who">雾中来袭者</span><div class="hpbar hp-en"><i></i></div></div>
    <div class="combat-row"><span class="who">你</span><div class="hpbar hp-me"><i></i></div></div>
    <div class="skills"><span>急射</span><span>近身格斗</span><span>脱离接触</span></div>
    <div class="hint">再点「演示过渡」→ 回到叙事</div>
  </section>
</div>

<p class="desc" id="desc"></p>

<script>
(function () {
  'use strict';
  /* 每种样式的时序配置，与 Aisela 换幕状态机同构：closing → closed(换内容) → opening → idle */
  var FX = {
    curtain: { close: 640,  hold: 140, open: 720  },
    fog:     { close: 1050, hold: 260, open: 1150 },
    blind:   { close: 800,  hold: 140, open: 800  },
    flash:   { close: 170,  hold: 110, open: 320  }
  };
  var DESC = {
    curtain: '剧院灰白丝绒幕：双片合拢带惯性回弹，中缝受光渐亮——最隆重的一档，适合章节级切换。',
    fog:     '浓雾涌漫：八团雾自两侧涌入漫满全屏，换景后向更远处散去——最贴「雾港」气质，适合重大场景切换。',
    blind:   '影棚百叶：十四片竖百叶依次拍落，反向斜收并伴随一道冷光扫线——利落干净，适合普通场景切换。',
    flash:   '镁光爆闪：一次爆闪定格 + 快门抖动，白幕退去即换景——最快最轻，适合确认类轻量切换。'
  };

  var stage   = document.getElementById('stage');
  var runBtn  = document.getElementById('runBtn');
  var descEl  = document.getElementById('desc');
  var tabs    = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var ovs     = Array.prototype.slice.call(document.querySelectorAll('.ov'));
  var faces   = Array.prototype.slice.call(document.querySelectorAll('.face'));
  var current = 'curtain';
  var busy    = false;

  descEl.textContent = DESC[current];

  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (busy) return;
      current = btn.getAttribute('data-fx');
      tabs.forEach(function (b) { b.classList.toggle('on', b === btn); });
      ovs.forEach(function (o) {
        var on = o.getAttribute('data-fx') === current;
        o.style.display = on ? 'block' : 'none';
        o.classList.remove('is-closing', 'is-closed', 'is-opening');
      });
      descEl.textContent = DESC[current];
    });
  });

  function swapFaces() {
    faces.forEach(function (f) { f.classList.toggle('active'); });
  }

  function playTransition() {
    if (busy) return;
    busy = true;
    runBtn.disabled = true;

    var ov = ovs.filter(function (o) { return o.getAttribute('data-fx') === current; })[0];
    var t  = FX[current];

    ov.classList.add('is-closing');
    setTimeout(function () {
      ov.classList.remove('is-closing');
      ov.classList.add('is-closed');   /* 全闭钉住，观众看不见的时刻换内容 */
      swapFaces();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          ov.classList.remove('is-closed');
          ov.classList.add('is-opening');
          setTimeout(function () {
            ov.classList.remove('is-opening');
            busy = false;
            runBtn.disabled = false;
          }, t.open);
        });
      });
    }, t.close);
  }

  runBtn.addEventListener('click', playTransition);

  /* 空格键快捷演示 */
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playTransition(); }
  });
})();
</script>
</body>
</html>
