  /* 跨阶段导航：柔和沉浸淡出淡入转场（250ms 淡出 + 300ms 淡入），支持 instant 测试 */
  let isStageTransitioning = false;
  function gotoStageWithCrossfade(st) {
    if (isStageTransitioning) return;
    if (state.stage === st) return;

    if (window.__OPENING_DEBUG__ && window.__OPENING_DEBUG__.instant) {
      state.stage = st;
      render();
      return;
    }

    isStageTransitioning = true;
    app.classList.remove('stage-fade-in');
    app.classList.add('stage-fade-out');

    setTimeout(function () {
      state.stage = st;
      render();
      app.classList.remove('stage-fade-out');
      app.classList.add('stage-fade-in');

      setTimeout(function () {
        app.classList.remove('stage-fade-in');
        isStageTransitioning = false;
      }, 300);
    }, 250);
  }

  /* ==================== 事件 ==================== */

  app.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-action]');
    if (!t) return;
    const act = t.getAttribute('data-action');
    switch (act) {
      case 'tw-skip':
        if (state.twTimer) finishTw();
        break;
      case 'sound': enterImmersiveFs(); toggleSound(); break;
      case 'start':
        enterImmersiveFs();
        state.storyPage = 0;
        gotoStageWithCrossfade('story');
        break;
      case 'auto-fs-toggle':
        state.autoFullscreen = !state.autoFullscreen; render(); break;
      case 'story-next':
        state.storyPage++; render(); break;
      case 'story-done':
        gotoStageWithCrossfade('c1'); break;
      case 'c1-pick':
        switchHeroClassLocally('hero1', t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c1-done':
        if (!state.hero1Class) { state.flash = '先为角色一选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c2');
        break;
      case 'c2-pick':
        switchHeroClassLocally('hero2', t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c2-done':
        if (!state.hero2Class) { state.flash = '先为角色二选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c3id');
        break;
      case 'c3id-done':
        gotoStageWithCrossfade('c3class');
        break;
      case 'c3-class-pick':
        switchHero3ClassLocally(t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c3class-done':
        if (!state.hero3.classType) { state.flash = '先为自定义角色选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c3skill');
        break;
      case 'c3-skill-remove':
      case 'c3-skill-toggle':
        toggleC3Skill(t.getAttribute('data-skill'));
        break;
      case 'c3skill-done':
        gotoStageWithCrossfade('c3item');
        break;
      case 'item-toggle':
        toggleItem(t.getAttribute('data-item-id'));
        break;
      case 'rules-modal':
        toggleBattleRulesModal();
        break;
      case 'c3item-done':
        gotoStageWithCrossfade('confirm');
        break;
      case 'play-voice': {
        const heroId = t.getAttribute('data-hero');
        if (heroId) playHeroCurrentVoice(heroId);
        break;
      }
      case 'portrait-pick':
        state.hero3.portrait = t.getAttribute('data-portrait-key') || ''; render(); break;
      case 'portrait-add': addCustomPortrait(); break;
      case 'confirm-submit': submitAll(); break;
      case 'retry': state.stage = 'loading'; state.stepRows = []; state.progress = 0; submitAll(); break;
      case 'force-redo':
        state.openingSent = false;
        state.doneFlag = null;
        gotoStageWithCrossfade('title');
        break;
      case 'back-c1': gotoStageWithCrossfade('c1'); break;
      case 'back-c2': gotoStageWithCrossfade('c2'); break;
      case 'back-c3id': gotoStageWithCrossfade('c3id'); break;
      case 'back-c3class': gotoStageWithCrossfade('c3class'); break;
      case 'back-c3skill': gotoStageWithCrossfade('c3skill'); break;
      case 'back-c3item': gotoStageWithCrossfade('c3item'); break;
    }
  });

  function addCustomPortrait() {
    const nameEl = document.getElementById('custom-pname');
    const urlEl = document.getElementById('custom-purl');
    const flash = document.getElementById('custom-flash');
    const name = (nameEl && nameEl.value.trim()) || '自定义立绘';
    const url = urlEl ? urlEl.value.trim() : '';
    if (!/^https?:\/\//.test(url)) {
      if (flash) flash.classList.remove('hidden');
      return;
    }
    if (flash) flash.classList.add('hidden');
    // 同名覆盖：重填即修正，无需删除入口
    state.hero3.customPortraits = state.hero3.customPortraits.filter(function (p) { return p.key !== name; });
    state.hero3.customPortraits.push({ key: name, name: name, desc: '玩家自定义', url: url });
    state.hero3.portrait = name;
    render();
  }

  function toggleFs() {
    try {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    } catch (e) { /* 宿主 iframe 未授权全屏时静默 */ }
  }

  // 修仙开局同款：首屏勾选"同时开启沉浸全屏"后，点击进入/声音时自动请求全屏
  function enterImmersiveFs() {
    if (!state.autoFullscreen) return;
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        const p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () { /* 宿主拒绝时静默 */ });
      }
    } catch (e) { /* 未授权全屏时静默 */ }
  }

  function updateFsIcon() {
    const expand = document.getElementById('fs-icon-expand');
    const compress = document.getElementById('fs-icon-compress');
    if (!expand || !compress) return;
    const fs = !!document.fullscreenElement;
    expand.classList.toggle('hidden', fs);
    compress.classList.toggle('hidden', !fs);
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    try {
      bgVideo.muted = !state.soundOn;
      updateBgmForStage(state.stage);
    } catch (e) { /* 自动播放策略拒绝时静默 */ }
    // 纯状态切换：只定点刷新声音 UI，绝不整页重绘
    updateDockBgmUi();
  }

  function refreshBudget(boxId, used, total) {
    const box = document.getElementById(boxId);
    if (box) box.innerHTML = budgetBar(used, total, false);
  }

  function toggleC3Skill(name) {
    const entry = genericPool().find(function (e) { return e.data.name === name; });
    if (!entry) return;
    const idx = state.hero3.skills.indexOf(name);
    let isAdded = false;
    if (idx >= 0) {
      state.hero3.skills.splice(idx, 1);
      isAdded = false;
    } else {
      if (state.hero3.skills.length >= 3) {
        showFlashToast('通用技能槽位已满（最多装配 3 个）');
        return;
      }
      if (genericSkillUsed() + entry.shopCost > OPENING_DATA.shop.skillPoints) {
        showFlashToast('通用技能点数不足（上限 ' + OPENING_DATA.shop.skillPoints + ' 点）');
        return;
      }
      state.hero3.skills.push(name);
      isAdded = true;
    }
    // 纯增量更新：绝不触发整页 DOM 重绘，消除生硬刷新
    incrementalUpdateC3Skill(name, isAdded);
  }

  function toggleItem(id) {
    const entry = OPENING_DATA.items.find(function (e) { return e.id === id; });
    if (!entry) return;
    const totalPoints = OPENING_DATA.shop.itemPoints;
    if (state.selectedItems.has(id)) {
      state.selectedItems.delete(id);
    } else {
      if (itemsUsed() + entry.shopCost > totalPoints) {
        showFlashToast('物品预算不足（上限 ' + totalPoints + ' 点）');
        refreshBudget('item-budget', itemsUsed(), totalPoints);
        return;
      }
      state.selectedItems.add(id);
    }
    // 纯增量更新：局部刷新顶部能量条与被点击卡片高亮，绝不整页重绘
    refreshBudget('item-budget', itemsUsed(), totalPoints);
    const cardEl = document.querySelector('[data-item-id="' + id + '"]');
    if (cardEl) {
      cardEl.classList.toggle('sel', state.selectedItems.has(id));
    }
  }

  /* 悬停职业卡 → 左侧展台实机战斗视窗（仅 hover 时弹出，移开隐藏；GIF 已预热秒显） */
  function showCombatPreview(cName) {
    const info = OPENING_DATA.classIntro[cName] || {};
    const gifSrc = info.gifUrl || '';
    const monitor = document.getElementById('stage-combat-monitor');
    const img = document.getElementById('stage-combat-img');
    /* 相同职业重复悬浮不重设 src，避免动画重启与重复解码 */
    if (img && gifSrc && img.getAttribute('src') !== gifSrc) {
      img.src = gifSrc;
    }
    if (monitor) monitor.classList.add('active');
  }
  function hideCombatPreview() {
    const monitor = document.getElementById('stage-combat-monitor');
    if (!monitor) return;
    monitor.classList.remove('active');
    /* 弹出过渡(220ms)结束后清空 src，停止隐藏态 GIF 的持续解码播放 */
    setTimeout(function () {
      if (!monitor.classList.contains('active')) {
        const img = document.getElementById('stage-combat-img');
        if (img) img.removeAttribute('src');
      }
    }, 260);
  }
  function initCombatMonitorHover() {
    app.addEventListener('mouseover', function (ev) {
      const tab = ev.target.closest('[data-class-tab]');
      if (tab) showCombatPreview(tab.getAttribute('data-class-tab'));
    });
    app.addEventListener('mouseout', function (ev) {
      const tab = ev.target.closest('[data-class-tab]');
      if (!tab) return;
      const rel = ev.relatedTarget;
      if (rel && tab.contains(rel)) return;
      hideCombatPreview();
    });
  }

      if (info && info.gifUrl && !PREHEATED_GIFS.has(info.gifUrl)) {
        PREHEATED_GIFS.add(info.gifUrl);

        pre.src = info.gifUrl;

    });

  let currentRuleIndex = 0;

  function renderRuleTabs() {
    const bar = document.getElementById('rule-tabs-bar');
    if (!bar) return;
    const titles = ['时序', '阵型', '行动', 'TP', '指令', '控制', '侦测', '战力'];
    bar.innerHTML = RULE_CARDS.map(function (card, idx) {
      const stateCls = idx === currentRuleIndex ? 'active' : 'text-white/60 hover:text-white hover:bg-white/5';
      return `
      <button data-rule-index="${idx}"
              class="rule-tab-pill px-2.5 py-1 rounded-lg text-xs font-mono flex items-center gap-1 ${stateCls}"
              title="${card.title}">
        <span class="font-bold">${String(idx + 1).padStart(2, '0')}</span>
        <span class="hidden md:inline text-[0.68rem] opacity-80">${titles[idx]}</span>
      </button>`;
    }).join('');
  }

  function renderRuleCard() {
    const stage = document.getElementById('rule-card-stage');
    const pageInd = document.getElementById('rule-page-indicator');
    const prevBtn = document.getElementById('rule-prev-btn');
    const nextBtn = document.getElementById('rule-next-btn');
    if (!stage) return;

    const card = RULE_CARDS[currentRuleIndex];
    if (!card) return;

    // 更新 Tab 索引条
    renderRuleTabs();

    // 更新页码指示与上一项/下一项按钮态
    if (pageInd) pageInd.textContent = `${currentRuleIndex + 1} / ${RULE_CARDS.length}`;
    if (prevBtn) {
      prevBtn.disabled = currentRuleIndex === 0;
      prevBtn.style.opacity = currentRuleIndex === 0 ? '0.4' : '1';
      prevBtn.style.pointerEvents = currentRuleIndex === 0 ? 'none' : 'auto';
    }
    if (nextBtn) {
      if (currentRuleIndex === RULE_CARDS.length - 1) {
        nextBtn.innerHTML = '<span>完成阅读 · 返回战场 ✓</span>';
        nextBtn.className = 'px-4 py-1.5 rounded-lg border border-emerald-500/60 bg-emerald-500/25 hover:bg-emerald-500/40 text-emerald-200 hover:text-white transition-all cursor-pointer flex items-center gap-1 text-xs font-bold shadow-[0_0_16px_rgba(16,185,129,0.35)]';
      } else {
        nextBtn.innerHTML = '<span>下一项</span><span>▶</span>';
        nextBtn.className = 'px-4 py-1.5 rounded-lg border border-amber-500/50 bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 hover:text-amber-100 transition-all cursor-pointer flex items-center gap-1 text-xs font-bold shadow-[0_0_12px_rgba(245,158,11,0.2)]';
      }
    }

    const headerBlock = `
          <!-- 头部标题 -->
          <div class="pb-2 border-b border-white/10">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="flex items-center gap-2">

              <img src="${card.img}"

                   onerror="this.style.display='none'">`;

    const captionBar = `
            <div class="flex items-center justify-between px-2.5 text-[0.72rem] font-mono text-amber-300/85 bg-amber-950/20 border border-amber-500/25 rounded-lg py-1.5">

                <span class="text-amber-400 text-xs">🎯</span>
                <span>${card.imgCaption}</span>

    const sectionBlocks = `

            <div class="flex items-center gap-1.5 text-xs font-bold text-sky-300 font-serif mb-1.5">
              <span>🔍</span><span>【界面说明】</span>

    // hero-swap-in 与角色切换同一动效，随重渲染重放

            </div>
${captionBar}
          </div>
${sectionBlocks}
      </div>
    ` : `

        <!-- 左栏：拆图图解区 -->

          </div>
${captionBar}

  }

  function switchRuleCard(idx) {
    if (idx < 0 || idx >= RULE_CARDS.length) return;
    currentRuleIndex = idx;
    renderRuleCard();
  }

  /* 战斗规则速查弹窗交互 */
  function toggleBattleRulesModal(forceState) {
    const modal = document.getElementById('battle-rules-modal');
    if (!modal) return;
    const isVisible = modal.classList.contains('visible');
    const target = (typeof forceState === 'boolean') ? forceState : !isVisible;
    const card = modal.querySelector('.rules-modal-card');

    if (target) {
      modal.classList.add('visible');
      modal.style.opacity = '1';
      modal.style.pointerEvents = 'auto';
      if (card) card.style.transform = 'scale(1)';
      renderRuleCard(); // 打开时渲染当前卡片
    } else {
      modal.style.opacity = '0';
      modal.style.pointerEvents = 'none';
      if (card) card.style.transform = 'scale(0.95)';
      setTimeout(function () { modal.classList.remove('visible'); }, 220);
    }
  }
  function initRulesModal() {
    const modal = document.getElementById('battle-rules-modal');
    if (!modal) return;
    modal.addEventListener('click', function (ev) {
      if (ev.target.closest('[data-rules-close]')) toggleBattleRulesModal(false);
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') toggleBattleRulesModal(false);
    });

    // 8大卡片：Tab 索引条点击切换（事件委托，Tab 随重渲染重建）
    const tabsBar = document.getElementById('rule-tabs-bar');
    if (tabsBar) tabsBar.addEventListener('click', function (ev) {
      const pill = ev.target.closest('[data-rule-index]');
      if (pill) switchRuleCard(parseInt(pill.getAttribute('data-rule-index'), 10) || 0);
    });

    // 底栏上一项/下一项（末页变「完成阅读 · 返回战场」）
    const prevBtn = document.getElementById('rule-prev-btn');
    if (prevBtn) prevBtn.addEventListener('click', function () { switchRuleCard(currentRuleIndex - 1); });
    const nextBtn = document.getElementById('rule-next-btn');
    if (nextBtn) nextBtn.addEventListener('click', function () {
      if (currentRuleIndex < RULE_CARDS.length - 1) switchRuleCard(currentRuleIndex + 1);
      else toggleBattleRulesModal(false);
    });

    // 键盘 ←/→ 切换卡片（仅弹窗可见时接管）
    window.addEventListener('keydown', function (e) {
      const m = document.getElementById('battle-rules-modal');
      if (!m || !m.classList.contains('visible')) return;
      if (e.key === 'ArrowLeft') switchRuleCard(currentRuleIndex - 1);
      else if (e.key === 'ArrowRight') switchRuleCard(currentRuleIndex + 1);
    });

    // 右上角规则胶囊与 BGM 胶囊
    const topRulesBtn = document.getElementById('top-rules-btn');
    if (topRulesBtn) topRulesBtn.addEventListener('click', function () { toggleBattleRulesModal(true); });
    const bgmBtn = document.getElementById('bgm-toggle-btn');
    if (bgmBtn) bgmBtn.addEventListener('click', toggleSound);
  }

  /* BGM 胶囊与首屏声音按钮随声音状态同步（胶囊在 #app 外、按钮不走 render，均需手动刷） */
  function updateDockBgmUi() {
    const icon = document.getElementById('bgm-icon');
    const label = document.getElementById('bgm-label');
    if (icon) icon.textContent = state.soundOn ? '🎵' : '🔇';
    if (label) label.textContent = state.soundOn ? 'BGM' : '静音';
    const titleBtn = document.getElementById('title-sound-btn');
    if (titleBtn) titleBtn.textContent = state.soundOn ? '🔊 声音已开启' : '🔇 开启声音';
  }

  /* 右上角战斗规则速查胶囊显隐：仅战斗配置流程显示，标题页/叙事导引隐藏 */
  function updateTopRulesVisibility() {
    const btn = document.getElementById('top-rules-btn');
    if (!btn) return;
    const battleStages = ['c1', 'c2', 'c3id', 'c3class', 'c3skill', 'c3item', 'confirm'];
    btn.style.display = battleStages.indexOf(state.stage) >= 0 ? '' : 'none';
  }

  /* 纯悬浮窗（Floating Tooltip）：技能卡与机制胶囊悬停说明 */
  let activeTooltipTimer = null;

  function showTooltipForSkillData(skillName, rawText, targetRect, focusMechKey = null) {
    const tooltipContainer = document.getElementById('skill-tooltip-container');
    const ttName = document.getElementById('tt-skill-name');
    const ttIcon = document.getElementById('tt-type-icon');
    const ttBadges = document.getElementById('tt-header-badges');
    const ttBody = document.getElementById('tt-mechanics-body');

    if (!tooltipContainer) return;

    // 1. 设置头部概要
    if (ttName) ttName.textContent = skillName || '技能';

    // 从 rawText 推断类型图标与阶位标签
    let typeIcon = '⚔️';
    if (rawText && rawText.includes('远程')) typeIcon = '🏹';
    else if (rawText && rawText.includes('法术')) typeIcon = '🔮';
    else if (rawText && rawText.includes('反应')) typeIcon = '⚡';
    if (ttIcon) ttIcon.textContent = typeIcon;

    const badges = [];
    if (rawText && rawText.includes('传奇')) {
      badges.push('<span class="text-red-300 border border-red-500/50 bg-red-950/40 px-1.5 py-0.2 rounded">传奇</span>');
    } else if (rawText && rawText.includes('高阶')) {
      badges.push('<span class="text-amber-300 border border-amber-500/50 bg-amber-950/40 px-1.5 py-0.2 rounded">高阶</span>');
    }
    if (rawText && rawText.includes('限定')) {
      badges.push('<span class="text-amber-200/70 border border-amber-500/30 bg-black/40 px-1.5 py-0.2 rounded">限定</span>');
    } else if (rawText && rawText.includes('通用')) {
      badges.push('<span class="text-purple-200/70 border border-purple-500/30 bg-black/40 px-1.5 py-0.2 rounded">通用</span>');
    }
    // 悬停特定机制图标时，回合徽章展示该机制自身的生效回合（如造雾术群盲4/自盲2）；瞬发/被动机制不展示。
    // 整卡悬浮时仅在技能显式声明顶级 [Turns:N]/[持续:N] 时展示，未声明的回合归属各机制图标自身。
    let turnsVal = null;
    if (focusMechKey) {
      turnsVal = getMechTurns(focusMechKey, rawText);
    } else {
      const topMatch = rawText ? rawText.match(/\[(?:Turns?|持续)[:：](\d+)/i) : null;
      turnsVal = topMatch ? parseInt(topMatch[1], 10) : null;
    }
    if (turnsVal != null) {
      badges.push(`<span class="text-amber-300 font-mono border border-amber-500/40 bg-amber-950/40 px-1.5 py-0.2 rounded">⏱ ${turnsVal}回合</span>`);
    }
    if (ttBadges) ttBadges.innerHTML = badges.join('');

    // 2. 提取并渲染关联机制 (按需高亮聚焦机制)
    const mechKeys = extractMechanicsKeys(rawText, skillName);
    let displayKeys = [...mechKeys];
    if (focusMechKey) {
      if (!displayKeys.includes(focusMechKey)) {
        displayKeys.unshift(focusMechKey);
      } else {
        displayKeys = [focusMechKey, ...displayKeys.filter(k => k !== focusMechKey)];
      }
    }

    // 无特殊特性机制则完全不显示悬浮窗，直接收起并返回
    if (displayKeys.length === 0) {
      hideTooltip();
      return;
    }

    if (ttBody) {
      let entriesHtml = displayKeys.map(key => {
        const item = MECHANICS_REGISTRY[key] || { title: key, icon: '✦', desc: '按标准规则结算生效。' };
        const isFocused = focusMechKey === key;
        let borderHighlight = isFocused ? 'border-amber-400/80 bg-amber-500/10' : 'border-white/5 bg-white/[0.02]';
        let titleColor = 'text-[var(--accent)]';
        let extraBadge = '';

        if (key === '生命消耗') {
          const hpM = rawText ? rawText.match(/\[HP:(\d+)\]/i) : null;
          const hpVal = hpM ? hpM[1] : '';
          borderHighlight = isFocused ? 'border-rose-400 bg-rose-950/40 shadow-[0_0_12px_rgba(244,63,94,0.3)]' : 'border-rose-500/30 bg-rose-950/20';
          titleColor = 'text-rose-300';
          if (hpVal) extraBadge = `<span class="text-[0.6rem] font-mono text-rose-300 font-bold px-1.5 py-0.2 rounded border border-rose-500/40 bg-rose-950/60 ml-auto">消耗 ${hpVal} HP</span>`;
        } else if (key === '战技点消耗') {
          const tpM = rawText ? rawText.match(/\[TP:(\d+)\]/i) : null;
          const tpVal = tpM ? tpM[1] : '';
          borderHighlight = isFocused ? 'border-sky-400 bg-sky-950/40 shadow-[0_0_12px_rgba(56,189,248,0.3)]' : 'border-sky-500/30 bg-sky-950/20';
          titleColor = 'text-sky-300';
          if (tpVal) extraBadge = `<span class="text-[0.6rem] font-mono text-sky-300 font-bold px-1.5 py-0.2 rounded border border-sky-500/40 bg-sky-950/60 ml-auto">消耗 ${tpVal} TP</span>`;
        } else if (key === '材料绑定') {
          titleColor = 'text-amber-300';
          const ammo = skillName ? GLOBAL_AMMO_BINDINGS[skillName] : null;
          if (ammo) extraBadge = `<span class="text-[0.6rem] font-mono text-amber-300 font-bold px-1.5 py-0.2 rounded border border-amber-500/40 bg-amber-950/60 ml-auto">${ammo.ammoName}*${ammo.count}</span>`;
        } else if (key === '隐匿' || key === '战术隐匿') {
          titleColor = 'text-emerald-300';
          if (isFocused) borderHighlight = 'border-emerald-400/80 bg-emerald-500/10';
        }

        const focusTurns = isFocused ? getMechTurns(key, rawText) : null;

        return `
          <div class="tooltip-mech-entry ${borderHighlight} rounded-lg px-2 py-1.5 transition-all">
            <div class="flex items-center gap-1.5 text-xs font-bold ${titleColor} mb-0.5">
              <span>${item.icon}</span>
              <span class="tracking-wide">【${item.title}】</span>
              ${extraBadge}
              ${isFocused && focusTurns != null ? `<span class="text-[0.6rem] font-mono text-amber-300 font-bold px-1.5 py-0.2 rounded border border-amber-500/40 bg-amber-950/60 ml-auto shrink-0">⏱ 生效 ${focusTurns} 回合</span>` : (isFocused && !extraBadge ? '<span class="text-[0.58rem] text-amber-300 font-mono font-normal ml-auto">聚焦机制</span>' : '')}
            </div>
            <div class="text-[0.72rem] text-white/80 leading-relaxed font-sans pl-5">
              ${item.desc}
            </div>
          </div>
        `;
      }).join('');

      // 若为召唤技能且涉及【化尘者】，备注化尘者的完整属性与技能档案
      if (displayKeys.includes('召唤') && rawText && rawText.includes('化尘者')) {
        entriesHtml += `
          <div class="mt-2 pt-2 border-t border-white/10">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-bold text-amber-300 flex items-center gap-1 font-serif">
                <span>💨</span><span>〖化尘者〗从者档案</span>
              </span>
              <span class="text-[0.58rem] font-mono text-amber-200/80 border border-amber-500/30 bg-amber-950/40 px-1.5 py-0.5 rounded">流体 · 虚形 · 1动/轮</span>
            </div>
            <div class="grid grid-cols-5 gap-1 text-[0.62rem] font-mono text-center mb-1.5 bg-black/40 p-1.5 rounded border border-white/10">
              <div><span class="text-white/40 block text-[0.52rem]">生命</span><span class="font-bold text-white/90">90</span></div>
              <div><span class="text-white/40 block text-[0.52rem]">法力</span><span class="font-bold text-sky-300">10</span></div>
              <div><span class="text-white/40 block text-[0.52rem]">攻击</span><span class="font-bold text-rose-300">45</span></div>
              <div><span class="text-white/40 block text-[0.52rem]">护甲</span><span class="font-bold text-amber-200">0</span></div>
              <div><span class="text-white/40 block text-[0.52rem]">速度</span><span class="font-bold text-emerald-300">80</span></div>
            </div>
            <div class="space-y-1 text-[0.63rem] font-mono">
              <div class="flex items-center justify-between bg-white/[0.03] px-1.5 py-0.5 rounded border border-white/5">
                <span class="text-white/90 font-bold">【沙矛】</span>
                <span class="text-white/60">单体40×2 · 命中90 · 1 MP · 近战</span>
              </div>
              <div class="flex items-center justify-between bg-white/[0.03] px-1.5 py-0.5 rounded border border-white/5">
                <span class="text-white/90 font-bold">【卷尘】</span>
                <span class="text-white/60">单体50 · 降避10+降攻10(2T) · 2 MP · 法术</span>
              </div>
              <div class="flex items-center justify-between bg-white/[0.03] px-1.5 py-0.5 rounded border border-white/5">
                <span class="text-amber-300 font-bold">【飞沙流体】</span>
                <span class="text-amber-200/70">绝对免伤40 · 反应:远程 · 2 MP</span>
              </div>
            </div>
          </div>
        `;
      }

      ttBody.innerHTML = entriesHtml;
    }

    // 3. 智能定位与防视口溢出计算
    tooltipContainer.classList.add('visible');
    const ttWidth = tooltipContainer.offsetWidth || 320;
    const ttHeight = tooltipContainer.offsetHeight || 180;
    const padding = 12;

    let posX = targetRect.left + (targetRect.width / 2) - (ttWidth / 2);
    let posY = targetRect.top - ttHeight - 8; // 默认在卡片正上方

    // 上边界溢出检测：如果上方放不下，放下方
    if (posY < padding) {
      posY = targetRect.bottom + 8;
    }
    // 左边界溢出检测
    if (posX < padding) {
      posX = padding;
    }
    // 右边界溢出检测
    if (posX + ttWidth > window.innerWidth - padding) {
      posX = window.innerWidth - ttWidth - padding;
    }

    tooltipContainer.style.left = `${Math.round(posX)}px`;
    tooltipContainer.style.top = `${Math.round(posY)}px`;
  }

  function hideTooltip() {
    const tooltipContainer = document.getElementById('skill-tooltip-container');
    if (!tooltipContainer) return;
    tooltipContainer.classList.remove('visible');
  }

  /* 全局事件委托：监听技能插槽与胶囊悬停，自适应动态重绘 */
  function initTooltipGlobalEvents() {
    const tooltipContainer = document.getElementById('skill-tooltip-container');
    let currentTrigger = null;

    document.addEventListener('mouseover', (e) => {
      // 避免在卸下按钮或悬浮窗本身上触发/闪烁
      if (e.target.closest('#skill-tooltip-container') || e.target.closest('.slot-remove-btn')) {
        return;
      }

      // 1. 优先检测是否悬停在特定的机制胶囊上
      const pill = e.target.closest('[data-mech-focus]');
      if (pill) {
        const card = pill.closest('[data-skill-name]');
        if (card) {
          currentTrigger = pill;
          clearTimeout(activeTooltipTimer);
          const skillName = card.getAttribute('data-skill-name');
          const rawText = card.getAttribute('data-skill-raw');
          const mechKey = pill.getAttribute('data-mech-focus');
          const pillRect = pill.getBoundingClientRect();
          activeTooltipTimer = setTimeout(() => {
            showTooltipForSkillData(skillName, rawText, pillRect, mechKey);
          }, 35);
          return;
        }
      }

      // 2. 检测是否悬停在技能插槽卡片或备选卡片上
      const card = e.target.closest('[data-skill-name]');
      if (card) {
        if (currentTrigger === card) return;
        currentTrigger = card;
        clearTimeout(activeTooltipTimer);
        const skillName = card.getAttribute('data-skill-name');
        const rawText = card.getAttribute('data-skill-raw');
        const cardRect = card.getBoundingClientRect();
        activeTooltipTimer = setTimeout(() => {
          showTooltipForSkillData(skillName, rawText, cardRect, null);
        }, 65);
        return;
      }
    });

    document.addEventListener('mouseout', (e) => {
      const card = e.target.closest('[data-skill-name]');
      if (card) {
        const related = e.relatedTarget;
        if (related && card.contains(related)) return;
        if (related && tooltipContainer && tooltipContainer.contains(related)) return;

        currentTrigger = null;
        clearTimeout(activeTooltipTimer);
        hideTooltip();
      }
    });

    // 点击空白处收起
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#skill-tooltip-container')) {
        clearTimeout(activeTooltipTimer);
        hideTooltip();
      }
    });

    // 页面滚动时隐藏，防止悬浮窗悬空
    window.addEventListener('scroll', () => {
      clearTimeout(activeTooltipTimer);
      hideTooltip();
    }, { passive: true });
  }

  /* ==================== 启动 ==================== */

  async function boot() {
    // 全屏按钮：独立常驻控件，不随阶段重绘
    const fsBtn = document.getElementById('fs-btn');
    if (fsBtn) fsBtn.addEventListener('click', toggleFs);
    document.addEventListener('fullscreenchange', updateFsIcon);

    // demo 移植：悬浮窗 / 实机视窗 hover / 规则弹窗的一次性事件挂载
    // （规则弹窗静态 DOM 位于主脚本之后，须等 DOM 解析完成再绑定，boot 时还是 null）
    initTooltipGlobalEvents();
    initCombatMonitorHover();
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRulesModal);
    } else {
      initRulesModal();
    }

    // 背景视频 / BGM 配置应用
    if (OPENING_DATA.bgVideo.url) {
      bgVideo.src = OPENING_DATA.bgVideo.url;
      bgVideo.classList.remove('hidden');
      bgVideo.style.setProperty('--vid-op', String(OPENING_DATA.bgVideo.opacity || 0.6));
      bgFallback.style.display = 'none';
    }

    // 幂等检查：本聊天已初始化 → 归档摘要，不再进向导
    const vars = await TH.readChatVars();
    const done = vars ? vars.$opening_setup_done : null;
    if (done && typeof done === 'object') {
      state.doneFlag = done;
      // 恢复玩家自定义立绘候选（强制重配时可复用）
      if (Array.isArray(done.customPortraits)) state.hero3.customPortraits = done.customPortraits;
      state.stage = 'archived';
    } else {
      state.stage = 'title';
    }
    render();
  }

  // 调试/测试钩子（MMS window.MMS 同款惯例，不影响产品行为）
  window.__OPENING_DEBUG__ = { state: state, DATA: OPENING_DATA, COMBAT: COMBAT, instant: false, mergeMmsPortraitSnapshot: mergeMmsPortraitSnapshot };

  boot();
})();
</script>
