<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>开局引导 · 雾港谜案 1925</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ================= 1920 年代悬疑推理双主题系统 ================= */
  :root, body.theme-arcane {
    --noir-bg: #05070c;
    --amber: #d9b45c;
    --amber-dim: rgba(198, 161, 84, 0.55);
    --amber-glow: rgba(198, 161, 84, 0.25);
    --paper-hi: #efe6cf;
    --paper-lo: #e2d4b4;
    --ink: #2c2416;

    /* 密教金辉 (Noir Arcane) - 威廉 & 自定义主角专属 */
    --font-serif: 'Noto Serif SC', serif;
    --bg-base: #0a0d13;
    --panel-bg: rgba(13, 17, 24, 0.76);
    --panel-glass: rgba(17, 23, 33, 0.6);
    --panel-border: rgba(198, 161, 84, 0.28);
    --panel-border-bright: rgba(224, 185, 102, 0.85);
    --accent: #d9b45c;
    --accent-glow: rgba(217, 180, 92, 0.38);
    --accent-dim: rgba(198, 161, 84, 0.16);
    --text-main: #f0e6d2;
    --text-muted: rgba(232, 220, 192, 0.7);
    --slot-bg: rgba(9, 12, 18, 0.82);
    --slot-border: rgba(198, 161, 84, 0.25);
    --slot-glow: 0 0 15px rgba(217, 180, 92, 0.22);
    --card-hover: rgba(26, 34, 48, 0.75);
    --btn-bg: linear-gradient(135deg, rgba(198, 161, 84, 0.24), rgba(198, 161, 84, 0.06));
    --btn-border: rgba(198, 161, 84, 0.5);
    --tooltip-bg: rgba(11, 15, 22, 0.94);
    --tooltip-border: rgba(217, 180, 92, 0.45);
    --tooltip-glow: 0 12px 36px -4px rgba(0, 0, 0, 0.85), 0 0 20px rgba(217, 180, 92, 0.2);
  }

  /* 冯专属：琉璃暗耀 (Gilded Crystal) */
  body.theme-gilded {
    --noir-bg: #0c0816;
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.5);
    --amber-glow: rgba(192, 132, 252, 0.3);

    --bg-base: #110c1c;
    --panel-bg: rgba(22, 15, 36, 0.8);
    --panel-glass: rgba(30, 20, 50, 0.62);
    --panel-border: rgba(236, 195, 110, 0.36);
    --panel-border-bright: rgba(255, 222, 145, 0.95);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.45);
    --accent-dim: rgba(192, 132, 252, 0.18);
    --text-main: #fdf4ff;
    --text-muted: rgba(243, 232, 255, 0.7);
    --slot-bg: rgba(18, 11, 30, 0.88);
    --slot-border: rgba(216, 180, 254, 0.32);
    --slot-glow: 0 0 20px rgba(192, 132, 252, 0.32);
    --card-hover: rgba(45, 28, 72, 0.78);
    --btn-bg: linear-gradient(135deg, rgba(245, 158, 11, 0.26), rgba(192, 132, 252, 0.16));
    --btn-border: rgba(245, 158, 11, 0.6);
    --tooltip-bg: rgba(18, 12, 30, 0.95);
    --tooltip-border: rgba(236, 195, 110, 0.5);
    --tooltip-glow: 0 12px 36px -4px rgba(0, 0, 0, 0.88), 0 0 24px rgba(192, 132, 252, 0.25);
  }

  html, body { margin: 0; padding: 0; background: var(--noir-bg); transition: background-color 0.4s ease, color 0.4s ease; }
  body { font-family: 'Noto Serif SC', serif; color: #e8dcc0; overflow-x: hidden; }
  .font-tw { font-family: 'Special Elite', 'Courier New', monospace; }

  /* 环境光与装饰层 */
  #ambient-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(circle at 20% 30%, rgba(217, 180, 92, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.06) 0%, transparent 60%);
    transition: all 0.5s ease;
  }
  body.theme-gilded #ambient-glow {
    background: radial-gradient(circle at 30% 25%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.16) 0%, transparent 60%);
  }

  /* ---- 背景层：视频 / CSS 雾夜兜底 / 胶片颗粒 / 暗角 ---- */
  #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: var(--vid-op, 0.6); }
  #bg-fallback { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 110%, #101623 0%, #070a12 55%, #05070c 100%); }
  .fog { position: absolute; border-radius: 9999px; filter: blur(70px); opacity: 0.5; will-change: transform; }
  .fog-a { width: 60vw; height: 34vh; left: -10vw; bottom: -8vh;
    background: radial-gradient(closest-side, rgba(46, 64, 92, 0.55), transparent 70%);
    animation: fog-drift 26s ease-in-out infinite alternate; }
  .fog-b { width: 46vw; height: 30vh; right: -8vw; top: 4vh;
    background: radial-gradient(closest-side, rgba(198, 161, 84, 0.14), transparent 70%);
    animation: fog-drift 34s ease-in-out infinite alternate-reverse; }
  .fog-c { width: 36vw; height: 22vh; left: 30vw; top: 30vh;
    background: radial-gradient(closest-side, rgba(38, 52, 74, 0.5), transparent 70%);
    animation: fog-drift 40s ease-in-out infinite alternate; }
  @keyframes fog-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vw, -3vh, 0) scale(1.15); } }
  #grain { position: fixed; inset: -40px; z-index: 2; pointer-events: none; opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    animation: grain-shift 1.1s steps(3) infinite; }
  @keyframes grain-shift { 0% { transform: translate(0, 0); } 33% { transform: translate(-14px, 9px); } 66% { transform: translate(11px, -13px); } 100% { transform: translate(0, 0); } }
  #vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(115% 100% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.62) 100%); }

  /* ---- 玻璃拟态面板 ---- */
  .glass { background: var(--panel-bg); backdrop-filter: blur(20px) saturate(1.15);
    -webkit-backdrop-filter: blur(20px) saturate(1.15);
    border: 1px solid var(--panel-border); border-radius: 12px;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: border-color 0.3s ease, background 0.3s ease; }
  .glass-soft { background: var(--panel-glass); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border: 1px solid var(--panel-border); border-radius: 8px; }

  /* ---- 按钮 ---- */
  .btn-noir { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.62rem 1.7rem; border: 1px solid var(--btn-border); color: var(--accent); cursor: pointer;
    background: var(--btn-bg); letter-spacing: 0.18em; font-size: 0.92rem; border-radius: 6px;
    font-weight: 700; transition: all 0.35s ease; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
  .btn-noir:hover:not(:disabled) { background: rgba(198, 161, 84, 0.24); box-shadow: 0 0 20px var(--accent-glow); border-color: var(--accent); transform: translateY(-1px); }
  .btn-noir:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 1.1rem;
    border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-muted); cursor: pointer;
    background: transparent; font-size: 0.82rem; letter-spacing: 0.1em; border-radius: 6px; transition: all 0.3s ease; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text-main); }

  /* ---- 全屏按钮（fixed 右上圆形半透明钮，z-100） ---- */
  .fs-btn { position: fixed; top: 16px; right: 16px; z-index: 100; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid rgba(198, 161, 84, 0.4); border-radius: 9999px; color: rgba(232, 220, 192, 0.75);
    background: rgba(13, 16, 22, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s ease; }
  .fs-btn:hover { background: rgba(198, 161, 84, 0.24); box-shadow: 0 0 16px var(--amber-glow); border-color: var(--amber); color: #e6cf9a; }
  .fs-btn svg { width: 18px; height: 18px; }

  /* ---- 卡片（技能/物品/立绘可选卡） ---- */
  .card { border: 1px solid var(--slot-border); border-radius: 8px; cursor: pointer;
    background: var(--slot-bg); transition: all 0.3s ease; }
  .card:hover { border-color: var(--panel-border-bright); background: var(--card-hover); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow), inset 0 0 10px rgba(198, 161, 84, 0.08);
    background: rgba(34, 30, 16, 0.65); }

  /* 大尺寸角色立绘展台（破框沉浸，去除狭窄黑框留白，与右侧等高对齐） */
  .portrait-podium {
    position: relative; width: 100%; min-height: 520px; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden; border-radius: 12px; padding: 20px;
    background: radial-gradient(circle at 50% 55%, var(--accent-dim) 0%, transparent 70%), var(--panel-bg);
    border: 1px solid var(--panel-border);
  }
  .portrait-wrapper {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 0; overflow: hidden;
  }
  .portrait-img {
    height: 100%; max-height: 480px; width: auto; object-fit: contain;
    filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.85));
    -webkit-mask-image: linear-gradient(to bottom, black 84%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 84%, transparent 100%);
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .hero-swap-in { animation: hero-swap 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes hero-swap {
    0% { opacity: 0; transform: scale(0.96) translateY(14px); filter: brightness(1.4) blur(4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) blur(0); }
  }

  /* 语音跳动声波 */
  .voice-wave { display: flex; align-items: center; gap: 3px; height: 18px; }
  .voice-bar { width: 3px; height: 100%; background-color: var(--accent); border-radius: 2px;
    animation: wave-bar 0.8s ease-in-out infinite alternate; }
  .voice-bar:nth-child(1) { animation-delay: 0.1s; height: 35%; }
  .voice-bar:nth-child(2) { animation-delay: 0.3s; height: 75%; }
  .voice-bar:nth-child(3) { animation-delay: 0.15s; height: 100%; }
  .voice-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
  .voice-bar:nth-child(5) { animation-delay: 0.25s; height: 40%; }
  @keyframes wave-bar { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }
  .voice-wave.paused .voice-bar { animation-play-state: paused; transform: scaleY(0.3); }

  /* 技能插槽阶梯式滑入芯片（demo 移植：现代过渡动效 + 主题化样式） */
  .skill-slot-chip {
    background: var(--slot-bg); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 6px 12px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; overflow: hidden; animation: slot-slide-in 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--slot-idx, 0) * 0.04s);
  }
  @keyframes slot-slide-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
  /* 技能列表按各职业最坏高度预留：切换职业时右栏外框高度恒定不跳动 */
  #hero-skill-chips-container { min-height: 335px; }
  /* 自定义角色两步同款预留：6 槽芯片随效果胶囊换行数变化，按最坏高度恒定外框 */
  #c3-limited-slots-container { min-height: 250px; }
  #c3-equipped-slots-grid { min-height: 250px; }
  .skill-slot-chip:before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: var(--slot-border); transition: background 0.25s ease;
  }
  .skill-slot-chip.type-generic:before { background: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.5); }
  /* 威廉专属技能芯片：纯金流光镶边 + 密教金辉全光晕 (Gilded Arcane) */
  .skill-slot-chip.theme-gold:before,
  .skill-slot-chip.type-limited:before {
    background: linear-gradient(to bottom, #fbbf24 0%, #d9b45c 50%, #92400e 100%);
    box-shadow: 0 0 12px rgba(217, 180, 92, 0.75), 0 0 6px rgba(251, 191, 36, 0.5);
  }
  .skill-slot-chip.theme-gold {
    border-color: rgba(217, 180, 92, 0.32);
    background: linear-gradient(90deg, rgba(217, 180, 92, 0.06) 0%, rgba(26, 20, 14, 0.55) 22%, rgba(15, 12, 10, 0.78) 100%);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55), 0 0 10px rgba(217, 180, 92, 0.12);
  }
  .skill-slot-chip.theme-gold:hover {
    border-color: rgba(217, 180, 92, 0.75);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.75), 0 0 16px rgba(217, 180, 92, 0.35);
  }
  /* 冯专属技能芯片：金色点缀流光镶边 + 炼金深紫底色 (Alchemy Gilded) */
  .skill-slot-chip.theme-purple:before {
    background: linear-gradient(to bottom, #f59e0b 0%, #d9b45c 40%, #c084fc 100%);
    box-shadow: 0 0 10px rgba(217, 180, 92, 0.65), 0 0 6px rgba(192, 132, 252, 0.4);
  }
  .skill-slot-chip.theme-purple {
    border-color: rgba(217, 180, 92, 0.28);
    background: linear-gradient(90deg, rgba(217, 180, 92, 0.05) 0%, rgba(28, 18, 45, 0.55) 22%, rgba(16, 12, 28, 0.75) 100%);
  }
  .skill-slot-chip.theme-purple:hover {
    border-color: rgba(217, 180, 92, 0.65);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(217, 180, 92, 0.25);
  }
  /* 高阶技能 (Tier 2)：金色跑马流光与璀璨耀芒横扫动效 */
  .skill-slot-chip.tier-advanced {
    border-color: rgba(251, 191, 36, 0.7);
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.16) 0%, rgba(38, 26, 12, 0.72) 32%, rgba(18, 14, 8, 0.88) 100%);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.75), 0 0 20px rgba(245, 158, 11, 0.35);
    position: relative;
    overflow: hidden;
    animation: tier-adv-glow 2.8s ease-in-out infinite alternate;
  }
  @keyframes tier-adv-glow {
    0% { border-color: rgba(245, 158, 11, 0.55); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(245, 158, 11, 0.25); }
    100% { border-color: rgba(251, 191, 36, 0.95); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.8), 0 0 24px rgba(251, 191, 36, 0.55); }
  }
  .skill-slot-chip.tier-advanced:before {
    background: linear-gradient(to bottom, #fffbeb 0%, #fbbf24 45%, #d97706 100%);
    box-shadow: 0 0 16px rgba(251, 191, 36, 0.95), 0 0 8px #fff;
    width: 3.5px;
  }
  .skill-slot-chip.tier-advanced:after {
    content: ''; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.18) 50%, rgba(251, 191, 36, 0.3) 65%, transparent 100%);
    transform: skewX(-24deg); animation: advanced-shimmer 4.4s ease-in-out infinite; pointer-events: none;
  }
  @keyframes advanced-shimmer { 0% { left: -120%; } 30% { left: 180%; } 100% { left: 180%; } }
  /* 传奇技能 (Tier 3)：赤红传说炽烈光焰与猩红烈焰横扫动效 */
  .skill-slot-chip.tier-legendary {
    border-color: rgba(239, 68, 68, 0.8);
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.2) 0%, rgba(48, 12, 16, 0.78) 32%, rgba(24, 8, 10, 0.92) 100%);
    box-shadow: 0 6px 28px rgba(0, 0, 0, 0.8), 0 0 24px rgba(239, 68, 68, 0.45);
    position: relative;
    overflow: hidden;
    animation: tier-legend-red-glow 2.6s ease-in-out infinite alternate;
  }
  @keyframes tier-legend-red-glow {
    0% { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 6px 22px rgba(0, 0, 0, 0.75), 0 0 16px rgba(239, 68, 68, 0.3); }
    100% { border-color: rgba(248, 113, 113, 0.98); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85), 0 0 28px rgba(239, 68, 68, 0.75); }
  }
  .skill-slot-chip.tier-legendary:before {
    background: linear-gradient(to bottom, #fee2e2 0%, #ef4444 45%, #991b1b 100%);
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.95), 0 0 8px #fff;
    width: 3.5px;
  }
  .skill-slot-chip.tier-legendary:after {
    content: ''; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, rgba(239, 68, 68, 0.45) 65%, transparent 100%);
    transform: skewX(-24deg); animation: legendary-red-shimmer 4.0s ease-in-out infinite; pointer-events: none;
  }
  @keyframes legendary-red-shimmer { 0% { left: -120%; } 30% { left: 180%; } 100% { left: 180%; } }

  /* 职业选项卡卡片 */
  .class-tab-card {
    background: var(--panel-glass); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 14px; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  }
  .class-tab-card:hover { border-color: var(--panel-border-bright); background: var(--card-hover); transform: translateY(-2px); }
  .class-tab-card.active { border-color: var(--accent); background: linear-gradient(150deg, var(--card-hover), var(--accent-dim)); box-shadow: 0 0 20px var(--accent-glow); }
  .class-tab-card.active:before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* 技能备选卡片（购点） */
  .skill-pick-card {
    background: var(--slot-bg); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.25s ease; position: relative;
  }
  .skill-pick-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--slot-glow); }
  .skill-pick-card.selected { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 14px var(--accent-glow); }
  .skill-pick-card.selected:after {
    content: 'EQUIPPED'; position: absolute; top: 6px; right: 8px;
    font-family: 'Special Elite', 'Courier New', monospace; font-size: 0.55rem; font-weight: 700;
    letter-spacing: 0.08em; color: var(--accent); background: rgba(0, 0, 0, 0.75);
    padding: 1px 4px; border-radius: 3px; border: 1px solid var(--accent); pointer-events: none;
  }

  /* 台词字幕气泡（悬浮式：默认隐藏，播放语音时浮出于顶部信息块下方，不占文档流高度） */
  .dialogue-bubble {
    background: rgba(10, 14, 22, 0.88); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    position: absolute; top: calc(100% + 10px); left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: flex-start; overflow: hidden;
    opacity: 0; transform: translateY(-6px) scale(0.98); pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dialogue-bubble.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  #hero-dialogue-quote {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis; line-height: 1.45;
  }

  /* 能量点数条 */
  .energy-meter { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden; }
  .energy-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #fff);
    border-radius: 9999px; box-shadow: 0 0 10px var(--accent); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

  /* 跨阶段电影级柔和转场动效 (250ms 淡出 + 300ms 淡入) */
  .stage-fade-out {
    opacity: 0 !important; transform: translateY(-8px) scale(0.995) !important;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    pointer-events: none;
  }
  .stage-fade-in {
    opacity: 1 !important; transform: translateY(0) scale(1) !important;

      if ((m = t.match(/^(.+?)\s*;\s*power\s*[:：]\s*(-?\d+)(?:\s*;\s*turns\s*[:：]\s*(\d+))?$/))) {
        if (slot < 3) {
          slot++;
          entry.data[slot === 1 ? 'type' : 'type' + slot] = '[' + m[1].trim() + ']';
          entry.data[slot === 1 ? 'power' : 'power' + slot] = parseInt(m[2], 10);
        }
        continue;
      }
      if ((m = t.match(/^(MP|HP|TP)\s*[:：]\s*(\d+)$/i))) {
        const v = parseInt(m[2], 10);
        if (m[1].toUpperCase() === 'MP') entry.data.cost = v;
        else if (m[1].toUpperCase() === 'HP') entry.data.hpCost = v;
        else entry.data.tpCost = v;
        continue;
      }
      if ((m = t.match(/^延迟\s*[:：]\s*(\d+)$/))) { entry.data.delay = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^加速\s*[:：]\s*(\d+)$/))) { entry.data.haste = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^限(\d+)次$/))) { entry.data.maxUses = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^(?:Hit|Aim)\s*[:：]\s*(\d+)$/i))) { entry.data.hit = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^(?:Turns?|持续|回)\s*[:：]\s*(\d+)$/i))) { entry.data.turns = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^暴击\s*[:：]\s*(\d+)\s*%?$/))) { entry.data.critRate = Math.max(0, Math.min(100, parseInt(m[1], 10))); continue; }
      if ((m = t.match(/^反应(?:\s*[:：]\s*(近战|远程|法术))?\s*$/))) { entry.data.isReaction = true; entry.data.reactionTarget = m[1] || 'all'; continue; }
      if ((m = t.match(/^看破(?:\s*[:：]\s*(近战|远程|法术|all))?\s*$/))) { entry.data.kanpoTarget = m[1] || 'all'; continue; }
      if ((m = t.match(/^舍身(?:\s*[:：]\s*(近战|远程|法术|all))?\s*$/))) { entry.data.sheshenTarget = m[1] || 'all'; continue; }
      if ((m = t.match(/^召唤\s*[:：]\s*(.+)$/))) { entry.data.summonTarget = m[1].trim(); continue; }
      if (t === '他人') { entry.data.isOthers = true; continue; }
      if (t === '必中') { entry.data.guaranteedHit = true; continue; }
      if (t === '转火') { entry.data.switchTarget = true; continue; }
      if (t === '高阶') { entry.data.isHighTier = true; continue; }
      if (t === '传奇' || t === '神术') { entry.data.isLegendary = true; continue; }
      if (t === '近战' || t === '远程' || t === '法术') { entry.data.damageType = t; continue; }
      if ((m = t.match(/^特效\s*[:：]\s*(.+)$/))) { entry.data.fxTag = m[1].trim(); continue; }
      if ((m = t.match(/^肃正\s*[:：]\s*(.+)$/))) { entry.data.barrierSub = m[1].trim(); continue; }
      // 裸效果槽（无 power，兜底 20）与冒号简写效果槽
      const colon = t.match(/^(.+?)\s*[:：]\s*(\d+)$/);
      const base = colon ? colon[1].trim() : t;
      if (SLOT_NAMES.indexOf(base) >= 0 && slot < 3) {
        slot++;
        entry.data[slot === 1 ? 'type' : 'type' + slot] = '[' + base + ']';
        entry.data[slot === 1 ? 'power' : 'power' + slot] = colon ? parseInt(colon[2], 10) : 20;
      }
    }
    return true;
  }
  // 物品行解析：标签体系镜像 RpgCombat parseItem（类别/数量/次数/绑定），效果槽留待战斗端 YAML 提供
  function parseItemLine(raw, entry) {
    const nm = raw.match(/【([^】]+)】/);
    if (!nm) return false;
    entry.data.name = nm[1].trim();
    const tags = raw.match(/\[([^\[\]]+)\]/g) || [];
    for (let i = 0; i < tags.length; i++) {
      const t = tags[i].slice(1, -1).trim();
      let m;
      if (t === '弹药' || t === '消耗品' || t === '道具') { entry.data.category = t; continue; }
      if ((m = t.match(/^数量\s*[:：]\s*(\d+)$/))) { entry.data.count = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^次数\s*[:：]\s*(\d+)$/))) { entry.data.maxUses = parseInt(m[1], 10); continue; }
      if ((m = t.match(/^绑定\s*[:：]\s*(.+)$/))) {
        m[1].split(/[;；]/).forEach(function (seg) {
          const s = seg.trim(); if (!s) return;
          const b = s.match(/^(.*?)\s*[*×xX]\s*(\d+)$/);
          entry.data.bindings.push(b ? { skillName: b[1].trim(), cost: parseInt(b[2], 10) } : { skillName: s, cost: 1 });
        });
        continue;
      }
    }
    return true;
  }
  function parseAttrLine(s) {
    const cfg = { img: null, classType: '', isWise: false, maxHp: 0, maxMp: 0, maxTp: 100, atk: 0, def: 0, spd: 0, actCount: 1 };
    let m;
    if ((m = s.match(/\[HP\s*[:：]\s*(\d+)\s*\/\s*(\d+)\]/))) cfg.maxHp = parseInt(m[2], 10);
    if ((m = s.match(/\[MP\s*[:：]\s*(\d+)\s*\/\s*(\d+)\]/))) cfg.maxMp = parseInt(m[2], 10);
    if ((m = s.match(/\[Atk\s*[:：]\s*(\d+)\]/i))) cfg.atk = parseInt(m[1], 10);
    if ((m = s.match(/\[Armor\s*[:：]\s*(\d+)\]/i))) cfg.def = parseInt(m[1], 10);
    if ((m = s.match(/\[Speed\s*[:：]\s*(\d+)\]/i))) cfg.spd = parseInt(m[1], 10);
    if ((m = s.match(/\[(?:职业|职阶|Class|Role)\s*[:：]\s*([^\]]+)\]/i))) cfg.classType = m[1].trim();
    if ((m = s.match(/\[(?:行动次数|Act)\s*[:：]\s*(\d+)\]/i))) cfg.actCount = parseInt(m[1], 10);
    return cfg;
  }
  function parseCombatBlock(text) {
    const classes = {};
    const lines = String(text).split('\n');
    let cur = null;
    function finalize() {
      if (cur && cur.className && cur.config) classes[cur.className] = cur;
      cur = null;
    }
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*-\s*角色\s*:\s*$/.test(lines[i])) { finalize(); cur = { className: '', config: null, skills: [], items: [], inItems: false }; continue; }
      if (!cur) continue;
      let m = lines[i].match(/^\s*名字\s*[:：]\s*"([^"]+)"\s*$/);
      if (m) { cur.className = m[1].trim(); cur.inItems = false; continue; }
      m = lines[i].match(/^\s*属性\s*[:：]\s*"([^"]+)"\s*$/);
      if (m) { cur.config = parseAttrLine(m[1]); cur.inItems = false; continue; }
      if (/^\s*技能\s*[:：]\s*$/.test(lines[i])) { cur.inItems = false; continue; }
      if (/^\s*物品\s*[:：]\s*$/.test(lines[i])) { cur.inItems = true; continue; }
      m = lines[i].match(/^\s*-\s*"(.+)"\s*$/);
      if (m) {
        if (cur.inItems) {
          const itemEntry = { id: '', data: emptyItemData() };
          if (parseItemLine(m[1], itemEntry)) {
            itemEntry.id = itemEntry.data.name;
            cur.items.push(itemEntry);
          }
          continue;
        }
        const entry = { id: '', shopCost: 1, scope: '', srcClass: '', data: emptySkillData() };
        if (parseSkillLine(m[1], entry)) {
          entry.id = entry.data.name;
          entry.srcClass = cur.className;
          entry.rawText = m[1];
          cur.skills.push(entry);
        }
      }
    }
    finalize();
    return { classes: classes, errors: [] };
  }
  function validateCombat(c) {
    const errs = [];
    ['隐匿者', '狂战士', '防守者', '风行者', '施法者', '圣职者', '灾厄使'].forEach(function (cls) {
      const cc = c.classes[cls];
      if (!cc) { errs.push('缺少职业段：' + cls); return; }
      if (cc.skills.length !== 6) errs.push(cls + ' 技能数≠6（' + cc.skills.length + '）');
      const lim = cc.skills.filter(function (s) { return s.scope === '限定'; }).length;
      const gen = cc.skills.filter(function (s) { return s.scope === '通用'; }).length;
      if (lim !== 3 || gen !== 3) errs.push(cls + ' 限定/通用 ≠ 3/3（' + lim + '/' + gen + '）');
      if (!cc.config || !cc.config.classType) errs.push(cls + ' 缺属性行');
      const skillNames = {};
      cc.skills.forEach(function (s) { skillNames[s.data.name] = 1; });
      const itemNames = {};
      (cc.items || []).forEach(function (it) {
        if (itemNames[it.data.name]) errs.push(cls + ' 物品名重复：' + it.data.name);
        itemNames[it.data.name] = 1;
        (it.data.bindings || []).forEach(function (b) {
          if (!skillNames[b.skillName]) errs.push(cls + ' 物品「' + it.data.name + '」绑定的技能不存在：' + b.skillName);
        });
      });
    });
    const seen = {};
    Object.keys(c.classes).forEach(function (cls) {
      c.classes[cls].skills.forEach(function (s) {
        if (seen[s.data.name]) errs.push('技能名重复：' + s.data.name);
        seen[s.data.name] = 1;
      });
    });
    return errs;
  }

  function getBgmUrlForStage(stage) {
    const d = OPENING_DATA.bgm;

  let bgmFadeTimer = null;
  function updateBgmForStage(targetStage) {
    const targetUrl = getBgmUrlForStage(targetStage);
    if (!targetUrl || !bgm) return;

    const currentSrc = bgm.src || '';
    const isSameSong = currentSrc && (
      currentSrc === targetUrl ||
      currentSrc.indexOf(encodeURI(targetUrl)) >= 0 ||
      encodeURI(currentSrc).indexOf(encodeURI(targetUrl)) >= 0 ||
      currentSrc.split('?')[0].split('#')[0] === targetUrl.split('?')[0].split('#')[0]
    );

    if (isSameSong) {
      if (state.soundOn && bgm.paused) {
        bgm.volume = 0.55;
        bgm.play().catch(function () { /* 静默 */ });
      } else if (!state.soundOn && !bgm.paused) {
        bgm.pause();
      }
      return;
    }

    if (bgmFadeTimer) {
      clearInterval(bgmFadeTimer);
      bgmFadeTimer = null;
    }

    if (!state.soundOn) {
      bgm.pause();
      bgm.src = targetUrl;
      return;
    }

    // 平滑淡出后切换
    bgmFadeTimer = setInterval(function () {
      if (bgm.volume > 0.08) {
        bgm.volume = Math.max(0, bgm.volume - 0.08);
      } else {
        clearInterval(bgmFadeTimer);
        bgmFadeTimer = null;
        bgm.pause();
        bgm.src = targetUrl;
        bgm.volume = 0;
        bgm.play().then(function () {
          let vol = 0;
          bgmFadeTimer = setInterval(function () {
            vol += 0.08;
            if (vol >= 0.55) {
              bgm.volume = 0.55;
              clearInterval(bgmFadeTimer);
              bgmFadeTimer = null;
            } else {
              bgm.volume = vol;
            }
          }, 35);
        }).catch(function () { /* 静默 */ });
      }
    }, 25);
  }

  function extractMechanicsKeys(rawText, skillName = null) {
    const keys = [];
    if (!rawText) return keys;
    if (rawText.includes('看破')) keys.push('看破');
    if (rawText.includes('反应')) keys.push('反应');
    if (rawText.includes('舍身')) keys.push('舍身');
    if (rawText.includes('反击')) keys.push('反击');
    if (rawText.includes('肃正')) keys.push('肃正');
    if (rawText.includes('免伤')) keys.push('免伤');
    if (rawText.includes('再动')) keys.push('再动');
    if (rawText.includes('延迟')) keys.push('延迟');
    if (rawText.includes('加速')) keys.push('加速');
    if (rawText.includes('眩晕')) keys.push('眩晕');
    if (rawText.includes('召唤')) keys.push('召唤');
    if (rawText.includes('单速') || rawText.includes('群速')) keys.push('单速');
    if (rawText.includes('单缓') || rawText.includes('群缓')) keys.push('目标缓速');
    if (rawText.includes('单滞') || rawText.includes('群滞') || rawText.includes('降避')) keys.push('目标降避');
    if (rawText.includes('单避') || rawText.includes('群避')) keys.push('持续闪避');
    if (rawText.includes('单盾') || rawText.includes('群盾') || rawText.includes('护盾')) keys.push('护盾吸收');
    if (rawText.includes('单降') || rawText.includes('群降') || rawText.includes('降防')) keys.push('目标降防');
    if (rawText.includes('单防') || rawText.includes('群防') || rawText.includes('加防')) keys.push('目标加防');
    if (rawText.includes('单弱') || rawText.includes('群弱') || rawText.includes('降攻')) keys.push('目标降攻');
    if (rawText.includes('单增') || rawText.includes('群增') || rawText.includes('增攻')) keys.push('目标增攻');
    if (rawText.includes('单盲') || rawText.includes('群盲') || rawText.includes('致盲')) keys.push('目标致盲');
    if (rawText.includes('单瞄') || rawText.includes('群瞄') || rawText.includes('瞄准')) keys.push('目标瞄准');
    if (rawText.includes('单冲') || rawText.includes('群冲') || rawText.includes('充能')) keys.push('战技充能');

    // 仇恨与隐匿判断：若为负仇恨或包含隐匿，提取隐匿；正仇恨提取仇恨嘲讽
    const tauntMatches = rawText.match(/\[嘲讽(?:;[^\]]*)?\]/g) || [];
    let hasTauntPositive = false;
    let hasTauntNegative = rawText.includes('隐匿');
    tauntMatches.forEach(t => {
      if (t.includes('-')) {
        hasTauntNegative = true;
      } else {
        hasTauntPositive = true;
      }
    });
    if (hasTauntNegative) keys.push('隐匿');
    if (hasTauntPositive) keys.push('仇恨嘲讽');

    if (/限\d+次|限用/.test(rawText)) keys.push('场次限制');
    if (rawText.includes('自盲') || rawText.includes('自降') || rawText.includes('自弱')) keys.push('自身致盲');
    if (rawText.includes('必中')) keys.push('必中');
    if (rawText.includes('暴击')) keys.push('暴击');
    if (rawText.includes('穿透')) keys.push('穿透');
    if (rawText.includes('散射') || rawText.includes('霰弹')) keys.push('散射');
    if (rawText.includes('转火')) keys.push('转火');
    if (rawText.includes('回避')) keys.push('回避');
    if (rawText.includes('麻痹')) keys.push('麻痹');
    if (rawText.includes('中毒')) keys.push('中毒');
    if (rawText.includes('燃烧')) keys.push('燃烧');
    if (rawText.includes('他人')) keys.push('他人');
    if (rawText.includes('驱散')) keys.push('驱散');

    // MP 以外的资源消耗说明（生命消耗、战技点消耗、弹药材料）
    if (/\[HP:\d+\]/i.test(rawText)) keys.push('生命消耗');
    if (/\[TP:\d+\]/i.test(rawText)) keys.push('战技点消耗');
    if (rawText.includes('子弹') || rawText.includes('鹿弹') || rawText.includes('道具') || rawText.includes('消耗品') || (skillName && GLOBAL_AMMO_BINDINGS[skillName])) {
      keys.push('材料绑定');
    }

    return Array.from(new Set(keys));
  }

  /* 具有持续生效时间的机制列表与其匹配标签正则 */
  const DURATION_MECH_PATTERNS = {
    '目标致盲': [/^(?:单盲|群盲|致盲)/i],
    '自身致盲': [/^(?:自盲|自降|自弱)/i],
    '目标降防': [/^(?:单降|群降|降防)/i],
    '目标加防': [/^(?:单防|群防|加防)/i],
    '目标降攻': [/^(?:单弱|群弱|降攻)/i],
    '目标增攻': [/^(?:单增|群增|增攻)/i],
    '目标缓速': [/^(?:单缓|群缓|缓速)/i],
    '单速': [/^(?:单速|群速|加速)/i],
    '目标降避': [/^(?:单滞|群滞|降避)/i],
    '持续闪避': [/^(?:单避|群避|闪避)/i],
    '护盾吸收': [/^(?:单盾|群盾|护盾)/i],
    '目标瞄准': [/^(?:单瞄|群瞄|瞄准)/i],
    '隐匿': [/^(?:隐匿)/i],
    '仇恨嘲讽': [/^(?:嘲讽)/i],
    '中毒': [/^(?:中毒|群中毒)/i],
    '燃烧': [/^(?:燃烧|群燃烧)/i],
    '麻痹': [/^(?:麻痹|群麻痹)/i],
    '眩晕': [/^(?:眩晕|击晕)/i],
    '延迟': [/^(?:延迟)/i]
  };

  /* 获取特定机制或效果在指定技能中的生效回合数（瞬发或被动规则返回 null） */
  function getMechTurns(mechKey, rawText, matchedTagStr = null) {
    if (!mechKey || !DURATION_MECH_PATTERNS[mechKey]) return null;

    let targetTag = matchedTagStr;
    if (!targetTag && rawText) {
      const tags = rawText.match(/\[([^\]]+)\]/g) || [];
      for (const t of tags) {
        const inner = t.slice(1, -1).trim();
        const parts = inner.split(/[;；]/);
        const mainPart = parts[0].trim();

        if (mechKey === '隐匿') {
          if (mainPart === '隐匿' || (mainPart.includes('嘲讽') && parts.some(p => p.includes('-')))) {
            targetTag = inner;
            break;
          }
        } else if (mechKey === '仇恨嘲讽') {
          if (mainPart.includes('嘲讽') && !parts.some(p => p.includes('-'))) {
            targetTag = inner;
            break;
          }
        } else if (DURATION_MECH_PATTERNS[mechKey].some(pat => pat.test(mainPart))) {
          targetTag = inner;
          break;
        }
      }
    }

    // 1. 优先匹配该标签片段自带的 ;turns:N
    if (targetTag) {
      const tm = targetTag.match(/;turns?[:：](\d+)/i);
      if (tm) return parseInt(tm[1], 10);
    }

    // 2. 自盲专属规则：用户明确指定"自盲基本都是2回合，造雾术是和敌方debuff区分开的"
    if (mechKey === '自身致盲') return 2;

    // 3. 眩晕（跳过行动）：默认 1 回合
    if (mechKey === '眩晕') return 1;

    // 4. 延迟蓄力准备
    if (mechKey === '延迟') {
      if (targetTag) {
        const dm = targetTag.match(/延迟[:：](\d+)/i);
        if (dm) return parseInt(dm[1], 10);
      }
      return 1;
    }

    // 5. 检查全局顶级 [Turns:N] 或 [持续:N] 声明
    if (rawText) {
      const gm = rawText.match(/\[(?:Turns?|持续)[:：](\d+)/i);
      if (gm) return parseInt(gm[1], 10);
    }

    // 6. 其他持续性 Buff / Debuff 状态遵循底层引擎默认 3 回合
    return 3;
  }

  function formatSkillEffectPills(rawText) {
    if (!rawText) return '';
    let clean = rawText.replace(/【[^】]+】/, '');
    // 彻底剥离重复后台前缀
    clean = clean.replace(/\[(限定|通用)\]/g, '');
    clean = clean.replace(/\[价:\d+\]/g, '');
    clean = clean.replace(/\[MP:\d+\]/g, '');
    clean = clean.replace(/\[HP:\d+\]/g, '');
    clean = clean.replace(/\[TP:\d+\]/g, '');
    clean = clean.replace(/\[特效:[^\]]+\]/g, '');

    const hasOthers = rawText.includes('[他人]') || rawText.includes('他人');
    const targetOrSelf = hasOthers ? '目标' : '自身';

    const tagMatches = clean.match(/\[([^\]]+)\]/g) || [];
    if (tagMatches.length === 0) {
      return '<span class="text-[0.65rem] text-white/30 font-mono">无特殊效果</span>';
    }

    const pills = [];
    tagMatches.forEach(tagStr => {
      const inner = tagStr.slice(1, -1).trim();
      const parts = inner.split(/[;；]/);
      const mainPart = parts[0].trim();
      let powerVal = null;
      let extraTurns = null;
      parts.slice(1).forEach(p => {
        const pm = p.match(/power:(-?\d+)/i);
        if (pm) powerVal = pm[1];
        const tm = p.match(/turns:(\d+)/i);
        if (tm) extraTurns = tm[1];
      });

      let displayLabel = '';
      let displayVal = powerVal;

      if (/^持续[:：](\d+)/i.test(mainPart) || /^Turns?[:：](\d+)/i.test(mainPart)) {
        // 持续回合已统一移至右侧命中率之前专属时序徽章展示，左侧胶囊彻底去除以防冗余
        return;
      } else if (/^Aim[:：](\d+)/i.test(mainPart) || /^Hit[:：](\d+)/i.test(mainPart) || mainPart === '必中') {
        // 右侧状态列已专设金色命中率栏，左侧胶囊彻底去除以防冗余
        return;
      } else if (/^加速[:：](\d+)/i.test(mainPart) || /^单速[:：](\d+)/i.test(mainPart) || mainPart === '单速') {
        const m = mainPart.match(/^(?:加速|单速)[:：](\d+)/i);
        displayLabel = `${targetOrSelf}加速`;
        displayVal = m ? `+${m[1]}` : (powerVal ? `+${powerVal}` : null);
      } else if (/^单冲[:：](\d+)/i.test(mainPart) || mainPart === '单冲') {
        const m = mainPart.match(/^单冲[:：](\d+)/i);
        displayLabel = `${targetOrSelf}充能`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单瞄[:：](\d+)/i.test(mainPart) || mainPart === '单瞄') {
        const m = mainPart.match(/^单瞄[:：](\d+)/i);
        displayLabel = `${targetOrSelf}瞄准`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单防[:：](\d+)/i.test(mainPart) || mainPart === '单防') {
        const m = mainPart.match(/^单防[:：](\d+)/i);
        displayLabel = `${targetOrSelf}加防`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单避[:：](\d+)/i.test(mainPart) || mainPart === '单避') {
        const m = mainPart.match(/^单避[:：](\d+)/i);
        displayLabel = `${targetOrSelf}闪避`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单增[:：](\d+)/i.test(mainPart) || mainPart === '单增') {
        const m = mainPart.match(/^单增[:：](\d+)/i);
        displayLabel = `${targetOrSelf}增攻`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单盾[:：](\d+)/i.test(mainPart) || mainPart === '单盾') {
        const m = mainPart.match(/^单盾[:：](\d+)/i);
        displayLabel = `${targetOrSelf}护盾`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单回[:：](\d+)/i.test(mainPart) || mainPart === '单回') {
        const m = mainPart.match(/^单回[:：](\d+)/i);
        displayLabel = `${targetOrSelf}回复`;
        displayVal = m ? m[1] : powerVal;
      } else if (/^单回蓝[:：](\d+)/i.test(mainPart) || mainPart === '单回蓝') {
        const m = mainPart.match(/^单回蓝[:：](\d+)/i);
        displayLabel = `${targetOrSelf}回蓝`;
        displayVal = m ? m[1] : powerVal;
      } else if (mainPart === '嘲讽' || mainPart === '隐匿') {
        const isNeg = (powerVal != null && (Number(powerVal) < 0 || String(powerVal).startsWith('-'))) || mainPart === '隐匿';
        if (isNeg) {
          displayLabel = `${targetOrSelf}隐匿`;
          displayVal = powerVal != null ? String(Math.abs(Number(powerVal))) : null;
        } else {
          displayLabel = `${targetOrSelf}嘲讽`;
          displayVal = powerVal != null ? String(powerVal) : null;
        }
      } else if (/^延迟[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^延迟[:：](\d+)/i);
        displayLabel = '蓄力';
        displayVal = (m ? m[1] : '') + '回合';
      } else if (/^暴击[:：](\d+)%?/i.test(mainPart)) {
        const m = mainPart.match(/^暴击[:：](\d+)%?/i);
        displayLabel = '暴击';
        displayVal = (m ? m[1] : '') + '%';
      } else if (/^限(\d+)次/i.test(mainPart)) {
        const m = mainPart.match(/^限(\d+)次/i);
        displayLabel = '限用';
        displayVal = (m ? m[1] : '') + '次';
      } else if (/^(?:反应|舍身|看破)(?::([^\]]+))?/i.test(mainPart)) {
        // 右上角已专设金色战术机制徽章（如【⟲反应·近战】、【舍身·近战】、【看破·法术】），下方胶囊中不再重复显示
        return;
      } else if (/^肃正(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^肃正(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `肃正·${m[1]}` : '绝对肃正';
      } else if (/^召唤(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^召唤(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `召唤·${m[1]}` : '战术召唤';
      } else if (/^散射(?:\([^)]+\))?/i.test(mainPart)) {
        displayLabel = '散射伤害';
      } else if (/^群散射(?:\([^)]+\))?/i.test(mainPart)) {
        displayLabel = '群体散射';
      } else if (/^单体(?:\([^)]+\))?/i.test(mainPart)) {
        // 括号备注（光、火焰、枪击等）只是特效标签，技能栏统一改为【单体伤害】
        displayLabel = '单体伤害';
      } else if (/^穿透(?:\([^)]+\))?/i.test(mainPart)) {
        displayLabel = '单体穿透';
      } else if (mainPart === '他人' || mainPart === '友方' || mainPart === '友方目标') {
        displayLabel = '他人';
        displayVal = null;
      } else if (mainPart === '法术' || mainPart === '近战' || mainPart === '远程' || mainPart === '高阶' || mainPart === '传奇') {
        // 头部与阶级徽章已标注伤害属性与阶级，效果行内无需重复
        return;
      } else if (/^(群驱散|驱散)(?::(\d+))?/i.test(mainPart)) {
        const m = mainPart.match(/^(群驱散|驱散)(?::(\d+))?/i);
        const isGroup = m[1].includes('群');
        displayLabel = isGroup ? '群体净化' : '单体净化';
        displayVal = m[2] ? m[2] + '层' : null;
      } else if (TAG_EXPAND_MAP[mainPart]) {
        displayLabel = TAG_EXPAND_MAP[mainPart];
      } else {
        displayLabel = mainPart;
      }

      // 关联机制 key 用于胶囊悬停聚焦
      let targetMechKey = null;
      if (displayLabel.includes('散射')) targetMechKey = '散射';
      else if (displayLabel.includes('转火')) targetMechKey = '转火';
      else if (displayLabel.includes('肃正')) targetMechKey = '肃正';
      else if (displayLabel.includes('免伤')) targetMechKey = '免伤';
      else if (displayLabel.includes('回避')) targetMechKey = '回避';
      else if (displayLabel.includes('穿透')) targetMechKey = '穿透';
      else if (displayLabel.includes('再动') || displayLabel.includes('额外行动')) targetMechKey = '再动';
      else if (displayLabel.includes('蓄力')) targetMechKey = '延迟';
      else if (displayLabel.includes('加速')) targetMechKey = '加速';
      else if (displayLabel.includes('麻痹')) targetMechKey = '麻痹';
      else if (displayLabel.includes('中毒') || displayLabel.includes('毒素侵蚀')) targetMechKey = '中毒';
      else if (displayLabel.includes('燃烧') || displayLabel.includes('灼烧')) targetMechKey = '燃烧';
      else if (displayLabel.includes('降防')) targetMechKey = '目标降防';
      else if (displayLabel.includes('加防')) targetMechKey = '目标加防';
      else if (displayLabel.includes('降攻')) targetMechKey = '目标降攻';
      else if (displayLabel.includes('增攻')) targetMechKey = '目标增攻';
      else if (displayLabel.includes('自身致盲') || displayLabel.includes('自盲')) targetMechKey = '自身致盲';
      else if (displayLabel.includes('致盲')) targetMechKey = '目标致盲';
      else if (displayLabel.includes('缓速')) targetMechKey = '目标缓速';
      else if (displayLabel.includes('降避')) targetMechKey = '目标降避';
      else if (displayLabel.includes('瞄准')) targetMechKey = '目标瞄准';
      else if (displayLabel.includes('充能')) targetMechKey = '战技充能';
      else if (displayLabel.includes('隐匿')) targetMechKey = '隐匿';
      else if (displayLabel.includes('嘲讽')) targetMechKey = '仇恨嘲讽';
      else if (displayLabel.includes('限用') || displayLabel.includes('限次')) targetMechKey = '场次限制';
      else if (displayLabel.includes('闪避') && !displayLabel.includes('紧急回避')) targetMechKey = '持续闪避';
      else if (displayLabel.includes('护盾')) targetMechKey = '护盾吸收';
      else if (displayLabel.includes('他人')) targetMechKey = '他人';
      else if (displayLabel.includes('净化')) targetMechKey = '驱散';
      else if (displayLabel.includes('反击')) targetMechKey = '反击';
      else if (displayLabel.includes('暴击')) targetMechKey = '暴击';
      else if (displayLabel.includes('必中')) targetMechKey = '必中';
      else if (displayLabel.includes('眩晕') || displayLabel.includes('击晕')) targetMechKey = '眩晕';
      else if (displayLabel.includes('召唤')) targetMechKey = '召唤';

      const mechFocusAttr = targetMechKey ? `data-mech-focus="${targetMechKey}"` : '';

      // 属性语义分类（战术全息透镜 · 毛玻璃微晶）
      let cat = 'buff';
      if (displayLabel === '他人' || displayLabel === '友方' || displayLabel === '持续' || displayLabel === '限用' || displayLabel === '蓄力') {
        cat = 'aux';
      } else if (displayLabel.includes('回复') || displayLabel.includes('回蓝') || displayLabel.includes('充能') || displayLabel.includes('净化') || displayLabel.includes('抽取') || displayLabel.includes('驱散')) {
        cat = 'heal';
      } else if (displayLabel.includes('伤害') || displayLabel.includes('穿透') || displayLabel.includes('枪击') || displayLabel.includes('散射') || displayLabel.includes('光')) {
        cat = 'damage';
      } else if (displayLabel.includes('护盾') || displayLabel.includes('加防') || displayLabel.includes('闪避') || displayLabel.includes('免伤') || displayLabel.includes('回避') || displayLabel.includes('舍身') || displayLabel.includes('肃正')) {
        cat = 'defense';
      } else if (displayLabel.includes('降防') || displayLabel.includes('降攻') || displayLabel.includes('缓速') || displayLabel.includes('致盲') || displayLabel.includes('中毒') || displayLabel.includes('燃烧') || displayLabel.includes('麻痹') || displayLabel.includes('眩晕') || displayLabel.includes('自盲') || displayLabel.includes('滞')) {
        cat = 'debuff';
      } else {
        cat = 'buff';
      }

      if (cat === 'aux') {
        // 辅助属性（他人、持续、限用、蓄力）：紧凑浅灰半透微标，无呼吸光点，低调不抢视线
        pills.push(`
          <span ${mechFocusAttr} class="pill-trigger inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[0.6rem] font-mono border border-white/5 bg-white/[0.02] text-white/40 leading-none cursor-pointer">
            <span>${esc(displayLabel)}</span>
            ${displayVal != null ? `<span class="font-bold font-mono text-white/60 ml-0.5">${esc(displayVal)}</span>` : ''}
          </span>
        `);
      } else {
        // 核心战斗收益：极细半透微晶描边 + 呼吸微光色点指示分类 + 象牙金等宽数值
        let dotClass = 'bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.9)]';
        if (cat === 'heal') dotClass = 'bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.9)]';
        else if (cat === 'damage') dotClass = 'bg-rose-400 shadow-[0_0_6px_rgba(251,113,133,0.9)]';
        else if (cat === 'defense') dotClass = 'bg-sky-400 shadow-[0_0_6px_rgba(56,189,248,0.9)]';
        else if (cat === 'debuff') dotClass = 'bg-purple-400 shadow-[0_0_6px_rgba(192,132,252,0.9)]';

        pills.push(`
          <span ${mechFocusAttr} class="pill-trigger inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[0.63rem] font-mono border border-white/10 bg-white/[0.03] backdrop-blur-sm leading-none text-white/80 shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] cursor-pointer">
            <span class="w-1.5 h-1.5 rounded-full ${dotClass} shrink-0"></span>
            <span class="tracking-wide">${esc(displayLabel)}</span>
            ${displayVal != null ? `<span class="font-bold text-amber-200 font-mono ml-0.5">${esc(displayVal)}</span>` : ''}
          </span>
        `);
      }
    });

    return pills.join('');
  }

  /* 技能阶级判定：普通 (Tier 1) / 高阶 (Tier 2) / 传奇 (Tier 3) */
  function getSkillTier(s) {
    if (!s) return 1;
    const text = (s.rawText || '') + ' ' + ((s.data && s.data.name) || s.name || '');
    if (text.includes('[传奇]') || text.includes('传奇')) return 3;
    if (text.includes('[高阶]') || text.includes('高阶') || text.includes('净蚀反冲')) return 2;
    return 1;
  }
  /* 战技列表排序：严格按 普通(Tier 1) → 高阶(Tier 2) → 传奇(Tier 3) 阶梯升序排列（demo 同款稳定排序） */
  function getSortedHeroSkills(skills) {
    return [...skills].sort((a, b) => {
      const tierA = getSkillTier(a);
      const tierB = getSkillTier(b);
      if (tierA !== tierB) {
        return tierA - tierB;
      }
      return 0;
    });
  }

  // ---- 工具 ----
  function esc(s) {
    return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');
  }
  function fill(tpl, map) {
    let out = tpl;
    Object.keys(map).forEach(function (k) { out = out.split('{' + k + '}').join(map[k]); });
    return out;
  }
  // ---- 职业与队伍数据 ----
  function classConfigOf(cls) {
    const cc = COMBAT.classes[cls];
    return cc ? JSON.parse(JSON.stringify(cc.config)) : null;
  }
  function classSkills(cls) {
    return (COMBAT.classes[cls] || { skills: [] }).skills;
  }
  function classItems(cls) {
    return (COMBAT.classes[cls] || { items: [] }).items;
  }
  function limitedSkills(cls) {
    return classSkills(cls).filter(function (s) { return s.scope === '限定'; });
  }
  function genericPool() {
    const pool = [];
    Object.keys(COMBAT.classes).forEach(function (cls) {
      COMBAT.classes[cls].skills.forEach(function (s) { if (s.scope === '通用') pool.push(s); });
    });
    return pool;
  }
  function hero3Name() {
    return state.hero3.name || OPENING_DATA.identity.defaultName;
  }
  function hero3PortraitUrl() {
    const p = state.hero3.customPortraits.filter(function (c) { return c.key === state.hero3.portrait; })[0];
    return (p && p.url) || '';
  }
  // 属性按职业自动适配：直接取职业模板（classConfigOf 深拷贝，不污染源数据）
  function hero3Config() {
    const cfg = classConfigOf(state.hero3.classType);
    if (!cfg) return null;
    cfg.img = hero3PortraitUrl() || null;
    return cfg;
  }
  function attrLine(cfg) {
    return '[❤️HP:' + cfg.maxHp + '/' + cfg.maxHp + '][💠MP:' + cfg.maxMp + '/' + cfg.maxMp
      + '][⚔️Atk:' + cfg.atk + '][🛡️Armor:' + cfg.def + '][👟Speed:' + cfg.spd + '][🎖️职业:' + cfg.classType + ']';
  }
  function skillTagSummary(entry) {
    const d = entry.data;
    const parts = [];
    if (d.type) parts.push(d.type.replace(/[\[\]]/g, '') + (d.power ? ':' + d.power : ''));
    if (d.type2) parts.push(d.type2.replace(/[\[\]]/g, '') + (d.power2 ? ':' + d.power2 : ''));
    if (d.type3) parts.push(d.type3.replace(/[\[\]]/g, '') + (d.power3 ? ':' + d.power3 : ''));
    if (d.damageType) parts.push(d.damageType);
    if (d.isReaction) parts.push('反应' + (d.reactionTarget && d.reactionTarget !== 'all' ? '·' + d.reactionTarget : '·全能'));
    if (d.cost) parts.push('MP' + d.cost);
    if (d.hpCost) parts.push('HP' + d.hpCost);
    if (d.turns) parts.push('持续' + d.turns);
    if (d.critRate) parts.push('暴击' + d.critRate + '%');
    if (d.hit < 100) parts.push('命中' + d.hit);
    return parts.join(' · ');
  }
  function itemEntries() {
    return OPENING_DATA.items.filter(function (e) { return state.selectedItems.has(e.id); });
  }
  // 弹药自动分配：职业标配物品（深拷贝）基础上，按最终 6 技能补齐耗弹绑定——
  // 已有绑定跳过；同弹种弹匣追加绑定行；无同弹种则新建弹匣（数量取 Combat_block 同名弹匣最大标配数）
  function hero3AmmoAllocation() {
    const items = classItems(state.hero3.classType).map(function (e) {
      return { id: e.id, data: JSON.parse(JSON.stringify(e.data)) };
    });
    limitedSkills(state.hero3.classType).concat(genericSkillEntries()).forEach(function (s) {
      const ab = GLOBAL_AMMO_BINDINGS[s.data.name];
      if (!ab) return; // 非耗弹技能
      const covered = items.some(function (it) {
        return (it.data.bindings || []).some(function (b) { return b.skillName === s.data.name; });
      });
      if (covered) return;
      const ammo = items.find(function (it) { return it.data.name === ab.ammoName; });
      if (ammo) {
        ammo.data.bindings.push({ skillName: s.data.name, cost: ab.count });
        return;
      }
      let stock = 0;
      Object.keys(COMBAT.classes).forEach(function (cls) {
        (COMBAT.classes[cls].items || []).forEach(function (it) {
          if (it.data.name === ab.ammoName) stock = Math.max(stock, it.data.count || 0);
        });
      });
      const entry = { id: ab.ammoName, data: emptyItemData() };
      entry.data.name = ab.ammoName;
      entry.data.category = '弹药';
      entry.data.count = stock || ab.count * 4;
      entry.data.bindings = [{ skillName: s.data.name, cost: ab.count }];
      items.push(entry);
    });
    return items;
  }
  // hero3 随身物品 = 所选职业标配物品（Combat_block 物品段）+ 自己购点的物品
  function hero3ItemEntries() {
    return hero3AmmoAllocation().concat(itemEntries());
  }
  // hero1/hero2 随身武器（纯叙事，随职业变 / 固定），走 Status_block 物品徽章，不进战斗档案
  function hero1Weapons() {
    const h1 = OPENING_DATA.party.hero1;
    return (h1.weaponsByClass && h1.weaponsByClass[state.hero1Class]) || [];
  }
  function hero2Weapons() {
    return OPENING_DATA.party.hero2.fixedWeapons || [];
  }
  function itemsUsed() {
    return itemEntries().reduce(function (a, e) { return a + e.shopCost; }, 0);
  }
  function genericSkillEntries() {
    const pool = genericPool();
    return state.hero3.skills.map(function (name) {
      return pool.find(function (e) { return e.data.name === name; });
    }).filter(Boolean);
  }
  function genericSkillUsed() {
    const pool = genericPool();
    return state.hero3.skills.reduce(function (a, name) {
      const e = pool.find(function (p) { return p.data.name === name; });
      return a + (e ? e.shopCost : 0);
    }, 0);
  }
  function fmtTs(ts) {
    const d = new Date(ts);
    const p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function listNames(entries) {
    return entries.length ? entries.map(function (e) { return '「' + e.data.name + '」'; }).join('、') : '（无）';
  }

  // ---- 打字机 ----
  function typewrite(el, text, done) {
    stopTw();
    if (window.__OPENING_DEBUG__ && window.__OPENING_DEBUG__.instant) {
      el.textContent = text;
      el.classList.remove('tw-caret');
      if (done) done();
      return;
    }
    el.textContent = '';
    el.classList.add('tw-caret');
    state.twEl = el; state.twText = text; state.twDone = done;
    let i = 0;
    state.twTimer = setInterval(function () {
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length) finishTw();
    }, 24);
  }
  function finishTw() {
    stopTw();
    if (state.twEl) state.twEl.textContent = state.twText;
    elDropCaret();
    if (state.twDone) { const d = state.twDone; state.twDone = null; d(); }
  }
  function stopTw() {
    if (state.twTimer) { clearInterval(state.twTimer); state.twTimer = null; }
  }
  function elDropCaret() {
    if (state.twEl) state.twEl.classList.remove('tw-caret');
  }

  // ---- 酒馆助手接口封装（特性检测 + 降级） ----
  const TH = {
    hasVars: function () { return typeof getVariables === 'function'; },
    hasAssign: function () { return typeof insertOrAssignVariables === 'function'; },
    hasCreateMsg: function () { return typeof createChatMessages === 'function'; },
    hasSlash: function () { return typeof triggerSlash === 'function'; },
    readChatVars: async function () {
      if (!this.hasVars()) return null;
      try { return (await getVariables({ type: 'chat' })) || null; } catch (e) { return null; }
    },
    writeChatVars: async function (payload) {
      if (!this.hasAssign()) throw new Error('酒馆助手 insertOrAssignVariables 不可用');
      await insertOrAssignVariables(payload, { type: 'chat' });
    },
    sendAssistantMessage: async function (message) {
      if (this.hasCreateMsg()) {
        await createChatMessages([{ role: 'assistant', message: message }], { insert_before: 'end' });
        return 'createChatMessages';
      }
      if (this.hasSlash()) {
        // 降级：/sendas 以角色名义发送（换行会被压平，属尽力而为的旧版兼容路径）
        await triggerSlash('/sendas name=' + hero3Name() + ' ' + message.split('\n').join(' '));
        return 'triggerSlash';
      }
      throw new Error('酒馆助手消息接口不可用（createChatMessages / triggerSlash 均未检测到）');
    },
  };

  /* ====================================================================
   * 写入链路（一次性，确认时执行；每步幂等可安全重试）
   *   1. $mms_portrait_choice     → MiniMapStatus 立绘选择
   *   2. rpg_combat_roster        → RpgCombat 英雄档案（version 1 结构）
   *   3. createChatMessages       → AI 角色开场白落楼（含立绘标签 + Status_block）
   *   4. $opening_setup_done      → 本组件幂等标记
   * ==================================================================== */

  function buildHeroSave(entry) {
    // entry: { name, emoji, url, classType, config, skills[], items[] }
    const cfg = entry.config;
    cfg.classType = entry.classType;
    cfg.img = entry.url || null;
    return {
      name: entry.name,
      config: cfg,
      skills: entry.skills.map(function (e) { return Object.assign({}, e.data); }),
      items: entry.items.map(function (e) { return Object.assign({}, e.data); }),
    };
  }

  function buildPartySave() {
    const h1 = OPENING_DATA.party.hero1;
    const h2 = OPENING_DATA.party.hero2;
    const hero1 = buildHeroSave({
      name: h1.name, url: h1.url, classType: state.hero1Class,
      config: classConfigOf(state.hero1Class) || {}, skills: classSkills(state.hero1Class), items: classItems(state.hero1Class),
    });
    const hero2 = buildHeroSave({
      name: h2.name, url: h2.url, classType: state.hero2Class,
      config: classConfigOf(state.hero2Class) || {}, skills: classSkills(state.hero2Class), items: classItems(state.hero2Class),
    });
    const hero3 = buildHeroSave({
      name: hero3Name(), url: hero3PortraitUrl(), classType: state.hero3.classType,
      config: hero3Config() || {}, skills: limitedSkills(state.hero3.classType).concat(genericSkillEntries()), items: hero3ItemEntries(),
    });
    return { version: 1, heroes: [hero1, hero2, hero3] };
  }

  // 战斗物品分类词条（RpgCombat/MMS 通道：【弹药】【消耗品】【道具】独立行，格式 [名x数量] 供 _sbParseItems 解析）
  function buildItemsOfCategory(entries, category) {
    const list = entries.filter(function (e) { return e.data.category === category; });
    if (!list.length) return '无';
    return list.map(function (e) {
      const c = e.data.count || 0;
      return '[' + e.data.name + (c > 1 ? 'x' + c : '') + ']';
    }).join('');
  }
  // 物品行=叙事物品徽章：无数量段，RpgCombat _sbParseItems 不入列，只叙事不进战斗数据
  function buildStoryBadgeString(story) {
    const parts = String(story || '').split(/[、，,;；]/).map(function (s) {
      return s.trim().replace(/[\[\]]/g, '');
    }).filter(Boolean);
    return parts.length ? parts.map(function (p) { return '[' + p + ']'; }).join('') : '无';
  }
  function buildWeaponsString(entries) {
    const weapons = entries.filter(function (e) { return e.data.category === '武器'; });
    if (!weapons.length) return '无';
    return '[🔪] ' + weapons.map(function (e) { return '[' + e.data.name + ']'; }).join('');
  }

  function buildStatusBlock() {
    const h1 = OPENING_DATA.party.hero1;
    const h2 = OPENING_DATA.party.hero2;
    const cfg3 = hero3Config();
    const roles = [
      { emoji: h1.emoji, name: h1.name, attrs: state.hero1Class ? attrLine(classConfigOf(state.hero1Class)) : '', wearing: h1.wearing, inner: h1.inner, items: classItems(state.hero1Class), story: hero1Weapons().join('、') },
      { emoji: h2.emoji, name: h2.name, attrs: state.hero2Class ? attrLine(classConfigOf(state.hero2Class)) : '', wearing: h2.wearing, inner: h2.inner, items: classItems(state.hero2Class), story: hero2Weapons().join('、') },
      { emoji: OPENING_DATA.identity.emoji, name: hero3Name(), attrs: cfg3 ? attrLine(cfg3) : '', wearing: state.hero3.wearing, inner: state.hero3.inner, items: hero3ItemEntries(), story: state.hero3.storyItems },
    ];
    const lines = [];
    lines.push('状态栏:');
    lines.push('  日期和时间: "' + OPENING_DATA.status.date + '"');
    lines.push('  地点: "' + OPENING_DATA.status.place + '"');
    lines.push('  角色列表:');
    roles.forEach(function (r) {
      lines.push('    - 角色:');
      lines.push('        名字: "' + r.emoji + r.name + '"');
      lines.push('        属性: "' + (r.attrs || '未分配') + '"');
      lines.push('        穿着: "' + r.wearing + '"');
      lines.push('        内心: "' + r.inner + '"');
      lines.push('        武器: "' + buildWeaponsString(r.items) + '"');
      // 物品=叙事徽章（只叙事）；战斗物品走【弹药】【消耗品】【道具】词条与 RpgCombat 打通
      lines.push('        物品: "' + buildStoryBadgeString(r.story) + '"');
      lines.push('        弹药: "' + buildItemsOfCategory(r.items, '弹药') + '"');
      lines.push('        消耗品: "' + buildItemsOfCategory(r.items, '消耗品') + '"');
      lines.push('        道具: "' + buildItemsOfCategory(r.items, '道具') + '"');
    });
    if (OPENING_DATA.status.allies.length || OPENING_DATA.status.npcs.length) {
      lines.push('  人物:');
      lines.push('    盟友: ' + JSON.stringify(OPENING_DATA.status.allies));
      lines.push('    NPC: ' + JSON.stringify(OPENING_DATA.status.npcs));
    }
    lines.push('  行动选项:');
    lines.push('    名字: "🧑 ' + hero3Name() + '"');
    lines.push('    选项:');
    OPENING_DATA.status.options.forEach(function (o) { lines.push('      - "' + o + '"'); });
    return '<Status_block>\n' + lines.join('\n') + '\n</Status_block>';
  }

  function buildOpeningMessage() {
    const narrative = fill(OPENING_DATA.openingTemplate, {
      名一: OPENING_DATA.party.hero1.name,
      名二: OPENING_DATA.party.hero2.name,
      名三: hero3Name(),

  // MMS 本机图片快照合并：把三个角色的 {名字: 立绘URL} 写入独立补丁键
  // openingsetup_portrait_patch_v1，由 MMS 启动时吸收进图片表并清键。不读-改-写
  // 共享键 mms_img_data_llm_v1——那会与 MMS 的整表落盘形成 last-write-wins 竞态，
  // 并发时丢一方更新；各写各的键后双写消除。存储不可用时静默跳过
  //（玩家可在 MMS 图片管理里手动添加）。
  function mergeMmsPortraitSnapshot() {
    const maps = [
      { key: OPENING_DATA.party.hero1.name, url: OPENING_DATA.party.hero1.url },
      { key: OPENING_DATA.party.hero2.name, url: OPENING_DATA.party.hero2.url },
      { key: state.hero3.portrait, url: hero3PortraitUrl() },
    ].filter(function (m) { return m.key && m.url; });
    if (!maps.length) return;
    try {
      const KEY = 'openingsetup_portrait_patch_v1';
      let patch;
      try { patch = JSON.parse(localStorage.getItem(KEY)); } catch (e) { patch = null; }
      if (!patch || typeof patch !== 'object' || !patch.portrait || typeof patch.portrait !== 'object') {
        patch = { v: 1, portrait: {} };
      }
      maps.forEach(function (m) { patch.portrait[m.key] = m.url; });
      localStorage.setItem(KEY, JSON.stringify(patch));
    } catch (e) { /* 存储不可用：跳过 */ }
  }

  async function submitAll() {
    if (state.submitting) return;
    state.submitting = true;
    state.stage = 'loading';
    state.progress = 0;
    state.stepRows = [];
    render();

    const steps = [
      ['立绘选择同步 · MiniMapStatus', async function () {
        if (state.hero3.portrait) await TH.writeChatVars({ $mms_portrait_choice: state.hero3.portrait });
        mergeMmsPortraitSnapshot();
      }],
      ['战斗档案写入 · RpgCombat', async function () {
        await TH.writeChatVars({ rpg_combat_roster: buildPartySave() });
      }],
      ['开场白以 AI 角色身份注入聊天流', async function () {
        if (state.openingSent) return; // 重试时防重复落楼
        await TH.sendAssistantMessage(buildOpeningMessage());
        state.openingSent = true;
      }],
      ['归档标记写入', async function () {
        await TH.writeChatVars({ $opening_setup_done: buildDoneFlag() });
      }],
    ];

    try {
      for (let i = 0; i < steps.length; i++) {
        state.stepRows.push({ label: steps[i][0], status: 'run' });
        renderLoading();
        await steps[i][1]();
        state.stepRows[i].status = 'ok';
        state.progress = Math.round(((i + 1) / steps.length) * 100);
        renderLoading();
      }
      state.stage = 'done';
      render();
    } catch (err) {
      state.submitting = false;
      state.errorMsg = (err && err.message) || String(err);
      state.stage = 'error';
      render();
    }
  }

    let html = '';
    switch (state.stage) {
      case 'title': html = viewTitle(); break;
      case 'story': html = viewStory(); break;

      case 'c2': html = viewC2(); break;

      case 'c3skill': html = viewC3skill(); break;
      case 'c3item': html = viewItems(); break;
      case 'confirm': html = viewConfirm(); break;
      case 'loading': html = viewLoading(); break;
      case 'done': html = viewDone(); break;
      case 'archived': html = viewArchived(); break;
      case 'error': html = viewError(); break;
      default: html = viewTitle(); break;
    }
    app.innerHTML = html;

  /* 技能插槽芯片渲染（支持低饱和微透胶囊流） */
  /* ===== demo 移植：技能芯片美化全套（类型 emoji / 命中率 / 反应徽章 / 主题化芯片） ===== */
  /* 技能类型判定：近战(⚔️)、远程(🏹)、法术(🔮)、战术(♟️) */
  function getSkillTypeEmoji(s) {
    if (!s) return '✦';
    const text = (s.rawText || '') + ' ' + ((s.data && s.data.name) || '');
    if (text.includes('法术')) return '🔮';
    if (text.includes('近战')) return '⚔️';
    if (text.includes('远程')) return '🏹';
    return '♟️';
  }
  function getSkillTypeTitle(s) {
    if (!s) return '战技';
    const text = (s.rawText || '') + ' ' + ((s.data && s.data.name) || '');
    if (text.includes('法术')) return '法术';
    if (text.includes('近战')) return '近战';
    if (text.includes('远程')) return '远程';
    return '战术';
  }
  /* 命中率判定（源数据已解析 data.hit/guaranteedHit，"自身"类增益沿用 demo 的 rawText 判定） */
  function getSkillAimText(s) {
    if (!s) return '100%';
    const d = s.data || {};
    const text = (s.rawText || '') + ' ' + (d.name || '');
    if (d.guaranteedHit || text.includes('必中')) return '必中';
    if (d.hit && d.hit !== 100) return d.hit + '%';
    if (text.includes('[单盾]') || text.includes('[群回]') || text.includes('[单回]') || text.includes('[回避]') || text.includes('[单避]') || text.includes('肃正') || text.includes('单盾') || text.includes('单防')) {
      return '自身';
    }
    return '100%';
  }
  /* 特殊战术机制徽章文本（反应带⟲，舍身与看破独立显示如 舍身·近战、看破·法术） */
  function getReactionBadgeText(s) {
    if (!s) return null;
    const text = (s.rawText || '') + ' ' + ((s.data && s.data.name) || '');
    const m = text.match(/\[(反应|舍身|看破)(?::([^\]]+))?\]/);
    if (!m && !(s.data && s.data.isReaction)) return null;
    const act = m ? m[1] : '反应';
    const limit = (m && m[2]) ? m[2].trim() : null;
    if (act === '反应') {
      return limit ? `⟲反应·${limit}` : '⟲反应·全能';
    }
    return limit ? `${act}·${limit}` : act;
  }

  /* 渲染：技能芯片卡片（主题角标框 + 品阶动效 + 右侧消耗列与命中率展示） */
  function renderSkillSlotChip(s, isSlotEmpty, slotIdx, canRemove, heroTheme) {
    if (isSlotEmpty || !s) {
      return '<div class="skill-slot-chip border-dashed border-opacity-40" style="--slot-idx:' + slotIdx + '; border-color:var(--slot-border); background:rgba(0,0,0,0.3);">'
        + '<div class="flex items-center gap-3">'
        + '  <span class="w-7 h-7 rounded bg-white/5 flex items-center justify-center font-mono text-xs text-white/40">✦</span>'
        + '  <span class="text-xs tracking-wider text-white/35">空置通用插槽 · 待购点装配</span>'
        + '</div>'
        + '<span class="font-mono text-[0.68rem] text-white/30">[SLOT OPEN]</span>'
        + '</div>';
    }

    const d = s.data || {};
    const skillName = d.name || s.id;
    const typeEmoji = getSkillTypeEmoji(s);
    const typeTitle = getSkillTypeTitle(s);
    const aimText = getSkillAimText(s);
    const aimDisplayText = aimText === '必中' ? '必中' : (aimText === '自身' ? '自身' : '命中 ' + aimText);
    const tier = getSkillTier(s);

    let tierClass = '';
    let tierBadgeHtml = '';
    if (tier === 3) {
      tierClass = 'tier-legendary';
      tierBadgeHtml = '<span class="tier-badge-modern-leg text-[0.58rem] px-2 py-0.5 rounded-full font-mono font-bold shrink-0 flex items-center gap-1">★ 传奇</span>';
    } else if (tier === 2) {
      tierClass = 'tier-advanced';
      tierBadgeHtml = '<span class="tier-badge-modern-adv text-[0.58rem] px-2 py-0.5 rounded-full font-mono font-bold shrink-0 flex items-center gap-1">✦ 高阶</span>';
    }

    let chipClass = '';
    let badgeBoxClass = '';
    let costRightText = '';

    if (heroTheme === 'gold') {
      // 威廉：专属金色主题（四角星 + 金色光晕，右侧显示命中率）
      chipClass = 'theme-gold';
      badgeBoxClass = 'border-amber-500/60 bg-amber-950/40 text-amber-300 shadow-[0_0_8px_rgba(217,180,92,0.3)]';
      costRightText = '<span class="text-amber-300/85 font-mono text-[0.66rem] flex items-center justify-end gap-1"><span class="text-amber-400 text-xs">✦</span> ' + aimDisplayText + '</span>';
    } else if (heroTheme === 'purple') {
      // 冯：金紫交辉炼金秘术风格
      chipClass = 'theme-purple';
      badgeBoxClass = 'border-amber-400/65 bg-gradient-to-br from-amber-950/40 via-purple-950/50 to-purple-900/60 text-amber-300 shadow-[0_0_10px_rgba(217,180,92,0.35)]';
      costRightText = '<span class="text-amber-300/85 font-mono text-[0.66rem] flex items-center justify-end gap-1"><span class="text-amber-400 text-xs">✦</span> ' + aimDisplayText + '</span>';
    } else {
      // 主角：技能插槽
      chipClass = s.scope === '限定' ? 'type-limited' : 'type-generic';
      badgeBoxClass = s.scope === '限定'
        ? 'border-amber-500/50 bg-amber-950/30 text-amber-300 shadow-[0_0_6px_rgba(217,180,92,0.25)]'
        : 'border-purple-500/50 bg-purple-950/30 text-purple-300 shadow-[0_0_6px_rgba(192,132,252,0.25)]';
      costRightText = s.scope === '限定'
        ? '<span class="text-amber-300/85 font-mono text-[0.66rem] flex items-center justify-end gap-1"><span class="text-amber-400 text-xs">✦</span> ' + aimDisplayText + '</span>'
        : '<span class="font-mono text-[0.62rem] text-white/50 flex items-center justify-end gap-1"><span class="text-purple-400 text-xs">✦</span> ' + aimDisplayText + ' · ' + s.shopCost + ' 点</span>';
    }

    const ammo = GLOBAL_AMMO_BINDINGS[skillName] || null;
    const costs = [];
    if (d.cost) costs.push(d.cost + ' MP');
    if (d.hpCost) costs.push(d.hpCost + ' HP');
    if (d.tpCost) costs.push(d.tpCost + ' TP');
    if (ammo) costs.push(ammo.ammoName + '*' + ammo.count);
    const costText = costs.length > 0 ? costs.join(' / ') : '无消耗';

    // 反应类型限制徽章（如 [反应:近战] -> ⟲反应·近战）
    const reactionBadgeText = getReactionBadgeText(s);
    const reactionBadge = reactionBadgeText
      ? '<span class="text-[0.58rem] px-1.5 py-0.5 rounded font-mono shrink-0 bg-amber-950/40 border border-amber-500/40 text-amber-300 shadow-[0_0_6px_rgba(217,180,92,0.2)]">' + reactionBadgeText + '</span>'
      : '';

    // 技能类型角标（战术/远程等）：微晶半透样式
    const typeTag = d.isReaction ? '反应' : (d.damageType || '战术');
    const typeTagHtml = typeTag !== '反应'
      ? '<span class="text-[0.6rem] px-1.5 py-0.5 rounded border border-white/10 bg-white/[0.03] text-white/45 font-mono tracking-wider shrink-0">' + typeTag + '</span>'
      : '';

    const removeBtn = canRemove
      ? '<button data-action="c3-skill-remove" data-skill="' + esc(skillName) + '" class="text-xs text-rose-400/80 hover:text-rose-300 p-1 rounded hover:bg-rose-950/40 transition-colors" title="卸下芯片">✕</button>'
      : '';

    return '<div class="skill-slot-chip ' + chipClass + ' ' + tierClass + '" style="--slot-idx:' + slotIdx + '" data-skill-name="' + esc(skillName) + '" data-skill-raw="' + (s.rawText ? esc(s.rawText) : '') + '">'
      + '<div class="flex items-center gap-2.5 min-w-0 flex-1">'
      + '  <div class="w-7 h-7 rounded ' + badgeBoxClass + ' border flex items-center justify-center shrink-0">'
      + '    <span class="text-xs select-none" title="' + typeTitle + '">' + typeEmoji + '</span>'
      + '  </div>'
      + '  <div class="min-w-0 flex-1">'
      + '    <div class="flex items-center gap-1.5 truncate">'
      + '      <span class="text-xs sm:text-sm font-bold tracking-wider text-[var(--text-main)] truncate">' + esc(skillName) + '</span>'
      + tierBadgeHtml
      + reactionBadge
      + typeTagHtml
      + '    </div>'
      + '    <div class="flex items-center gap-1 flex-wrap mt-0.5">'
      + formatSkillEffectPills(s.rawText || skillName)
      + '    </div>'
      + '  </div>'
      + '</div>'
      + '<div class="flex items-center gap-2 shrink-0">'
      + '  <div class="text-right">'
      + '    <div class="font-mono text-[0.72rem] font-bold text-[var(--accent)] whitespace-nowrap">' + esc(costText) + '</div>'
      + '    <div class="font-mono text-[0.62rem] text-white/40">' + costRightText + '</div>'
      + '  </div>'
      + removeBtn
      + '</div>'
      + '</div>';
  }

  /* 职业切换：局部精准淡入淡出（立绘展台框架保持稳定不动） */
  function switchHeroClassLocally(heroKey, newClass) {
    const hero = OPENING_DATA.party[heroKey];
    if (!hero) return;

    if (heroKey === 'hero1') state.hero1Class = newClass;
    else state.hero2Class = newClass;

    const clsObj = COMBAT.classes[newClass];
    const cfg = clsObj ? clsObj.config : { maxHp: 100, maxMp: 40, atk: 12, def: 3, spd: 100 };
    const voiceData = (hero.classVoiceMap && hero.classVoiceMap[newClass]) || { quote: '', audioUrl: '' };

    // 1. 职业选项卡高亮增量切换
    document.querySelectorAll('[data-class-tab]').forEach(function (tab) {
      tab.classList.toggle('active', tab.getAttribute('data-class-tab') === newClass);
    });

    // 2. 左侧台词气泡平滑过渡
    const quoteEl = document.getElementById('hero-dialogue-quote');
    if (quoteEl) {
      quoteEl.style.opacity = '0';
      quoteEl.style.transform = 'translateY(4px)';
      setTimeout(function () {
        quoteEl.textContent = voiceData.quote;
        quoteEl.style.opacity = '1';
        quoteEl.style.transform = 'translateY(0)';
      }, 150);
    }

    // 3. 五维属性面板平滑更新
    const attrTitle = document.getElementById('hero-attr-profile-tag');
    if (attrTitle) attrTitle.textContent = 'PROFILE // ' + newClass;

    const attrs = [
      { id: 'hero-attr-hp', val: cfg.maxHp },
      { id: 'hero-attr-mp', val: cfg.maxMp },
      { id: 'hero-attr-atk', val: cfg.atk },
      { id: 'hero-attr-armor', val: cfg.def },
      { id: 'hero-attr-speed', val: cfg.spd },
    ];
    attrs.forEach(function (item) {
      const el = document.getElementById(item.id);
      if (el) {
        el.style.opacity = '0.2';
        setTimeout(function () {
          el.textContent = item.val;
          el.style.opacity = '1';
        }, 120);
      }
    });

    // 4. 右侧 6 技能栏重新渲染并依次阶梯滑入
    const skillsContainer = document.getElementById('hero-skill-chips-container');
    if (skillsContainer && clsObj) {
      const heroTheme = heroKey === 'hero2' ? 'purple' : 'gold';
      skillsContainer.style.opacity = '0';
      skillsContainer.style.transform = 'translateY(6px)';
      setTimeout(function () {
        skillsContainer.innerHTML = getSortedHeroSkills(clsObj.skills).map(function (s, idx) {
          return renderSkillSlotChip(s, false, idx + 1, false, heroTheme);
        }).join('');
        skillsContainer.style.opacity = '1';
        skillsContainer.style.transform = 'translateY(0)';
      }, 150);
    }

    // 5. 播放专属台词音频
    playHeroCurrentVoice(heroKey);
  }

    const maxPoints = OPENING_DATA.shop.skillPoints;

  // 物品战斗属性行：效果槽/他人/命中/持续 + 存量形态，让"购点有属性"可见
  function itemStatLine(e) {
    const d = e.data;
    const parts = [];
    if (d.type) parts.push(d.type.replace(/[\[\]]/g, '') + (d.power ? ':' + d.power : ''));
    if (d.type2) parts.push(d.type2.replace(/[\[\]]/g, '') + (d.power2 ? ':' + d.power2 : ''));
    if (d.type3) parts.push(d.type3.replace(/[\[\]]/g, '') + (d.power3 ? ':' + d.power3 : ''));
    if (d.isOthers) parts.push('他人');
    if (d.hit && d.hit !== 100) parts.push('命中' + d.hit);
    if (d.turns) parts.push('持续' + d.turns);
    return parts.join(' · ');
  }
  function itemStockText(e) {
    const d = e.data;
    if (d.category === '道具' && d.maxUses > 0) return ' · 每场' + d.maxUses + '次';
    return d.count > 1 ? ' · x' + d.count : '';
  }
