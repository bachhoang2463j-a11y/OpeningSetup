<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>开局引导 · 雾港谜案 1925</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ================= 1920 年代悬疑推理双主题系统 ================= */
  :root, body.theme-arcane {
    --noir-bg: #05070c;
    --amber: #d9b45c;
    --amber-dim: rgba(198, 161, 84, 0.55);
    --amber-glow: rgba(198, 161, 84, 0.25);
    --paper-hi: #efe6cf;
    --paper-lo: #e2d4b4;
    --ink: #2c2416;

    /* 密教金辉 (Noir Arcane) - 威廉 & 自定义主角专属 */
    --font-serif: 'Noto Serif SC', serif;
    --bg-base: #0a0d13;
    --panel-bg: rgba(13, 17, 24, 0.76);
    --panel-glass: rgba(17, 23, 33, 0.6);
    --panel-border: rgba(198, 161, 84, 0.28);
    --panel-border-bright: rgba(224, 185, 102, 0.85);
    --accent: #d9b45c;
    --accent-glow: rgba(217, 180, 92, 0.38);
    --accent-dim: rgba(198, 161, 84, 0.16);
    --text-main: #f0e6d2;
    --text-muted: rgba(232, 220, 192, 0.7);
    --slot-bg: rgba(9, 12, 18, 0.82);
    --slot-border: rgba(198, 161, 84, 0.25);
    --slot-glow: 0 0 15px rgba(217, 180, 92, 0.22);
    --badge-limited: rgba(217, 180, 92, 0.95);
    --badge-generic: rgba(120, 200, 150, 0.95);
    --badge-reaction: rgba(235, 110, 110, 0.95);
    --card-hover: rgba(26, 34, 48, 0.75);
    --btn-bg: linear-gradient(135deg, rgba(198, 161, 84, 0.24), rgba(198, 161, 84, 0.06));
    --btn-border: rgba(198, 161, 84, 0.5);
  }

  /* 冯专属：琉璃暗耀 (Gilded Crystal) */
  body.theme-gilded {
    --noir-bg: #0c0816;
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.5);
    --amber-glow: rgba(192, 132, 252, 0.3);

    --bg-base: #110c1c;
    --panel-bg: rgba(22, 15, 36, 0.8);
    --panel-glass: rgba(30, 20, 50, 0.62);
    --panel-border: rgba(236, 195, 110, 0.36);
    --panel-border-bright: rgba(255, 222, 145, 0.95);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.45);
    --accent-dim: rgba(192, 132, 252, 0.18);
    --text-main: #fdf4ff;
    --text-muted: rgba(243, 232, 255, 0.7);
    --slot-bg: rgba(18, 11, 30, 0.88);
    --slot-border: rgba(216, 180, 254, 0.32);
    --slot-glow: 0 0 20px rgba(192, 132, 252, 0.32);
    --badge-limited: rgba(245, 158, 11, 0.95);
    --badge-generic: rgba(192, 132, 252, 0.95);
    --badge-reaction: rgba(244, 63, 94, 0.95);
    --card-hover: rgba(45, 28, 72, 0.78);
    --btn-bg: linear-gradient(135deg, rgba(245, 158, 11, 0.26), rgba(192, 132, 252, 0.16));
    --btn-border: rgba(245, 158, 11, 0.6);
  }

  html, body { margin: 0; padding: 0; background: var(--noir-bg); transition: background-color 0.4s ease, color 0.4s ease; }
  body { font-family: 'Noto Serif SC', serif; color: #e8dcc0; overflow-x: hidden; }
  .font-tw { font-family: 'Special Elite', 'Courier New', monospace; }

  /* 环境光与装饰层 */
  #ambient-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(circle at 20% 30%, rgba(217, 180, 92, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.06) 0%, transparent 60%);
    transition: all 0.5s ease;
  }
  body.theme-gilded #ambient-glow {
    background: radial-gradient(circle at 30% 25%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.16) 0%, transparent 60%);
  }

  /* ---- 背景层：视频 / CSS 雾夜兜底 / 胶片颗粒 / 暗角 ---- */
  #bg-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: var(--vid-op, 0.6); }
  #bg-fallback { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 110%, #101623 0%, #070a12 55%, #05070c 100%); }
  .fog { position: absolute; border-radius: 9999px; filter: blur(70px); opacity: 0.5; will-change: transform; }
  .fog-a { width: 60vw; height: 34vh; left: -10vw; bottom: -8vh;
    background: radial-gradient(closest-side, rgba(46, 64, 92, 0.55), transparent 70%);
    animation: fog-drift 26s ease-in-out infinite alternate; }
  .fog-b { width: 46vw; height: 30vh; right: -8vw; top: 4vh;
    background: radial-gradient(closest-side, rgba(198, 161, 84, 0.14), transparent 70%);
    animation: fog-drift 34s ease-in-out infinite alternate-reverse; }
  .fog-c { width: 36vw; height: 22vh; left: 30vw; top: 30vh;
    background: radial-gradient(closest-side, rgba(38, 52, 74, 0.5), transparent 70%);
    animation: fog-drift 40s ease-in-out infinite alternate; }
  @keyframes fog-drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vw, -3vh, 0) scale(1.15); } }
  #grain { position: fixed; inset: -40px; z-index: 2; pointer-events: none; opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    animation: grain-shift 1.1s steps(3) infinite; }
  @keyframes grain-shift { 0% { transform: translate(0, 0); } 33% { transform: translate(-14px, 9px); } 66% { transform: translate(11px, -13px); } 100% { transform: translate(0, 0); } }
  #vignette { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(115% 100% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.62) 100%); }

  /* ---- 玻璃拟态面板 ---- */
  .glass { background: var(--panel-bg); backdrop-filter: blur(20px) saturate(1.15);
    -webkit-backdrop-filter: blur(20px) saturate(1.15);
    border: 1px solid var(--panel-border); border-radius: 12px;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: border-color 0.3s ease, background 0.3s ease; }
  .glass-soft { background: var(--panel-glass); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border: 1px solid var(--panel-border); border-radius: 8px; }

  /* ---- 按钮 ---- */
  .btn-noir { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.62rem 1.7rem; border: 1px solid var(--btn-border); color: var(--accent); cursor: pointer;
    background: var(--btn-bg); letter-spacing: 0.18em; font-size: 0.92rem; border-radius: 6px;
    font-weight: 700; transition: all 0.35s ease; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
  .btn-noir:hover:not(:disabled) { background: rgba(198, 161, 84, 0.24); box-shadow: 0 0 20px var(--accent-glow); border-color: var(--accent); transform: translateY(-1px); }
  .btn-noir:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 1.1rem;
    border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-muted); cursor: pointer;
    background: transparent; font-size: 0.82rem; letter-spacing: 0.1em; border-radius: 6px; transition: all 0.3s ease; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text-main); }

  /* ---- 全屏按钮（fixed 右上圆形半透明钮，z-100） ---- */
  .fs-btn { position: fixed; top: 16px; right: 16px; z-index: 100; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid rgba(198, 161, 84, 0.4); border-radius: 9999px; color: rgba(232, 220, 192, 0.75);
    background: rgba(13, 16, 22, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s ease; }
  .fs-btn:hover { background: rgba(198, 161, 84, 0.24); box-shadow: 0 0 16px var(--amber-glow); border-color: var(--amber); color: #e6cf9a; }
  .fs-btn svg { width: 18px; height: 18px; }

  /* ---- 卡片（技能/物品/立绘可选卡） ---- */
  .card { border: 1px solid var(--slot-border); border-radius: 8px; cursor: pointer;
    background: var(--slot-bg); transition: all 0.3s ease; }
  .card:hover { border-color: var(--panel-border-bright); background: var(--card-hover); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow), inset 0 0 10px rgba(198, 161, 84, 0.08);
    background: rgba(34, 30, 16, 0.65); }

  /* 大尺寸角色立绘展台（破框沉浸，去除狭窄黑框留白，与右侧等高对齐） */
  .portrait-podium {
    position: relative; width: 100%; min-height: 520px; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden; border-radius: 12px; padding: 20px;
    background: radial-gradient(circle at 50% 55%, var(--accent-dim) 0%, transparent 70%), var(--panel-bg);
    border: 1px solid var(--panel-border);
  }
  .portrait-wrapper {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 0; overflow: hidden;
  }
  .portrait-img {
    height: 100%; max-height: 480px; width: auto; object-fit: contain;
    filter: drop-shadow(0 16px 36px rgba(0, 0, 0, 0.85));
    -webkit-mask-image: linear-gradient(to bottom, black 84%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 84%, transparent 100%);
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .portrait-img.hero-swap-in { animation: hero-swap 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes hero-swap {
    0% { opacity: 0; transform: scale(0.96) translateY(14px); filter: brightness(1.4) blur(4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) blur(0); }
  }

  /* 语音跳动声波 */
  .voice-wave { display: flex; align-items: center; gap: 3px; height: 18px; }
  .voice-bar { width: 3px; height: 100%; background-color: var(--accent); border-radius: 2px;
    animation: wave-bar 0.8s ease-in-out infinite alternate; }
  .voice-bar:nth-child(1) { animation-delay: 0.1s; height: 35%; }
  .voice-bar:nth-child(2) { animation-delay: 0.3s; height: 75%; }
  .voice-bar:nth-child(3) { animation-delay: 0.15s; height: 100%; }
  .voice-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
  .voice-bar:nth-child(5) { animation-delay: 0.25s; height: 40%; }
  @keyframes wave-bar { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1); } }
  .voice-wave.paused .voice-bar { animation-play-state: paused; transform: scaleY(0.3); }

  /* 技能插槽阶梯式滑入芯片 */
  .skill-slot-chip {
    background: var(--slot-bg); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 10px 14px; display: flex; align-items: center;
    justify-content: space-between; gap: 10px; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; overflow: hidden; animation: slot-slide-in 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--slot-idx, 0) * 0.04s);
  }
  @keyframes slot-slide-in { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
  .skill-slot-chip:before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
    background: var(--slot-border); transition: background 0.3s ease;
  }
  .skill-slot-chip.type-limited:before { background: var(--badge-limited); }
  .skill-slot-chip.type-generic:before { background: var(--badge-generic); }
  .skill-slot-chip.is-reaction:before { background: var(--badge-reaction); }
  .skill-slot-chip:hover { border-color: var(--panel-border-bright); box-shadow: var(--slot-glow); background: var(--card-hover); transform: translateX(2px); }

  /* 职业选项卡卡片 */
  .class-tab-card {
    background: var(--panel-glass); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 14px; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  }
  .class-tab-card:hover { border-color: var(--panel-border-bright); background: var(--card-hover); transform: translateY(-2px); }
  .class-tab-card.active { border-color: var(--accent); background: linear-gradient(150deg, var(--card-hover), var(--accent-dim)); box-shadow: 0 0 20px var(--accent-glow); }
  .class-tab-card.active:before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* 技能备选卡片（购点） */
  .skill-pick-card {
    background: var(--slot-bg); border: 1px solid var(--slot-border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.25s ease; position: relative;
  }
  .skill-pick-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--slot-glow); }
  .skill-pick-card.selected { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 14px var(--accent-glow); }
  .skill-pick-card.selected:after {
    content: 'EQUIPPED'; position: absolute; top: 6px; right: 8px;
    font-family: 'Special Elite', 'Courier New', monospace; font-size: 0.55rem; font-weight: 700;
    letter-spacing: 0.08em; color: var(--accent); background: rgba(0, 0, 0, 0.75);
    padding: 1px 4px; border-radius: 3px; border: 1px solid var(--accent); pointer-events: none;
  }

  /* 台词字幕气泡（固定高度 72px，多行自适应垂直居中，防抖防挤压） */
  .dialogue-bubble {
    background: rgba(10, 14, 22, 0.88); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 8px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    width: 100%; height: 72px; min-height: 72px; max-height: 72px;
    display: flex; align-items: center; justify-content: flex-start; overflow: hidden;
    animation: dialogue-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  #hero-dialogue-quote {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; text-overflow: ellipsis; line-height: 1.45;
  }
  @keyframes dialogue-in { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }

  /* 能量点数条 */
  .energy-meter { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden; }
  .energy-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #fff);
    border-radius: 9999px; box-shadow: 0 0 10px var(--accent); transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

  /* 跨阶段电影级柔和转场动效 (250ms 淡出 + 300ms 淡入) */
  .stage-fade-out {
    opacity: 0 !important; transform: translateY(-8px) scale(0.995) !important;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    pointer-events: none;
  }
  .stage-fade-in {
    opacity: 1 !important; transform: translateY(0) scale(1) !important;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  /* 插槽增量插入轻柔弹入动效 */
  .slot-chip-pop { animation: slot-pop 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes slot-pop { 0% { opacity: 0; transform: scale(0.94) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

  /* 局部文字与属性平滑过渡 */
  .smooth-fade-transition { transition: opacity 0.22s ease, transform 0.22s ease; }
  .view-transition-in { animation: view-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- 标题旧放映机闪烁 ---- */
  .flicker { animation: flicker 4.2s linear infinite; }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 3% { opacity: 0.72; } 5% { opacity: 1; } 42% { opacity: 1; }
    44% { opacity: 0.82; } 46% { opacity: 1; } 78% { opacity: 0.9; } 80% { opacity: 1; } }

  /* ---- 打字机光标 ---- */
  .tw-caret::after { content: '▌'; color: var(--amber); animation: caret 0.9s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---- 立绘投影（半透明浮动 + 底部渐隐） ---- */
  .holo-wrap { position: relative; }
  .holo { animation: holo-float 5.5s ease-in-out infinite;
    -webkit-mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 78%, transparent 100%); }
  @keyframes holo-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .holo-ph { display: flex; align-items: center; justify-content: center; }

  /* ---- 档案纸（确认页） ---- */
  .paper { background: linear-gradient(168deg, var(--paper-hi), var(--paper-lo));
    color: var(--ink); border: 1px solid #b7a77f; border-radius: 3px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(120, 96, 48, 0.14);
    transform: rotate(-0.4deg); }
  .paper .tw-line { border-bottom: 1px dashed rgba(44, 36, 22, 0.35); }
  .stamp { display: inline-block; padding: 0.2rem 0.8rem; border: 3px double #a03030; color: #a03030;
    font-weight: 900; letter-spacing: 0.3em; transform: rotate(-8deg); opacity: 0.85; border-radius: 4px; }

  /* ---- 过场 ---- */
  .fade-in { animation: fade-in 0.55s ease both; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .flash-warn { color: #d98c8c; font-size: 0.82rem; letter-spacing: 0.08em; }

  /* ---- 进度条 ---- */
  .progress-track { height: 3px; background: rgba(198, 161, 84, 0.15); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, rgba(198, 161, 84, 0.5), var(--amber));
    box-shadow: 0 0 10px var(--amber-glow); transition: width 0.45s ease; }

  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(198, 161, 84, 0.3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="theme-arcane">
  <div id="ambient-glow"></div>
  <div id="bg-fallback">
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="fog fog-c"></div>
  </div>
  <video id="bg-video" autoplay loop muted playsinline class="hidden"></video>
  <div id="grain"></div>
  <div id="vignette"></div>
  <audio id="bgm" loop></audio>
  <button id="fs-btn" type="button" class="fs-btn" title="全屏 / 退出全屏">
    <svg id="fs-icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <svg id="fs-icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
  </button>
  <div id="app" class="relative z-10"></div>

<!-- ====================================================================
  战斗数据源（单一样式来源，改数值直接改下面的 YAML 文本）
  格式遵循 RpgCombat README §1 的 <Combat_block> 标注：
    · 属性行：[HP:当前/最大][MP:当前/最大][Atk:攻击][Armor:防御][Speed:速度][职业:名]
    · 技能行：【技能名】[消耗][效果槽;power:数值][伤害类型][标签]
    · 反应技能：[反应] 或 [反应:近战|远程|法术]
  本文件额外使用的自定义标记（解析时剥离，此块不进入战斗前端）：
    · [限定] 绑定职业的技能（角色切职业时自动替换的 3 槽）
    · [通用] 跨职业购点池技能（自定义角色 3 个自由槽从这里买）
    · [价:N] 购点价格（自定义角色技能购点用）

  const SLOT_NAMES = ['单体', '群攻', '散射', '群散射', '单回', '群回', '单防', '群防', '单盾', '群盾', '单冲', '群冲', '单弱', '群弱', '中毒', '燃烧', '麻痹', '吸蓝', '驱散', '群驱散', '眩晕'];
  function parseSkillLine(raw, entry) {

  function getBgmUrlForStage(stage) {

  function updateBgmForStage(targetStage) {
    const targetUrl = getBgmUrlForStage(targetStage);
    if (!targetUrl || !bgm) return;

    const currentSrc = bgm.src || '';
    const isSameSong = currentSrc && (
      currentSrc === targetUrl ||
      currentSrc.indexOf(encodeURI(targetUrl)) >= 0 ||
      encodeURI(currentSrc).indexOf(encodeURI(targetUrl)) >= 0 ||
      currentSrc.split('?')[0].split('#')[0] === targetUrl.split('?')[0].split('#')[0]
    );

    if (isSameSong) {
      if (state.soundOn && bgm.paused) {
        bgm.volume = 0.55;
        bgm.play().catch(function () { /* 静默 */ });
      } else if (!state.soundOn && !bgm.paused) {
        bgm.pause();
      }
      return;
    }

    if (bgmFadeTimer) {
      clearInterval(bgmFadeTimer);
      bgmFadeTimer = null;
    }

    if (!state.soundOn) {
      bgm.pause();
      bgm.src = targetUrl;
      return;
    }

    // 平滑淡出后切换
    bgmFadeTimer = setInterval(function () {
      if (bgm.volume > 0.08) {
        bgm.volume = Math.max(0, bgm.volume - 0.08);

        clearInterval(bgmFadeTimer);
        bgmFadeTimer = null;
        bgm.pause();
        bgm.src = targetUrl;
        bgm.volume = 0;

            }

        }).catch(function () { /* 静默 */ });
      }
    }, 25);
  }

    const pills = [];
    tagMatches.forEach(function (tagStr) {
      const inner = tagStr.slice(1, -1).trim();
      const parts = inner.split(/[;；]/);
      const mainPart = parts[0].trim();
      let powerVal = null;
      parts.slice(1).forEach(function (p) {
        const pm = p.match(/power:(-?\d+)/i);
        if (pm) powerVal = pm[1];
      });

      let displayLabel = '';
      let displayVal = powerVal;

      if (/^持续[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^持续[:：](\d+)/i);
        displayLabel = '持续';
        displayVal = (m ? m[1] : '') + '回合';
      } else if (/^加速[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^加速[:：](\d+)/i);
        displayLabel = '加速';
        displayVal = '+' + (m ? m[1] : '');
      } else if (/^暴击[:：](\d+)%?/i.test(mainPart)) {
        const m = mainPart.match(/^暴击[:：](\d+)%?/i);
        displayLabel = '暴击';
        displayVal = (m ? m[1] : '') + '%';
      } else if (/^(?:Hit|Aim)[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^(?:Hit|Aim)[:：](\d+)/i);
        displayLabel = '命中';
        displayVal = (m ? m[1] : '') + '%';
      } else if (/^反应(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^反应(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? '⟲反应·' + m[1] : '⟲反应';
      } else if (mainPart === '他人') {
        displayLabel = '友方目标';
      } else if (mainPart === '法术' || mainPart === '近战' || mainPart === '远程') {
        return;
      } else if (/^(群驱散|驱散)(?::(\d+))?/i.test(mainPart)) {
        const m = mainPart.match(/^(群驱散|驱散)(?::(\d+))?/i);
        displayLabel = m[1].indexOf('群') >= 0 ? '群体净化' : '单体净化';
        displayVal = m[2] ? m[2] + '层' : null;
      } else if (TAG_EXPAND_MAP[mainPart]) {
        displayLabel = TAG_EXPAND_MAP[mainPart];
      } else {
        displayLabel = mainPart;
      }

      const style = getPillColorStyle(displayLabel);
      pills.push('<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[0.64rem] font-mono border leading-none ' + style + '">'
        + '<span>' + esc(displayLabel) + '</span>'
        + (displayVal != null ? '<span class="font-bold opacity-90 font-mono">' + esc(displayVal) + '</span>' : '')
        + '</span>');
    });

    return pills.join('');
  }

  // ---- 工具 ----
  function esc(s) {
    return String(s == null ? '' : s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;');
  }
  function fill(tpl, map) {
    let out = tpl;
    Object.keys(map).forEach(function (k) { out = out.split('{' + k + '}').join(map[k]); });
    return out;
  }
  // ---- 职业与队伍数据 ----
  function classConfigOf(cls) {
    const cc = COMBAT.classes[cls];
    return cc ? JSON.parse(JSON.stringify(cc.config)) : null;
  }
  function classSkills(cls) {
    return (COMBAT.classes[cls] || { skills: [] }).skills;
  }
  function classItems(cls) {
    return (COMBAT.classes[cls] || { items: [] }).items;
  }
  function limitedSkills(cls) {
    return classSkills(cls).filter(function (s) { return s.scope === '限定'; });
  }
  function genericPool() {
    const pool = [];
    Object.keys(COMBAT.classes).forEach(function (cls) {
      COMBAT.classes[cls].skills.forEach(function (s) { if (s.scope === '通用') pool.push(s); });
    });
    return pool;
  }
  function hero3Name() {
    return state.hero3.name || OPENING_DATA.identity.defaultName;
  }
  function hero3PortraitUrl() {
    const p = state.hero3.customPortraits.filter(function (c) { return c.key === state.hero3.portrait; })[0];
    return (p && p.url) || '';
  }
  function hero3Config() {
    const cfg = classConfigOf(state.hero3.classType);
    if (!cfg) return null;
    const a = state.hero3.attrs;
    cfg.maxHp += a.maxHp * OPENING_DATA.shop.attrCosts.maxHp;
    cfg.maxMp += a.maxMp * OPENING_DATA.shop.attrCosts.maxMp;
    cfg.atk += a.atk * OPENING_DATA.shop.attrCosts.atk;
    cfg.def += a.def * OPENING_DATA.shop.attrCosts.def;
    cfg.spd += a.spd * OPENING_DATA.shop.attrCosts.spd;
    cfg.img = hero3PortraitUrl() || null;
    return cfg;
  }
  function attrLine(cfg) {
    return '[❤️HP:' + cfg.maxHp + '/' + cfg.maxHp + '][💠MP:' + cfg.maxMp + '/' + cfg.maxMp
      + '][⚔️Atk:' + cfg.atk + '][🛡️Armor:' + cfg.def + '][👟Speed:' + cfg.spd + '][🎖️职业:' + cfg.classType + ']';
  }
  function skillTagSummary(entry) {
    const d = entry.data;
    const parts = [];
    if (d.type) parts.push(d.type.replace(/[\[\]]/g, '') + (d.power ? ':' + d.power : ''));
    if (d.type2) parts.push(d.type2.replace(/[\[\]]/g, '') + (d.power2 ? ':' + d.power2 : ''));
    if (d.type3) parts.push(d.type3.replace(/[\[\]]/g, '') + (d.power3 ? ':' + d.power3 : ''));
    if (d.damageType) parts.push(d.damageType);
    if (d.isReaction) parts.push('反应' + (d.reactionTarget && d.reactionTarget !== 'all' ? '·' + d.reactionTarget : ''));
    if (d.cost) parts.push('MP' + d.cost);
    if (d.hpCost) parts.push('HP' + d.hpCost);
    if (d.turns) parts.push('持续' + d.turns);
    if (d.critRate) parts.push('暴击' + d.critRate + '%');
    if (d.hit < 100) parts.push('命中' + d.hit);
    return parts.join(' · ');
  }
  function itemEntries() {
    return OPENING_DATA.items.filter(function (e) { return state.selectedItems.has(e.id); });
  }
  // hero3 随身物品 = 所选职业标配物品（Combat_block 物品段）+ 自己购点的物品
  function hero3ItemEntries() {
    return classItems(state.hero3.classType).concat(itemEntries());
  }
  function itemsUsed() {
    return itemEntries().reduce(function (a, e) { return a + e.shopCost; }, 0);
  }
  function genericSkillEntries() {
    const pool = genericPool();
    return state.hero3.skills.map(function (name) {
      return pool.find(function (e) { return e.data.name === name; });
    }).filter(Boolean);
  }
  function genericSkillUsed() {
    const pool = genericPool();
    return state.hero3.skills.reduce(function (a, name) {
      const e = pool.find(function (p) { return p.data.name === name; });
      return a + (e ? e.shopCost : 0);
    }, 0);
  }
  function attrsUsed() {
    const c = OPENING_DATA.shop.attrCosts, a = state.hero3.attrs;
    return a.maxHp * c.maxHp + a.maxMp * c.maxMp + a.atk * c.atk + a.def * c.def + a.spd * c.spd;
  }
  function fmtTs(ts) {
    const d = new Date(ts);
    const p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function listNames(entries) {
    return entries.length ? entries.map(function (e) { return '「' + e.data.name + '」'; }).join('、') : '（无）';
  }

  // ---- 打字机 ----
  function typewrite(el, text, done) {
    stopTw();
    if (window.__OPENING_DEBUG__ && window.__OPENING_DEBUG__.instant) {
      el.textContent = text;
      el.classList.remove('tw-caret');
      if (done) done();
      return;
    }
    el.textContent = '';
    el.classList.add('tw-caret');
    state.twEl = el; state.twText = text; state.twDone = done;
    let i = 0;
    state.twTimer = setInterval(function () {
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length) finishTw();
    }, 24);
  }
  function finishTw() {
    stopTw();
    if (state.twEl) state.twEl.textContent = state.twText;
    elDropCaret();
    if (state.twDone) { const d = state.twDone; state.twDone = null; d(); }
  }
  function stopTw() {
    if (state.twTimer) { clearInterval(state.twTimer); state.twTimer = null; }
  }
  function elDropCaret() {
    if (state.twEl) state.twEl.classList.remove('tw-caret');
  }

  // ---- 酒馆助手接口封装（特性检测 + 降级） ----
  const TH = {
    hasVars: function () { return typeof getVariables === 'function'; },
    hasAssign: function () { return typeof insertOrAssignVariables === 'function'; },
    hasCreateMsg: function () { return typeof createChatMessages === 'function'; },
    hasSlash: function () { return typeof triggerSlash === 'function'; },
    readChatVars: async function () {
      if (!this.hasVars()) return null;
      try { return (await getVariables({ type: 'chat' })) || null; } catch (e) { return null; }
    },
    writeChatVars: async function (payload) {
      if (!this.hasAssign()) throw new Error('酒馆助手 insertOrAssignVariables 不可用');
      await insertOrAssignVariables(payload, { type: 'chat' });
    },
    sendAssistantMessage: async function (message) {
      if (this.hasCreateMsg()) {
        await createChatMessages([{ role: 'assistant', message: message }], { insert_before: 'end' });
        return 'createChatMessages';
      }
      if (this.hasSlash()) {
        // 降级：/sendas 以角色名义发送（换行会被压平，属尽力而为的旧版兼容路径）
        await triggerSlash('/sendas name=' + hero3Name() + ' ' + message.split('\n').join(' '));
        return 'triggerSlash';
      }
      throw new Error('酒馆助手消息接口不可用（createChatMessages / triggerSlash 均未检测到）');
    },
  };

  /* ====================================================================
   * 写入链路（一次性，确认时执行；每步幂等可安全重试）
   *   1. $mms_portrait_choice     → MiniMapStatus 立绘选择
   *   2. rpg_combat_roster        → RpgCombat 英雄档案（version 1 结构）
   *   3. createChatMessages       → AI 角色开场白落楼（含立绘标签 + Status_block）
   *   4. $opening_setup_done      → 本组件幂等标记
   * ==================================================================== */

  function buildHeroSave(entry) {
    // entry: { name, emoji, url, classType, config, skills[], items[] }
    const cfg = entry.config;
    cfg.classType = entry.classType;
    cfg.img = entry.url || null;
    return {
      name: entry.name,
      config: cfg,
      skills: entry.skills.map(function (e) { return Object.assign({}, e.data); }),
      items: entry.items.map(function (e) { return Object.assign({}, e.data); }),
    };
  }

  function buildPartySave() {
    const h1 = OPENING_DATA.party.hero1;
    const h2 = OPENING_DATA.party.hero2;
    const hero1 = buildHeroSave({
      name: h1.name, url: h1.url, classType: state.hero1Class,
      config: classConfigOf(state.hero1Class) || {}, skills: classSkills(state.hero1Class), items: classItems(state.hero1Class),
    });
    const hero2 = buildHeroSave({
      name: h2.name, url: h2.url, classType: state.hero2Class,
      config: classConfigOf(state.hero2Class) || {}, skills: classSkills(state.hero2Class), items: classItems(state.hero2Class),
    });
    const hero3 = buildHeroSave({
      name: hero3Name(), url: hero3PortraitUrl(), classType: state.hero3.classType,
      config: hero3Config() || {}, skills: limitedSkills(state.hero3.classType).concat(genericSkillEntries()), items: hero3ItemEntries(),
    });
    return { version: 1, heroes: [hero1, hero2, hero3] };
  }

  // 战斗物品分类词条（RpgCombat/MMS 通道：【弹药】【消耗品】【道具】独立行，格式 [名x数量] 供 _sbParseItems 解析）
  function buildItemsOfCategory(entries, category) {
    const list = entries.filter(function (e) { return e.data.category === category; });
    if (!list.length) return '无';
    return list.map(function (e) {
      const c = e.data.count || 0;
      return '[' + e.data.name + (c > 1 ? 'x' + c : '') + ']';
    }).join('');
  }
  // 物品行=叙事物品徽章：无数量段，RpgCombat _sbParseItems 不入列，只叙事不进战斗数据
  function buildStoryBadgeString(story) {
    const parts = String(story || '').split(/[、，,;；]/).map(function (s) {
      return s.trim().replace(/[\[\]]/g, '');
    }).filter(Boolean);
    return parts.length ? parts.map(function (p) { return '[' + p + ']'; }).join('') : '无';
  }
  function buildWeaponsString(entries) {
    const weapons = entries.filter(function (e) { return e.data.category === '武器'; });
    if (!weapons.length) return '无';
    return '[🔪] ' + weapons.map(function (e) { return '[' + e.data.name + ']'; }).join('');
  }

  function buildStatusBlock() {
    const h1 = OPENING_DATA.party.hero1;
    const h2 = OPENING_DATA.party.hero2;
    const cfg3 = hero3Config();
    const roles = [
      { emoji: h1.emoji, name: h1.name, attrs: state.hero1Class ? attrLine(classConfigOf(state.hero1Class)) : '', wearing: h1.wearing, inner: h1.inner, items: classItems(state.hero1Class), story: '' },
      { emoji: h2.emoji, name: h2.name, attrs: state.hero2Class ? attrLine(classConfigOf(state.hero2Class)) : '', wearing: h2.wearing, inner: h2.inner, items: classItems(state.hero2Class), story: '' },
      { emoji: OPENING_DATA.identity.emoji, name: hero3Name(), attrs: cfg3 ? attrLine(cfg3) : '', wearing: state.hero3.wearing, inner: state.hero3.inner, items: hero3ItemEntries(), story: state.hero3.storyItems },
    ];
    const lines = [];
    lines.push('状态栏:');
    lines.push('  日期和时间: "' + OPENING_DATA.status.date + '"');
    lines.push('  地点: "' + OPENING_DATA.status.place + '"');
    lines.push('  角色列表:');
    roles.forEach(function (r) {
      lines.push('    - 角色:');
      lines.push('        名字: "' + r.emoji + r.name + '"');
      lines.push('        属性: "' + (r.attrs || '未分配') + '"');
      lines.push('        穿着: "' + r.wearing + '"');
      lines.push('        内心: "' + r.inner + '"');
      lines.push('        武器: "' + buildWeaponsString(r.items) + '"');
      // 物品=叙事徽章（只叙事）；战斗物品走【弹药】【消耗品】【道具】词条与 RpgCombat 打通
      lines.push('        物品: "' + buildStoryBadgeString(r.story) + '"');
      lines.push('        弹药: "' + buildItemsOfCategory(r.items, '弹药') + '"');
      lines.push('        消耗品: "' + buildItemsOfCategory(r.items, '消耗品') + '"');
      lines.push('        道具: "' + buildItemsOfCategory(r.items, '道具') + '"');
    });
    if (OPENING_DATA.status.allies.length || OPENING_DATA.status.npcs.length) {
      lines.push('  人物:');
      lines.push('    盟友: ' + JSON.stringify(OPENING_DATA.status.allies));
      lines.push('    NPC: ' + JSON.stringify(OPENING_DATA.status.npcs));
    }
    lines.push('  行动选项:');
    lines.push('    名字: "🧑 ' + hero3Name() + '"');
    lines.push('    选项:');
    OPENING_DATA.status.options.forEach(function (o) { lines.push('      - "' + o + '"'); });
    return '<Status_block>\n' + lines.join('\n') + '\n</Status_block>';
  }

  function buildOpeningMessage() {
    const narrative = fill(OPENING_DATA.openingTemplate, {
      名一: OPENING_DATA.party.hero1.name,
      名二: OPENING_DATA.party.hero2.name,
      名三: hero3Name(),
      职业一: state.hero1Class || '（未定）',
      职业二: state.hero2Class || '（未定）',
      职业三: state.hero3.classType || '（未定）',
      技能一: listNames(classSkills(state.hero1Class)),
      技能二: listNames(classSkills(state.hero2Class)),
      物品清单: listNames(itemEntries()),
    });
    const tags = [];
    if (OPENING_DATA.party.hero1.url) tags.push('【立绘 ' + OPENING_DATA.party.hero1.name + '】');
    if (OPENING_DATA.party.hero2.url) tags.push('【立绘 ' + OPENING_DATA.party.hero2.name + '】');
    if (hero3PortraitUrl() && state.hero3.portrait) tags.push('【立绘 ' + state.hero3.portrait + '】');
    return narrative + '\n\n' + tags.join('') + '\n\n' + buildStatusBlock();
  }

  function buildDoneFlag() {
    return {
      ts: Date.now(),
      chars: [
        { slot: 'hero1', name: OPENING_DATA.party.hero1.name, classType: state.hero1Class },
        { slot: 'hero2', name: OPENING_DATA.party.hero2.name, classType: state.hero2Class },
        { slot: 'hero3', name: hero3Name(), classType: state.hero3.classType, portrait: state.hero3.portrait },
      ],
      customPortraits: state.hero3.customPortraits.slice(),
      skills: genericSkillEntries().map(function (e) { return e.data.name; }),
      items: itemEntries().map(function (e) { return e.data.name; }),
    };
  }

  // MMS 本机图片快照合并：把三个角色的 {名字: 立绘URL} 并入 mms_img_data_llm_v1 的
  // portrait 字典，MMS 立绘引擎（快照命中即整表覆盖内置表）按角色名匹配渲染。
  // 该 key 是 MMS 官方默许的外部集成路径（源码注释点名 ShopBlock 先例）；
  // 快照不存在/结构不合法/存储不可用时静默跳过（玩家可在 MMS 图片管理里手动添加）。
  function mergeMmsPortraitSnapshot() {
    const maps = [
      { key: OPENING_DATA.party.hero1.name, url: OPENING_DATA.party.hero1.url },
      { key: OPENING_DATA.party.hero2.name, url: OPENING_DATA.party.hero2.url },
      { key: state.hero3.portrait, url: hero3PortraitUrl() },
    ].filter(function (m) { return m.key && m.url; });
    if (!maps.length) return;
    try {
      const KEY = 'mms_img_data_llm_v1';
      const snap = JSON.parse(localStorage.getItem(KEY));
      if (!snap || typeof snap !== 'object' || !snap.portrait || !snap.avatar) return;
      maps.forEach(function (m) { snap.portrait[m.key] = m.url; });
      localStorage.setItem(KEY, JSON.stringify(snap));
    } catch (e) { /* 快照损坏或存储不可用：跳过 */ }
  }

  async function submitAll() {
    if (state.submitting) return;
    state.submitting = true;
    state.stage = 'loading';
    state.progress = 0;
    state.stepRows = [];
    render();

    const steps = [
      ['立绘选择同步 · MiniMapStatus', async function () {
        if (state.hero3.portrait) await TH.writeChatVars({ $mms_portrait_choice: state.hero3.portrait });
        mergeMmsPortraitSnapshot();
      }],
      ['战斗档案写入 · RpgCombat', async function () {
        await TH.writeChatVars({ rpg_combat_roster: buildPartySave() });
      }],
      ['开场白以 AI 角色身份注入聊天流', async function () {
        if (state.openingSent) return; // 重试时防重复落楼
        await TH.sendAssistantMessage(buildOpeningMessage());
        state.openingSent = true;
      }],
      ['归档标记写入', async function () {
        await TH.writeChatVars({ $opening_setup_done: buildDoneFlag() });
      }],
    ];

    try {
      for (let i = 0; i < steps.length; i++) {
        state.stepRows.push({ label: steps[i][0], status: 'run' });
        renderLoading();
        await steps[i][1]();
        state.stepRows[i].status = 'ok';
        state.progress = Math.round(((i + 1) / steps.length) * 100);
        renderLoading();
      }
      state.stage = 'done';
      render();
    } catch (err) {
      state.submitting = false;
      state.errorMsg = (err && err.message) || String(err);
      state.stage = 'error';
      render();
    }
  }

  /* ==================== 渲染 ==================== */

  function bgLayers() { return ''; } // 背景层为静态 DOM，不随阶段重绘

  function render() {
    stopTw();
    document.body.className = (state.stage === 'c2') ? 'theme-gilded' : 'theme-arcane';
    let html = '';
    switch (state.stage) {
      case 'title': html = viewTitle(); break;
      case 'story': html = viewStory(); break;
      case 'c1': html = viewC1(); break;
      case 'c2': html = viewC2(); break;
      case 'c3id': html = viewC3id(); break;
      case 'c3class': html = viewC3class(); break;
      case 'c3skill': html = viewC3skill(); break;
      case 'c3attr': html = viewC3attr(); break;
      case 'c3item': html = viewItems(); break;
      case 'confirm': html = viewConfirm(); break;
      case 'loading': html = viewLoading(); break;
      case 'done': html = viewDone(); break;
      case 'archived': html = viewArchived(); break;
      case 'error': html = viewError(); break;
      default: html = viewTitle(); break;
    }
    app.innerHTML = html;
    afterRender();
    if (state.soundOn) {
      if (state.stage === 'c1') playHeroCurrentVoice('hero1');
      else if (state.stage === 'c2') playHeroCurrentVoice('hero2');
      else voiceAudio.pause();
    }
    updateBgmForStage(state.stage);
  }

  function renderLoading() {
    // 只更新进度区，避免整屏重绘闪烁
    const box = document.getElementById('loading-body');
    if (box) { box.innerHTML = loadingBody(); return; }
    render();
  }

  function afterRender() {
    const twEl = document.querySelector('[data-tw]');
    if (twEl) {
      typewrite(twEl, twEl.getAttribute('data-tw'), function () {
        const nxt = document.getElementById('tw-next');
        if (nxt) nxt.classList.remove('hidden');
      });
    }
    const nameInput = document.getElementById('name-input');
    if (nameInput) {
      nameInput.addEventListener('input', function () { state.hero3.name = nameInput.value.trim() || OPENING_DATA.identity.defaultName; });
    }
    const wearingInput = document.getElementById('wearing-input');
    if (wearingInput) {
      wearingInput.addEventListener('input', function () { state.hero3.wearing = wearingInput.value.trim() || OPENING_DATA.identity.wearing; });
    }
    const innerInput = document.getElementById('inner-input');
    if (innerInput) {
      innerInput.addEventListener('input', function () { state.hero3.inner = innerInput.value.trim() || OPENING_DATA.identity.inner; });
    }
    const storyItemsInput = document.getElementById('story-items-input');
    if (storyItemsInput) {
      storyItemsInput.addEventListener('input', function () { state.hero3.storyItems = storyItemsInput.value.trim(); });
    }

  function switchHeroClassLocally(heroKey, newClass) {
    const hero = OPENING_DATA.party[heroKey];
    if (!hero) return;

    if (heroKey === 'hero1') state.hero1Class = newClass;
    else state.hero2Class = newClass;

    const clsObj = COMBAT.classes[newClass];
    const cfg = clsObj ? clsObj.config : { maxHp: 100, maxMp: 40, atk: 12, def: 3, spd: 100 };
    const voiceData = (hero.classVoiceMap && hero.classVoiceMap[newClass]) || { quote: '', audioUrl: '' };

    // 1. 职业选项卡高亮增量切换
    document.querySelectorAll('[data-class-tab]').forEach(function (tab) {
      tab.classList.toggle('active', tab.getAttribute('data-class-tab') === newClass);
    });

    // 2. 左侧台词气泡平滑过渡
    const quoteEl = document.getElementById('hero-dialogue-quote');
    if (quoteEl) {
      quoteEl.style.opacity = '0';
      quoteEl.style.transform = 'translateY(4px)';
      setTimeout(function () {
        quoteEl.textContent = voiceData.quote;
        quoteEl.style.opacity = '1';
        quoteEl.style.transform = 'translateY(0)';
      }, 150);
    }

    // 3. 五维属性面板平滑更新
    const attrTitle = document.getElementById('hero-attr-profile-tag');
    if (attrTitle) attrTitle.textContent = 'PROFILE // ' + newClass;

    const attrs = [
      { id: 'hero-attr-hp', val: cfg.maxHp },
      { id: 'hero-attr-mp', val: cfg.maxMp },
      { id: 'hero-attr-atk', val: cfg.atk },
      { id: 'hero-attr-armor', val: cfg.def },
      { id: 'hero-attr-speed', val: cfg.spd },
    ];
    attrs.forEach(function (item) {
      const el = document.getElementById(item.id);
      if (el) {
        el.style.opacity = '0.2';
        setTimeout(function () {
          el.textContent = item.val;
          el.style.opacity = '1';
        }, 120);
      }
    });

    // 4. 右侧 6 技能栏重新渲染并依次阶梯滑入
    const skillsContainer = document.getElementById('hero-skill-chips-container');
    if (skillsContainer && clsObj) {
      skillsContainer.style.opacity = '0';
      skillsContainer.style.transform = 'translateY(6px)';
      setTimeout(function () {
        skillsContainer.innerHTML = clsObj.skills.map(function (s, idx) {
          return renderSkillSlotChip(s, false, idx + 1, false);
        }).join('');
        skillsContainer.style.opacity = '1';
        skillsContainer.style.transform = 'translateY(0)';
      }, 150);
    }

    // 5. 播放专属台词音频
    playHeroCurrentVoice(heroKey);
  }

  /* 跨阶段导航：柔和沉浸淡出淡入转场（250ms 淡出 + 300ms 淡入），支持 instant 测试 */
  let isStageTransitioning = false;
  function gotoStageWithCrossfade(st) {
    if (isStageTransitioning) return;
    if (state.stage === st) return;

    if (window.__OPENING_DEBUG__ && window.__OPENING_DEBUG__.instant) {
      state.stage = st;
      render();
      return;
    }

    isStageTransitioning = true;
    app.classList.remove('stage-fade-in');
    app.classList.add('stage-fade-out');

    setTimeout(function () {
      state.stage = st;
      render();
      app.classList.remove('stage-fade-out');
      app.classList.add('stage-fade-in');

      setTimeout(function () {
        app.classList.remove('stage-fade-in');
        isStageTransitioning = false;
      }, 300);
    }, 250);
  }

  /* ==================== 事件 ==================== */

  app.addEventListener('click', function (ev) {
    const t = ev.target.closest('[data-action]');
    if (!t) return;
    const act = t.getAttribute('data-action');
    switch (act) {
      case 'tw-skip':
        if (state.twTimer) finishTw();
        break;
      case 'sound': enterImmersiveFs(); toggleSound(); break;
      case 'start':
        enterImmersiveFs();
        state.storyPage = 0;
        gotoStageWithCrossfade('story');
        break;
      case 'auto-fs-toggle':
        state.autoFullscreen = !state.autoFullscreen; render(); break;
      case 'story-next':
        state.storyPage++; render(); break;
      case 'story-done':
        gotoStageWithCrossfade('c1'); break;
      case 'c1-pick':
        switchHeroClassLocally('hero1', t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c1-done':
        if (!state.hero1Class) { state.flash = '先为角色一选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c2');
        break;
      case 'c2-pick':
        switchHeroClassLocally('hero2', t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c2-done':
        if (!state.hero2Class) { state.flash = '先为角色二选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c3id');
        break;
      case 'c3id-done':
        gotoStageWithCrossfade('c3class');
        break;
      case 'c3-class-pick':
        switchHero3ClassLocally(t.getAttribute('data-class') || '');
        state.flash = '';
        break;
      case 'c3class-done':
        if (!state.hero3.classType) { state.flash = '先为自定义角色选择职业'; render(); break; }
        state.flash = '';
        gotoStageWithCrossfade('c3skill');
        break;
      case 'c3-skill-remove':
      case 'c3-skill-toggle':
        toggleC3Skill(t.getAttribute('data-skill'));
        break;
      case 'c3skill-done':
        gotoStageWithCrossfade('c3attr');
        break;
      case 'c3-attr':
        toggleC3Attr(t.getAttribute('data-attr'), t.getAttribute('data-dir'));
        break;
      case 'c3attr-done':
        gotoStageWithCrossfade('c3item');
        break;
      case 'item-toggle':
        toggleItem(t.getAttribute('data-item-id'));
        break;
      case 'c3item-done':
        gotoStageWithCrossfade('confirm');
        break;
      case 'play-voice': {
        const heroId = t.getAttribute('data-hero');
        if (heroId) playHeroCurrentVoice(heroId);
        break;
      }
      case 'portrait-pick':
        state.hero3.portrait = t.getAttribute('data-portrait-key') || ''; render(); break;
      case 'portrait-add': addCustomPortrait(); break;
      case 'confirm-submit': submitAll(); break;
      case 'retry': state.stage = 'loading'; state.stepRows = []; state.progress = 0; submitAll(); break;
      case 'force-redo':
        state.openingSent = false;
        state.doneFlag = null;
        gotoStageWithCrossfade('title');
        break;
      case 'back-c1': gotoStageWithCrossfade('c1'); break;
      case 'back-c2': gotoStageWithCrossfade('c2'); break;
      case 'back-c3id': gotoStageWithCrossfade('c3id'); break;
      case 'back-c3class': gotoStageWithCrossfade('c3class'); break;
      case 'back-c3skill': gotoStageWithCrossfade('c3skill'); break;
      case 'back-c3attr': gotoStageWithCrossfade('c3attr'); break;
      case 'back-c3item': gotoStageWithCrossfade('c3item'); break;
    }
  });

  function addCustomPortrait() {
    const nameEl = document.getElementById('custom-pname');
    const urlEl = document.getElementById('custom-purl');
    const flash = document.getElementById('custom-flash');
    const name = (nameEl && nameEl.value.trim()) || '自定义立绘';
    const url = urlEl ? urlEl.value.trim() : '';
    if (!/^https?:\/\//.test(url)) {
      if (flash) flash.classList.remove('hidden');
      return;
    }
    if (flash) flash.classList.add('hidden');
    // 同名覆盖：重填即修正，无需删除入口
    state.hero3.customPortraits = state.hero3.customPortraits.filter(function (p) { return p.key !== name; });
    state.hero3.customPortraits.push({ key: name, name: name, desc: '玩家自定义', url: url });
    state.hero3.portrait = name;
    render();
  }

  function toggleFs() {
    try {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      }
    } catch (e) { /* 宿主 iframe 未授权全屏时静默 */ }
  }

  // 修仙开局同款：首屏勾选"同时开启沉浸全屏"后，点击进入/声音时自动请求全屏
  function enterImmersiveFs() {
    if (!state.autoFullscreen) return;
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        const p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () { /* 宿主拒绝时静默 */ });
      }
    } catch (e) { /* 未授权全屏时静默 */ }
  }

  function updateFsIcon() {
    const expand = document.getElementById('fs-icon-expand');
    const compress = document.getElementById('fs-icon-compress');
    if (!expand || !compress) return;
    const fs = !!document.fullscreenElement;
    expand.classList.toggle('hidden', fs);
    compress.classList.toggle('hidden', !fs);
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    try {
      bgVideo.muted = !state.soundOn;
      updateBgmForStage(state.stage);
    } catch (e) { /* 自动播放策略拒绝时静默 */ }
    render();
  }

  function refreshBudget(boxId, used, total) {
    const box = document.getElementById(boxId);
    if (box) box.innerHTML = budgetBar(used, total, false);
  }

  function toggleC3Skill(name) {
    const entry = genericPool().find(function (e) { return e.data.name === name; });
    if (!entry) return;
    const idx = state.hero3.skills.indexOf(name);
    let isAdded = false;
    if (idx >= 0) {
      state.hero3.skills.splice(idx, 1);
      isAdded = false;
    } else {
      if (state.hero3.skills.length >= 3) {
        showFlashToast('通用技能槽位已满（最多装配 3 个）');
        return;
      }
      if (genericSkillUsed() + entry.shopCost > OPENING_DATA.shop.skillPoints) {
        showFlashToast('通用技能点数不足（上限 ' + OPENING_DATA.shop.skillPoints + ' 点）');
        return;
      }
      state.hero3.skills.push(name);
      isAdded = true;
    }
    // 纯增量更新：绝不触发整页 DOM 重绘，消除生硬刷新
    incrementalUpdateC3Skill(name, isAdded);
  }

  function toggleC3Attr(key, dir) {
    if (!(key in state.hero3.attrs)) return;
    const cost = OPENING_DATA.shop.attrCosts[key] || 1;
    const totalPoints = OPENING_DATA.shop.attrPoints;
    if (dir === '+') {
      if (attrsUsed() + cost > totalPoints) {
        showFlashToast('属性点数不足（上限 ' + totalPoints + ' 点）');
        refreshBudget('attr-budget', attrsUsed(), totalPoints);
        return; // 点数不足：拒绝（预算边界）
      }
      state.hero3.attrs[key]++;
    } else {
      if (state.hero3.attrs[key] > 0) {
        state.hero3.attrs[key]--;
      } else {
        return;
      }
    }
    // 纯增量更新：局部刷新顶部能量条与该项数值，绝不整页重绘
    refreshBudget('attr-budget', attrsUsed(), totalPoints);
    const valEl = document.getElementById('attr-val-' + key);
    if (valEl) valEl.innerHTML = renderAttrValHtml(key);
  }

  function toggleItem(id) {
    const entry = OPENING_DATA.items.find(function (e) { return e.id === id; });
    if (!entry) return;
    const totalPoints = OPENING_DATA.shop.itemPoints;
    if (state.selectedItems.has(id)) {
      state.selectedItems.delete(id);
    } else {
      if (itemsUsed() + entry.shopCost > totalPoints) {
        showFlashToast('物品预算不足（上限 ' + totalPoints + ' 点）');
        refreshBudget('item-budget', itemsUsed(), totalPoints);
        return;
      }
      state.selectedItems.add(id);
    }
    // 纯增量更新：局部刷新顶部能量条与被点击卡片高亮，绝不整页重绘
    refreshBudget('item-budget', itemsUsed(), totalPoints);
    const cardEl = document.querySelector('[data-item-id="' + id + '"]');
    if (cardEl) {
      cardEl.classList.toggle('sel', state.selectedItems.has(id));
    }
  }

  /* ==================== 启动 ==================== */

  async function boot() {
    // 全屏按钮：独立常驻控件，不随阶段重绘
    const fsBtn = document.getElementById('fs-btn');
    if (fsBtn) fsBtn.addEventListener('click', toggleFs);
    document.addEventListener('fullscreenchange', updateFsIcon);

    // 背景视频 / BGM 配置应用
    if (OPENING_DATA.bgVideo.url) {
      bgVideo.src = OPENING_DATA.bgVideo.url;
      bgVideo.classList.remove('hidden');
      bgVideo.style.setProperty('--vid-op', String(OPENING_DATA.bgVideo.opacity || 0.6));
      bgFallback.style.display = 'none';
    }

    // 幂等检查：本聊天已初始化 → 归档摘要，不再进向导
    const vars = await TH.readChatVars();
    const done = vars ? vars.$opening_setup_done : null;
    if (done && typeof done === 'object') {
      state.doneFlag = done;
      // 恢复玩家自定义立绘候选（强制重配时可复用）
      if (Array.isArray(done.customPortraits)) state.hero3.customPortraits = done.customPortraits;
      state.stage = 'archived';
    } else {
      state.stage = 'title';
    }
    render();
  }

  // 调试/测试钩子（MMS window.MMS 同款惯例，不影响产品行为）
  window.__OPENING_DEBUG__ = { state: state, DATA: OPENING_DATA, COMBAT: COMBAT, instant: false, mergeMmsPortraitSnapshot: mergeMmsPortraitSnapshot };

  boot();
})();
</script>

</html>
