<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root, body.theme-arcane {
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;
    
    --bg-base: #0a0d13;
    --panel-bg: rgba(13, 17, 24, 0.78);
    --panel-glass: rgba(17, 23, 33, 0.65);
    --panel-border: rgba(198, 161, 84, 0.28);
    --panel-border-bright: rgba(224, 185, 102, 0.88);
    --accent: #d9b45c;
    --accent-glow: rgba(217, 180, 92, 0.38);
    --accent-dim: rgba(198, 161, 84, 0.16);
    --text-main: #f0e6d2;
    --text-muted: rgba(232, 220, 192, 0.68);
    --slot-bg: rgba(9, 12, 18, 0.82);
    --slot-border: rgba(198, 161, 84, 0.25);
    --slot-glow: 0 0 16px rgba(217, 180, 92, 0.22);
    --badge-limited: #d9b45c;
    --badge-generic: #c084fc;
    --card-hover: rgba(26, 34, 48, 0.75);
    
    /* 悬浮窗专属微晶底色与辉光 */
    --tooltip-bg: rgba(11, 15, 22, 0.94);
    --tooltip-border: rgba(217, 180, 92, 0.45);
    --tooltip-glow: 0 12px 36px -4px rgba(0, 0, 0, 0.85), 0 0 20px rgba(217, 180, 92, 0.2);
  }

  /* 琉璃暗耀 (Gilded Crystal) */
  body.theme-gilded {
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;

    --bg-base: #110c1c;
    --panel-bg: rgba(22, 15, 36, 0.82);
    --panel-glass: rgba(30, 20, 50, 0.65);
    --panel-border: rgba(236, 195, 110, 0.36);
    --panel-border-bright: rgba(255, 222, 145, 0.95);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.45);
    --accent-dim: rgba(192, 132, 252, 0.18);
    --text-main: #fdf4ff;
    --text-muted: rgba(243, 232, 255, 0.7);
    --slot-bg: rgba(18, 11, 30, 0.88);
    --slot-border: rgba(216, 180, 254, 0.32);
    --slot-glow: 0 0 20px rgba(192, 132, 252, 0.32);
    --badge-limited: #d9b45c;
    --badge-generic: #c084fc;
    --card-hover: rgba(45, 28, 72, 0.78);

    --tooltip-bg: rgba(18, 12, 30, 0.95);
    --tooltip-border: rgba(236, 195, 110, 0.5);
    --tooltip-glow: 0 12px 36px -4px rgba(0, 0, 0, 0.88), 0 0 24px rgba(192, 132, 252, 0.25);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-serif);
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* 背景环境光与颗粒暗角 */
  #ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 20% 30%, rgba(217, 180, 92, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.07) 0%, transparent 60%);
    transition: all 0.5s ease;
  }
  body.theme-gilded #ambient-glow {
    background: radial-gradient(circle at 30% 25%, rgba(245, 158, 11, 0.13) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.18) 0%, transparent 60%);
  }

  #vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(115% 100% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.65) 100%);
  }

  /* 顶部切换导航 */
  .top-theme-dock {
    position: fixed;
    top: 14px;
    right: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 14, 20, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 9999px;
    padding: 4px 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .theme-btn {
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 9999px;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-family: var(--font-serif);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .theme-btn.active {
    color: var(--accent);
    background: var(--accent-dim);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* 技能插槽芯片 */
  .skill-slot-chip {
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .skill-slot-chip:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 3.5px;
    background: var(--slot-border);
    transition: background 0.25s ease;
  }
  .skill-slot-chip.type-limited:before {
    background: linear-gradient(to bottom, #fbbf24 0%, #d9b45c 50%, #92400e 100%);
    box-shadow: 0 0 10px rgba(217, 180, 92, 0.7);
  }
  .skill-slot-chip.type-generic:before {
    background: #c084fc;
    box-shadow: 0 0 10px rgba(192, 132, 252, 0.55);
  }
  .skill-slot-chip.is-reaction:before {
    background: #f43f5e;
    box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
  }
  .skill-slot-chip:hover {
    border-color: var(--panel-border-bright);
    box-shadow: var(--slot-glow);
    background: var(--card-hover);
    transform: translateY(-1px);
  }

  /* 高阶与传奇动态流光 */
  .skill-slot-chip.tier-advanced {
    border-color: rgba(251, 191, 36, 0.65);
    background: linear-gradient(90deg, rgba(245, 158, 11, 0.12) 0%, rgba(38, 26, 12, 0.68) 32%, rgba(18, 14, 8, 0.85) 100%);
  }
  .skill-slot-chip.tier-advanced:before {
    background: linear-gradient(to bottom, #fffbeb 0%, #fbbf24 45%, #d97706 100%);
    box-shadow: 0 0 14px rgba(251, 191, 36, 0.95);
  }
  .skill-slot-chip.tier-legendary {
    border-color: rgba(239, 68, 68, 0.75);
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.16) 0%, rgba(48, 12, 16, 0.75) 32%, rgba(24, 8, 10, 0.9) 100%);
  }
  .skill-slot-chip.tier-legendary:before {
    background: linear-gradient(to bottom, #fee2e2 0%, #ef4444 45%, #991b1b 100%);
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.95);
  }

  /* 胶囊交互态：当鼠标 hover 在卡片内某个特定标签胶囊上时，高亮放大 */
  .pill-trigger {
    cursor: help;
    transition: all 0.18s ease;
  }
  .pill-trigger:hover {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.08);
    transform: scale(1.04);
  }

  /* ========================================================
     纯悬浮窗 (Floating Tooltip) 核心样式体系
     ======================================================== */
  #skill-tooltip-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 320px;
    max-width: 90vw;
    z-index: 99999;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #skill-tooltip-container.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .tooltip-glass-card {
    background: var(--tooltip-bg);
    backdrop-filter: blur(20px) saturate(1.25);
    -webkit-backdrop-filter: blur(20px) saturate(1.25);
    border: 1px solid var(--tooltip-border);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: var(--tooltip-glow);
    position: relative;
    overflow: hidden;
  }

  /* 顶部鎏金流动线 */
  .tooltip-glass-card:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
    opacity: 0.85;
  }

  /* 单个机制词条条目 */
  .tooltip-mech-entry {
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .tooltip-mech-entry:last-child {
    border-bottom: none;
    padding-bottom: 2px;
  }
  .tooltip-mech-entry:first-child {
    padding-top: 2px;
  }

  /* 滚动条 */
  .custom-scrollbar::-webkit-scrollbar { width: 3px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(217, 180, 92, 0.35); border-radius: 3px; }
</style>
</head>

  /* 提取技能包含的机制标识集合 */
  function extractMechanicsKeys(rawText) {
    const keys = [];
    if (!rawText) return keys;

    if (rawText.includes('看破')) keys.push('看破');
    if (rawText.includes('反应')) keys.push('反应');
    if (rawText.includes('舍身')) keys.push('舍身');
    if (rawText.includes('反击')) keys.push('反击');
    if (rawText.includes('肃正')) keys.push('肃正');
    if (rawText.includes('免伤')) keys.push('免伤');
    if (rawText.includes('再动')) keys.push('再动');
    if (rawText.includes('延迟')) keys.push('延迟');
    if (rawText.includes('加速')) keys.push('加速');
    if (rawText.includes('单速') || rawText.includes('群速')) keys.push('单速');
    if (rawText.includes('单缓') || rawText.includes('群缓')) keys.push('单缓');
    if (rawText.includes('单降') || rawText.includes('群降')) keys.push('目标降防');
    if (rawText.includes('单弱') || rawText.includes('群弱')) keys.push('目标降攻');
    if (rawText.includes('单盲') || rawText.includes('群盲')) keys.push('目标致盲');
    if (rawText.includes('自盲') || rawText.includes('自降') || rawText.includes('自弱')) keys.push('自身致盲');
    if (rawText.includes('必中')) keys.push('必中');
    if (rawText.includes('暴击')) keys.push('暴击');
    if (rawText.includes('穿透')) keys.push('穿透');
    if (rawText.includes('散射') || rawText.includes('霰弹')) keys.push('散射');
    if (rawText.includes('转火')) keys.push('转火');
    if (rawText.includes('回避')) keys.push('回避');
    if (rawText.includes('麻痹')) keys.push('麻痹');
    if (rawText.includes('中毒')) keys.push('中毒');
    if (rawText.includes('燃烧')) keys.push('燃烧');
    if (rawText.includes('他人')) keys.push('他人');
    if (rawText.includes('驱散')) keys.push('驱散');
    if (rawText.includes('子弹') || rawText.includes('鹿弹') || rawText.includes('道具') || rawText.includes('消耗品')) keys.push('材料绑定');

    return Array.from(new Set(keys));
  }

  /* 格式化效果胶囊标签 */
  function formatSkillPills(rawText) {
    if (!rawText) return '';
    let clean = rawText.replace(/【[^】]+】/, '');
    clean = clean.replace(/\[(限定|通用)\]/g, '');
    clean = clean.replace(/\[价:\d+\]/g, '');
    clean = clean.replace(/\[MP:\d+\]/g, '');
    clean = clean.replace(/\[HP:\d+\]/g, '');
    clean = clean.replace(/\[TP:\d+\]/g, '');
    clean = clean.replace(/\[特效:[^\]]+\]/g, '');

    const tagMatches = clean.match(/\[([^\]]+)\]/g) || [];
    const pills = [];

    tagMatches.forEach(tagStr => {
      const inner = tagStr.slice(1, -1).trim();
      const parts = inner.split(/[;；]/);
      const mainPart = parts[0].trim();
      let powerVal = null;
      parts.slice(1).forEach(p => {
        const pm = p.match(/power:(-?\d+)/i);
        if (pm) powerVal = pm[1];
      });

      if (/^Aim[:：]/i.test(mainPart) || mainPart === '必中') return;
      if (/^(?:反应|舍身|看破)/i.test(mainPart)) return; // 顶部已有专属徽章

      let label = TAG_EXPAND_MAP[mainPart] || mainPart;
      let targetMechKey = null;

      // 提取对应的机制 key 用于胶囊精确 hover
      if (mainPart.includes('散射') || mainPart.includes('霰弹')) { label = '散射伤害'; targetMechKey = '散射'; }
      else if (mainPart.includes('转火')) { label = '转火追击'; targetMechKey = '转火'; }
      else if (mainPart.includes('肃正')) { label = '绝对肃正'; targetMechKey = '肃正'; }
      else if (mainPart.includes('免伤')) { label = '绝对免伤'; targetMechKey = '免伤'; }
      else if (mainPart.includes('回避')) { label = '紧急回避'; targetMechKey = '回避'; }
      else if (mainPart.includes('穿透')) { label = '单体穿透'; targetMechKey = '穿透'; }
      else if (mainPart.includes('再动')) { label = '额外行动'; targetMechKey = '再动'; }
      else if (mainPart.includes('延迟')) { label = '蓄力准备'; targetMechKey = '延迟'; }
      else if (mainPart.includes('加速')) { label = '蓄力库存'; targetMechKey = '加速'; }
      else if (mainPart.includes('麻痹')) { label = '雷电麻痹'; targetMechKey = '麻痹'; }
      else if (mainPart.includes('中毒')) { label = '毒素侵蚀'; targetMechKey = '中毒'; }
      else if (mainPart.includes('燃烧')) { label = '火焰灼烧'; targetMechKey = '燃烧'; }
      else if (mainPart.includes('单降')) { label = '目标降防'; targetMechKey = '目标降防'; }
      else if (mainPart.includes('自盲')) { label = '自身致盲'; targetMechKey = '自身致盲'; }
      else if (mainPart.includes('单缓')) { label = '目标缓速'; targetMechKey = '单缓'; }
      else if (mainPart === '他人') { label = '指定友方'; targetMechKey = '他人'; }
      else if (mainPart.includes('驱散')) { label = '净化驱散'; targetMechKey = '驱散'; }

      let dotClass = 'bg-amber-400 shadow-[0_0_6px_rgba(251,191,36,0.9)]';
      if (label.includes('伤害') || label.includes('穿透') || label.includes('散射')) {
        dotClass = 'bg-rose-400 shadow-[0_0_6px_rgba(251,113,133,0.9)]';
      } else if (label.includes('回复') || label.includes('净化') || label.includes('友方')) {
        dotClass = 'bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.9)]';
      } else if (label.includes('护盾') || label.includes('加防') || label.includes('肃正') || label.includes('免伤') || label.includes('回避')) {
        dotClass = 'bg-sky-400 shadow-[0_0_6px_rgba(56,189,248,0.9)]';
      } else if (label.includes('降') || label.includes('盲') || label.includes('缓') || label.includes('毒') || label.includes('燃') || label.includes('麻痹')) {
        dotClass = 'bg-purple-400 shadow-[0_0_6px_rgba(192,132,252,0.9)]';
      }

      const mechAttr = targetMechKey ? `data-mech-focus="${targetMechKey}"` : '';

      pills.push(`
        <span ${mechAttr} class="pill-trigger inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[0.63rem] font-mono border border-white/10 bg-white/[0.03] text-white/85 leading-none">
          <span class="w-1.5 h-1.5 rounded-full ${dotClass} shrink-0"></span>
          <span>${label}</span>
          ${powerVal ? `<span class="font-bold text-amber-200 ml-0.5">${powerVal}</span>` : ''}
        </span>
      `);
    });

    return pills.join('');
  }

  /* =========================================================================
     纯悬浮窗交互引擎 (智能定位、防视口溢出、纯粹游戏词条展示)
     ========================================================================= */
  const tooltipContainer = document.getElementById('skill-tooltip-container');
  const ttName = document.getElementById('tt-skill-name');
  const ttIcon = document.getElementById('tt-type-icon');
  const ttBadges = document.getElementById('tt-header-badges');
  const ttBody = document.getElementById('tt-mechanics-body');

  let activeTooltipTimer = null;

  function showTooltipForSkill(skill, targetRect, focusMechKey = null) {
    if (!skill || !tooltipContainer) return;

    // 1. 设置头部概要
    ttName.textContent = skill.name;
    ttIcon.textContent = skill.typeTag === '法术' ? '🔮' : (skill.typeTag === '远程' ? '🏹' : '⚔️');

    const badges = [];
    if (skill.tier === 3) badges.push('<span class="text-red-300 border border-red-500/50 bg-red-950/40 px-1.5 py-0.2 rounded">传奇</span>');
    else if (skill.tier === 2) badges.push('<span class="text-amber-300 border border-amber-500/50 bg-amber-950/40 px-1.5 py-0.2 rounded">高阶</span>');
    badges.push(`<span class="text-white/60 border border-white/10 bg-black/40 px-1.5 py-0.2 rounded">${skill.typeTag}</span>`);
    ttBadges.innerHTML = badges.join('');

    // 2. 提取并渲染关联机制
    const mechKeys = extractMechanicsKeys(skill.rawText);
    
    // 如果指定了具体聚焦的机制，将其置顶高亮
    let displayKeys = mechKeys;
    if (focusMechKey && mechKeys.includes(focusMechKey)) {
      displayKeys = [focusMechKey, ...mechKeys.filter(k => k !== focusMechKey)];
    }

    if (displayKeys.length === 0) {
      ttBody.innerHTML = `
        <div class="text-[0.72rem] text-white/45 py-2 font-mono text-center">基础物理攻防技能，无特殊扩展机制</div>
      `;
    } else {
      ttBody.innerHTML = displayKeys.map(key => {
        const item = MECHANICS_REGISTRY[key] || { title: key, icon: '✦', desc: '按标准规则结算生效。' };
        const isFocused = focusMechKey === key;
        
        let borderHighlight = isFocused ? 'border-amber-400/80 bg-amber-500/10' : 'border-white/5 bg-white/[0.02]';

        return `
          <div class="tooltip-mech-entry ${borderHighlight} rounded-lg px-2 py-1.5 transition-all">
            <div class="flex items-center gap-1.5 text-xs font-bold text-[var(--accent)] mb-0.5">
              <span>${item.icon}</span>
              <span class="tracking-wide">【${item.title}】</span>
              ${isFocused ? '<span class="text-[0.58rem] text-amber-300 font-mono font-normal ml-auto">聚焦机制</span>' : ''}
            </div>
            <div class="text-[0.72rem] text-white/80 leading-relaxed font-sans pl-5">
              ${item.desc}
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. 智能定位与防视口溢出计算
    tooltipContainer.classList.add('visible');
    const ttWidth = tooltipContainer.offsetWidth || 320;
    const ttHeight = tooltipContainer.offsetHeight || 180;
    const padding = 12;

    let posX = targetRect.left + (targetRect.width / 2) - (ttWidth / 2);
    let posY = targetRect.top - ttHeight - 8; // 默认在卡片正上方

    // 上边界溢出检测：如果上方放不下，放下方
    if (posY < padding) {
      posY = targetRect.bottom + 8;
    }
    // 左边界溢出检测
    if (posX < padding) {
      posX = padding;
    }
    // 右边界溢出检测
    if (posX + ttWidth > window.innerWidth - padding) {
      posX = window.innerWidth - ttWidth - padding;
    }

    tooltipContainer.style.left = `${Math.round(posX)}px`;
    tooltipContainer.style.top = `${Math.round(posY)}px`;
  }

  function hideTooltip() {
    if (!tooltipContainer) return;
    tooltipContainer.classList.remove('visible');
  }

  function bindTooltipEvents() {
    const cards = document.querySelectorAll('[data-skill-idx]');

    cards.forEach(card => {
      const idx = parseInt(card.getAttribute('data-skill-idx'), 10);
      const skill = DEMO_SKILLS[idx];
      if (!skill) return;

      // 整个卡片悬停事件
      card.addEventListener('mouseenter', (e) => {
        clearTimeout(activeTooltipTimer);
        const rect = card.getBoundingClientRect();
        activeTooltipTimer = setTimeout(() => {
          showTooltipForSkill(skill, rect, null);
        }, 60);
      });

      card.addEventListener('mouseleave', () => {
        clearTimeout(activeTooltipTimer);
        hideTooltip();
      });

      // 卡片内部独立效果胶囊的聚焦悬停
      const pillTriggers = card.querySelectorAll('[data-mech-focus]');
      pillTriggers.forEach(pill => {
        pill.addEventListener('mouseenter', (e) => {
          e.stopPropagation();
          clearTimeout(activeTooltipTimer);
          const mechKey = pill.getAttribute('data-mech-focus');
          const pillRect = pill.getBoundingClientRect();
          activeTooltipTimer = setTimeout(() => {
            showTooltipForSkill(skill, pillRect, mechKey);
          }, 30);
        });

        pill.addEventListener('mouseleave', (e) => {
          e.stopPropagation();
          // 回退至卡片主悬浮窗
          const rect = card.getBoundingClientRect();
          showTooltipForSkill(skill, rect, null);
        });
      });

      // 移动端轻触支持
      card.addEventListener('click', (e) => {
        const rect = card.getBoundingClientRect();
        showTooltipForSkill(skill, rect, null);
      });
    });

    // 点击空白处收起
    document.addEventListener('click', (e) => {
      if (!e.target.closest('[data-skill-idx]') && !e.target.closest('#skill-tooltip-container')) {
        hideTooltip();
      }
    });

    // 滚动时隐藏，防止悬浮窗悬空
    window.addEventListener('scroll', () => {
      hideTooltip();
    }, { passive: true });
  }

  /* 主题切换 */
  function switchTheme(theme) {
    const b = document.body;
    const btnArc = document.getElementById('btn-theme-arcane');
    const btnGild = document.getElementById('btn-theme-gilded');

    if (theme === 'gilded') {
      b.className = 'theme-gilded select-none min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:px-8';
      btnGild.classList.add('active');
      btnArc.classList.remove('active');
    } else {
      b.className = 'theme-arcane select-none min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:px-8';
      btnArc.classList.add('active');
      btnGild.classList.remove('active');
    }
  }

  // 初始化渲染
  document.addEventListener('DOMContentLoaded', () => {
    renderSkillsList();
  });
  </script>
</body>
</html>
