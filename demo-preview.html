<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开局初始化 · 视觉优化演示 (Demo Preview)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 威廉 & 自定义主角专属：密教金辉 (Noir Arcane) */
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;
    
    --bg-base: #0a0d13;
    --panel-bg: rgba(13, 17, 24, 0.76);
    --panel-glass: rgba(17, 23, 33, 0.6);
    --panel-border: rgba(198, 161, 84, 0.28);
    --panel-border-bright: rgba(224, 185, 102, 0.85);
    --accent: #d9b45c;
    --accent-glow: rgba(217, 180, 92, 0.38);
    --accent-dim: rgba(198, 161, 84, 0.16);
    --text-main: #f0e6d2;
    --text-muted: rgba(232, 220, 192, 0.7);
    --slot-bg: rgba(9, 12, 18, 0.82);
    --slot-border: rgba(198, 161, 84, 0.25);
    --slot-glow: 0 0 15px rgba(217, 180, 92, 0.22);
    --badge-limited: rgba(217, 180, 92, 0.95);
    --badge-generic: rgba(120, 200, 150, 0.95);
    --badge-reaction: rgba(235, 110, 110, 0.95);
    --card-hover: rgba(26, 34, 48, 0.75);
    --btn-bg: linear-gradient(135deg, rgba(198, 161, 84, 0.24), rgba(198, 161, 84, 0.06));
    --btn-border: rgba(198, 161, 84, 0.5);
  }

  /* 备用：战术全息 (Tactical Holo) */
  body.theme-tactical {
    --font-serif: 'Rajdhani', 'Noto Serif SC', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Rajdhani', sans-serif;

    --bg-base: #060b12;
    --panel-bg: rgba(8, 16, 26, 0.82);
    --panel-glass: rgba(12, 24, 38, 0.65);
    --panel-border: rgba(64, 180, 229, 0.32);
    --panel-border-bright: rgba(80, 215, 255, 0.92);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.45);
    --accent-dim: rgba(56, 189, 248, 0.16);
    --text-main: #e0f2fe;
    --text-muted: rgba(186, 230, 253, 0.7);
    --slot-bg: rgba(6, 14, 24, 0.88);
    --slot-border: rgba(56, 189, 248, 0.28);
    --slot-glow: 0 0 18px rgba(56, 189, 248, 0.3);
    --badge-limited: rgba(56, 189, 248, 0.95);
    --badge-generic: rgba(52, 211, 153, 0.95);
    --badge-reaction: rgba(251, 113, 133, 0.95);
    --card-hover: rgba(14, 34, 52, 0.78);
    --btn-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.26), rgba(56, 189, 248, 0.06));
    --btn-border: rgba(56, 189, 248, 0.6);
  }

  /* 冯专属：琉璃暗耀 (Gilded Crystal) */
  body.theme-gilded {
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;

    --bg-base: #110c1c;
    --panel-bg: rgba(22, 15, 36, 0.8);
    --panel-glass: rgba(30, 20, 50, 0.62);
    --panel-border: rgba(236, 195, 110, 0.36);
    --panel-border-bright: rgba(255, 222, 145, 0.95);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.45);
    --accent-dim: rgba(192, 132, 252, 0.18);
    --text-main: #fdf4ff;
    --text-muted: rgba(243, 232, 255, 0.7);
    --slot-bg: rgba(18, 11, 30, 0.88);
    --slot-border: rgba(216, 180, 254, 0.32);
    --slot-glow: 0 0 20px rgba(192, 132, 252, 0.32);
    --badge-limited: rgba(245, 158, 11, 0.95);
    --badge-generic: rgba(192, 132, 252, 0.95);
    --badge-reaction: rgba(244, 63, 94, 0.95);
    --card-hover: rgba(45, 28, 72, 0.78);
    --btn-bg: linear-gradient(135deg, rgba(245, 158, 11, 0.26), rgba(192, 132, 252, 0.16));
    --btn-border: rgba(245, 158, 11, 0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-serif);
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* 背景环境光 */
  #ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 20% 30%, rgba(217, 180, 92, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.06) 0%, transparent 60%);
    transition: all 0.5s ease;
  }
  body.theme-tactical #ambient-glow {
    background: radial-gradient(circle at 25% 35%, rgba(56, 189, 248, 0.14) 0%, transparent 60%),
                radial-gradient(circle at 75% 75%, rgba(30, 58, 138, 0.22) 0%, transparent 60%);
  }
  body.theme-gilded #ambient-glow {
    background: radial-gradient(circle at 30% 25%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.16) 0%, transparent 60%);
  }

  /* 右侧竖列极简悬浮 Dock（阶段跳转与全局BGM控制） */
  .switch-dock {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 6px;
    border-radius: 24px;
    background: rgba(10, 14, 22, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 36px rgba(0, 0, 0, 0.75);
  }
  .dock-btn {
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    color: rgba(255, 255, 255, 0.68);
    background: transparent;
    border: none;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    text-align: center;
    line-height: 1.2;
  }
  .dock-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }
  .dock-btn.active {
    color: var(--accent);
    background: var(--accent-dim);
    font-weight: 700;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .dock-sep {
    width: 22px;
    height: 1px;
    background: rgba(255, 255, 255, 0.18);
    margin: 2px 0;
  }

  /* 玻璃拟态主面板 */
  .ui-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .ui-panel-soft {
    background: var(--panel-glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
  }

  /* 现代游戏按钮 */
  .ui-btn-primary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 20px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 8px;
    color: var(--accent);
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  .ui-btn-primary:hover {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
    transform: translateY(-1px);
  }
  .ui-btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .ui-btn-ghost:hover {
    border-color: var(--accent);
    color: var(--text-main);
  }

  /* ① 大尺寸角色立绘展台（1:1复刻原版沉浸立绘，无多余空隙，与右侧等高自适应） */
  .portrait-podium {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 540px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    border-radius: 14px;
    padding: 16px 18px;
    background: radial-gradient(circle at 50% 55%, var(--accent-dim) 0%, transparent 70%), var(--panel-bg);
    border: 1px solid var(--panel-border);
  }
  .portrait-wrapper {
    position: relative;
    flex: 1 1 0;
    height: 0;
    min-height: 310px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
    margin: 2px 0;
  }
  .portrait-img {
    height: 100%;
    max-height: 100%;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.88));
    -webkit-mask-image: linear-gradient(to bottom, black 88%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 88%, transparent 100%);
    transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    transform: scale(1.08);
    transform-origin: center center;
  }
  .portrait-img.hero-swap-in {
    animation: hero-swap 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes hero-swap {
    0% { opacity: 0; transform: scale(0.96) translateY(12px); filter: brightness(1.3) blur(4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) blur(0); }
  }

  /* 语音跳动声波 */
  .voice-wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 16px;
  }
  .voice-bar {
    width: 2.5px;
    height: 100%;
    background-color: var(--accent);
    border-radius: 2px;
    animation: wave-bar 0.8s ease-in-out infinite alternate;
  }
  .voice-bar:nth-child(1) { animation-delay: 0.1s; height: 35%; }
  .voice-bar:nth-child(2) { animation-delay: 0.3s; height: 75%; }
  .voice-bar:nth-child(3) { animation-delay: 0.15s; height: 100%; }
  .voice-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
  .voice-bar:nth-child(5) { animation-delay: 0.25s; height: 40%; }
  @keyframes wave-bar {
    0% { transform: scaleY(0.25); }
    100% { transform: scaleY(1); }
  }
  .voice-wave.paused .voice-bar {
    animation-play-state: paused;
    transform: scaleY(0.3);
  }

  /* ② 现代过渡动效：技能插槽阶梯式滑入（尺寸收缩紧凑） */
  .skill-slot-chip {
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    animation: slot-slide-in 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--slot-idx, 0) * 0.04s);
  }
  @keyframes slot-slide-in {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .skill-slot-chip:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 3px;
    background: var(--slot-border);
    transition: background 0.25s ease;
  }
  .skill-slot-chip.type-limited:before { background: var(--badge-limited); }
  .skill-slot-chip.type-generic:before { background: var(--badge-generic); }
  .skill-slot-chip.is-reaction:before { background: var(--badge-reaction); }

  .skill-slot-chip:hover {
    border-color: var(--panel-border-bright);
    box-shadow: var(--slot-glow);
    background: var(--card-hover);
    transform: translateX(2px);
  }

  /* ③ 职业介绍卡片与悬浮 GIF 块 */
  .class-tab-card {
    background: var(--panel-glass);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: visible;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .class-tab-card:hover {
    border-color: var(--panel-border-bright);
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  .class-tab-card.active {
    border-color: var(--accent);
    background: linear-gradient(150deg, var(--card-hover), var(--accent-dim));
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .class-tab-card.active:before {
    content: '';
    position: absolute;
    top: -1px;
    left: 8px;
    right: 8px;
    height: 2.5px;
    border-radius: 9999px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* ③ 纯净实机战斗 GIF 悬浮块：无多余装饰，四周边缘柔和渐变模糊羽化 */
  .class-hover-gif-box {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%) translateY(8px) scale(0.95);
    width: 140px;
    height: 140px;
    pointer-events: none;
    opacity: 0;
    z-index: 999;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0.85) 65%, rgba(0,0,0,0) 96%);
    mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 45%, rgba(0,0,0,0.85) 65%, rgba(0,0,0,0) 96%);
    filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.95));
    background: transparent;
  }
  .class-tab-card:hover .class-hover-gif-box {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .class-hover-gif-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    display: block;
  }

  /* 技能备选卡片（购点） */
  .skill-pick-card {
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .skill-pick-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--slot-glow);
  }
  .skill-pick-card.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .skill-pick-card.selected:after {
    content: 'EQUIPPED';
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: rgba(0, 0, 0, 0.7);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--accent);
    pointer-events: none;
  }

  /* 台词字幕气泡（固定高度 68px，多行自适应垂直居中，防抖防挤压） */
  .dialogue-bubble {
    background: rgba(10, 14, 22, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
    width: 100%;
    height: 68px;
    min-height: 68px;
    max-height: 68px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    animation: dialogue-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  #hero-dialogue-quote {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.42;
  }
  @keyframes dialogue-in {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* 能量点数条 */
  .energy-meter {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    overflow: hidden;
  }
  .energy-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #fff);
    border-radius: 9999px;
    box-shadow: 0 0 10px var(--accent);
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 跨阶段电影级柔和转场动效 (250ms 淡出 + 300ms 淡入) */
  .stage-fade-out {
    opacity: 0 !important;
    transform: translateY(-8px) scale(0.995) !important;
    transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    pointer-events: none;
  }
  .stage-fade-in {
    opacity: 1 !important;
    transform: translateY(0) scale(1) !important;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }

  /* 插槽增量插入轻柔弹入动效 */
  .slot-chip-pop {
    animation: slot-pop 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes slot-pop {
    0% { opacity: 0; transform: scale(0.94) translateY(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* 局部文字与属性平滑过渡 */
  .smooth-fade-transition {
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  /* 全局进场微动效 */
  .view-transition-in {
    animation: view-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes view-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="theme-arcane">

<div id="ambient-glow"></div>

<!-- 右侧竖列极简悬浮胶囊（阶段跳转与全局BGM控制） -->
<div class="switch-dock">
  <button class="dock-btn active" data-stage-jump="c1">威廉</button>
  <button class="dock-btn" data-stage-jump="c2">冯</button>
  <button class="dock-btn" data-stage-jump="c3class">主角</button>
  <button class="dock-btn" data-stage-jump="c3skill">技能</button>
  <div class="dock-sep"></div>
  <!-- 全局 BGM 开关按钮 -->
  <button id="bgm-toggle-btn" class="dock-btn" onclick="window.demoActions.toggleBgm()" title="切换背景音乐">
    <span id="bgm-icon">🎵</span>
    <span id="bgm-label" class="text-[0.58rem] mt-0.5">BGM</span>
  </button>
</div>

<!-- 主界面容器（紧凑居中适配，消除外部大面积空白） -->
<div id="demo-app" class="relative z-10 max-w-[1240px] mx-auto px-4 sm:px-8 py-3 min-h-screen flex flex-col justify-center">
  <!-- 动态挂载区 -->
</div>

<!-- 底层战斗数据源（单一样式来源，完全沿用原项目） -->

  /* 状态管理 */
  const state = {
    stage: 'c1', // c1, c2, c3class, c3skill

    hero3: {
      name: '亚瑟·格雷',

      skills: ['跟腱切割', '追风射击'], // 已购通用技能（1+2=3点，不超过4点预算）

    bgmPlaying: true,
    currentAudioHero: null,

  /* 解析 combat-data YAML */
  let COMBAT_DATA = { classes: {}, genericPool: [] };
  function parseCombatBlock() {
    const raw = document.getElementById('combat-data').textContent;
    const blocks = raw.split(/- 角色:/);
    blocks.shift();
    blocks.forEach(b => {
      const nameMatch = b.match(/名字:\s*"([^"]+)"/);
      const attrMatch = b.match(/属性:\s*"([^"]+)"/);
      if (!nameMatch || !attrMatch) return;
      const clsName = nameMatch[1];
      const attrStr = attrMatch[1];

      const hpMatch = attrStr.match(/HP:(\d+)\/(\d+)/);
      const mpMatch = attrStr.match(/MP:(\d+)\/(\d+)/);
      const atkMatch = attrStr.match(/Atk:(\d+)/);
      const armMatch = attrStr.match(/Armor:(\d+)/);
      const spdMatch = attrStr.match(/Speed:(\d+)/);

      const skillSectionMatch = b.match(/技能:\s*([\s\S]*?)(?=物品:|$)/);
      const skillLines = skillSectionMatch ? (skillSectionMatch[1].match(/- "【[^"]+"/g) || []) : [];
      const skills = skillLines.map(sl => {
        const text = sl.replace(/^- "/, '').replace(/"$/, '');
        const nameM = text.match(/【([^】]+)】/);
        const name = nameM ? nameM[1] : '';
        const scope = text.includes('[限定]') ? '限定' : '通用';
        const costM = text.match(/\[价:(\d+)\]/);
        const shopCost = costM ? parseInt(costM[1], 10) : 1;
        const mpM = text.match(/\[MP:(\d+)\]/i);
        const hpM = text.match(/\[HP:(\d+)\]/i);
        const tpM = text.match(/\[TP:(\d+)\]/i);
        const powerM = text.match(/power:(-?\d+)/i);
        const isReaction = text.includes('[反应') || text.includes('[舍身') || text.includes('[看破');
        const isMelee = text.includes('[近战]');
        const isRanged = text.includes('[远程]');
        const isSpell = text.includes('[法术]');
        let typeTag = '战术';
        if (isSpell) typeTag = '法术';
        else if (isMelee) typeTag = '近战';
        else if (isRanged) typeTag = '远程';
        else if (isReaction) typeTag = '反应';

        return {
          name,
          rawText: text,
          scope,
          shopCost,
          mpCost: mpM ? mpM[1] : null,
          hpCost: hpM ? hpM[1] : null,
          tpCost: tpM ? tpM[1] : null,
          power: powerM ? powerM[1] : null,
          typeTag,
          isReaction,
          srcClass: clsName
        };
      });

      COMBAT_DATA.classes[clsName] = {
        name: clsName,
        hp: hpMatch ? hpMatch[2] : '100',
        mp: mpMatch ? mpMatch[2] : '40',
        atk: atkMatch ? atkMatch[1] : '10',
        armor: armMatch ? armMatch[1] : '3',
        speed: spdMatch ? spdMatch[1] : '100',
        skills: skills
      };

      skills.filter(s => s.scope === '通用').forEach(s => {
        COMBAT_DATA.genericPool.push(s);
      });
    });
  }

  /* 音频控制器：BGM 与 角色语音 */
  const voiceAudio = new Audio();
  voiceAudio.preload = 'auto';

  const bgmAudio = new Audio();

  bgmAudio.loop = true;
  bgmAudio.volume = 0.35;

  function initBgm() {
    bgmAudio.play().then(() => {
      state.bgmPlaying = true;
      updateBgmUi();
    }).catch(() => {
      state.bgmPlaying = false;
      updateBgmUi();
    });
  }

  function toggleBgm() {
    if (bgmAudio.paused) {
      bgmAudio.play().then(() => {
        state.bgmPlaying = true;
        updateBgmUi();
      }).catch(() => {});
    } else {
      bgmAudio.pause();
      state.bgmPlaying = false;
      updateBgmUi();
    }
  }

  function updateBgmUi() {
    const lbl = document.getElementById('bgm-label');
    const ico = document.getElementById('bgm-icon');
    const btn = document.getElementById('bgm-toggle-btn');
    if (!lbl || !ico || !btn) return;
    if (state.bgmPlaying) {
      lbl.textContent = 'BGM';
      ico.textContent = '🎵';
      btn.classList.add('active');
    } else {
      lbl.textContent = '静音';
      ico.textContent = '🔇';
      btn.classList.remove('active');
    }
  }

  /* 播放当前角色的当前职业语音 */
  function playHeroCurrentVoice(heroKey) {
    if (state.audioMuted) return;
    const hero = DEMO_CONFIG.party[heroKey];
    if (!hero) return;

    const currentClass = heroKey === 'hero1' ? state.hero1Class : state.hero2Class;
    const voiceItem = hero.classVoiceMap[currentClass];
    if (!voiceItem || !voiceItem.audioUrl) return;

    state.currentAudioHero = heroKey;
    voiceAudio.src = voiceItem.audioUrl;
    voiceAudio.play().then(() => {
      state.audioPlaying = true;
      updateVoiceWave(true);
    }).catch(() => {
      state.audioPlaying = false;
      updateVoiceWave(false);
    });
  }

  voiceAudio.onended = () => {
    state.audioPlaying = false;
    updateVoiceWave(false);
  };
  voiceAudio.onpause = () => {
    state.audioPlaying = false;
    updateVoiceWave(false);
  };

  function updateVoiceWave(playing) {
    const waves = document.querySelectorAll('.voice-wave');
    waves.forEach(w => {
      if (playing) w.classList.remove('paused');
      else w.classList.add('paused');
    });
  }

  /* 通用技能装配与购点计算 */
  function genericSkillUsed() {
    return state.hero3.skills.reduce((sum, name) => {
      const found = COMBAT_DATA.genericPool.find(s => s.name === name);
      return sum + (found ? found.shopCost : 1);
    }, 0);
  }

  /* 增量刷新：仅更新插槽面板、能量条与卡片高亮，不触发整页重绘 */
  function incrementalUpdateC3Skill(skillName, isAdded) {
    const slotsGrid = document.getElementById('c3-equipped-slots-grid');
    if (!slotsGrid) {
      renderStage(false);
      return;
    }

    // 1. 增量重绘 6 槽插槽面板（新装配项带 slot-chip-pop 动效）
    slotsGrid.innerHTML = renderC3SlotsHtml(isAdded ? skillName : null);

    // 2. 增量更新剩余点数与能量进度条
    const usedPoints = genericSkillUsed();
    const maxPoints = DEMO_CONFIG.shop.skillPoints;
    const remainPoints = maxPoints - usedPoints;
    const pct = Math.min(100, Math.round((usedPoints / maxPoints) * 100));

    const remainEl = document.getElementById('c3-remain-points');
    if (remainEl) {
      remainEl.textContent = `${remainPoints} / ${maxPoints} 点`;
      if (remainPoints === 0) {
        remainEl.className = 'font-bold text-amber-400';
      } else {
        remainEl.className = 'font-bold text-[var(--accent)]';
      }
    }

    const energyFill = document.getElementById('c3-energy-fill');
    if (energyFill) {
      energyFill.style.width = pct + '%';
    }

    // 3. 增量更新被点击卡片的选中高亮态
    const cardEl = document.querySelector(`[data-skill-card="${skillName}"]`);
    if (cardEl) {
      cardEl.classList.toggle('selected', isAdded);
    }

    // 4. 增量更新底部装配计数

    const idx = state.hero3.skills.indexOf(skillName);
    let isAdded = false;
    if (idx >= 0) {
      state.hero3.skills.splice(idx, 1);
    } else {
      if (state.hero3.skills.length >= 3) {
        showFlashToast('通用技能槽位已满（最多装配 3 个）');
        return;
      }
      const skill = COMBAT_DATA.genericPool.find(s => s.name === skillName);
      const cost = skill ? skill.shopCost : 1;
      if (genericSkillUsed() + cost > DEMO_CONFIG.shop.skillPoints) {
        showFlashToast('通用技能点数不足（上限 ' + DEMO_CONFIG.shop.skillPoints + ' 点）');
        return;
      }
      state.hero3.skills.push(skillName);
      isAdded = true;
    }
    // 纯增量更新：绝不触发整页 DOM 重绘，消除生硬刷新
    incrementalUpdateC3Skill(skillName, isAdded);
  }

  function getPillColorStyle(text) {
    if (text.includes('伤害') || text.includes('穿透') || text.includes('枪击') || text.includes('霰弹') || text.includes('光')) {
      return 'bg-rose-950/40 text-rose-300/90 border-rose-800/40';
    }
    if (text.includes('回复') || text.includes('回蓝') || text.includes('充能') || text.includes('净化') || text.includes('抽取') || text.includes('驱散')) {
      return 'bg-emerald-950/40 text-emerald-300/90 border-emerald-800/40';
    }
    if (text.includes('护盾') || text.includes('加防') || text.includes('闪避') || text.includes('免伤') || text.includes('回避') || text.includes('舍身') || text.includes('肃正')) {
      return 'bg-sky-950/40 text-sky-300/90 border-sky-800/40';
    }
    if (text.includes('降防') || text.includes('降攻') || text.includes('延迟') || text.includes('缓速') || text.includes('致盲') || text.includes('中毒') || text.includes('燃烧') || text.includes('麻痹') || text.includes('眩晕') || text.includes('自盲') || text.includes('滞')) {
      return 'bg-purple-950/40 text-purple-300/90 border-purple-800/40';
    }
    if (text.includes('持续') || text.includes('命中') || text.includes('加速') || text.includes('增攻') || text.includes('瞄准') || text.includes('暴击') || text.includes('必中') || text.includes('转火') || text.includes('再动') || text.includes('高阶') || text.includes('传奇') || text.includes('召唤')) {
      return 'bg-amber-950/40 text-amber-300/80 border-amber-800/40';
    }
    if (text.includes('反应') || text.includes('看破')) {
      return 'bg-rose-950/50 text-rose-300/90 border-rose-700/40';
    }
    return 'bg-white/5 text-white/70 border-white/10';
  }

  function formatSkillEffectPills(rawText) {
    if (!rawText) return '';
    let clean = rawText.replace(/【[^】]+】/, '');
    // 彻底剥离重复后台前缀
    clean = clean.replace(/\[(限定|通用)\]/g, '');
    clean = clean.replace(/\[价:\d+\]/g, '');
    clean = clean.replace(/\[MP:\d+\]/g, '');
    clean = clean.replace(/\[HP:\d+\]/g, '');
    clean = clean.replace(/\[TP:\d+\]/g, '');
    clean = clean.replace(/\[特效:[^\]]+\]/g, '');

    const tagMatches = clean.match(/\[([^\]]+)\]/g) || [];
    if (tagMatches.length === 0) {
      return '<span class="text-[0.65rem] text-white/30 font-mono">无特殊效果</span>';
    }

    const pills = [];
    tagMatches.forEach(tagStr => {
      const inner = tagStr.slice(1, -1).trim();
      const parts = inner.split(/[;；]/);
      const mainPart = parts[0].trim();
      let powerVal = null;
      let extraTurns = null;
      parts.slice(1).forEach(p => {
        const pm = p.match(/power:(-?\d+)/i);
        if (pm) powerVal = pm[1];
        const tm = p.match(/turns:(\d+)/i);
        if (tm) extraTurns = tm[1];
      });

      let displayLabel = '';
      let displayVal = powerVal;

      if (/^持续[:：](\d+)/i.test(mainPart) || /^Turns[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^(?:持续|Turns)[:：](\d+)/i);
        displayLabel = '持续';
        displayVal = (m ? m[1] : '') + '回合';
      } else if (/^Aim[:：](\d+)/i.test(mainPart) || /^Hit[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^(?:Aim|Hit)[:：](\d+)/i);
        displayLabel = '命中';
        displayVal = (m ? m[1] : '') + '%';
      } else if (/^加速[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^加速[:：](\d+)/i);
        displayLabel = '加速';
        displayVal = '+' + (m ? m[1] : '');
      } else if (/^延迟[:：](\d+)/i.test(mainPart)) {
        const m = mainPart.match(/^延迟[:：](\d+)/i);
        displayLabel = '延迟';
        displayVal = (m ? m[1] : '') + '段';
      } else if (/^暴击[:：](\d+)%?/i.test(mainPart)) {
        const m = mainPart.match(/^暴击[:：](\d+)%?/i);
        displayLabel = '暴击';
        displayVal = (m ? m[1] : '') + '%';
      } else if (/^限(\d+)次/i.test(mainPart)) {
        const m = mainPart.match(/^限(\d+)次/i);
        displayLabel = '限用';
        displayVal = (m ? m[1] : '') + '次';
      } else if (/^反应(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^反应(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `⟲反应·${m[1]}` : '⟲反应';
      } else if (/^舍身(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^舍身(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `舍身·${m[1]}` : '舍身援护';
      } else if (/^看破(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^看破(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `看破·${m[1]}` : '战术看破';
      } else if (/^肃正(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^肃正(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `肃正·${m[1]}` : '绝对肃正';
      } else if (/^召唤(?::([^\]]+))?/i.test(mainPart)) {
        const m = mainPart.match(/^召唤(?::([^\]]+))?/i);
        displayLabel = m && m[1] ? `召唤·${m[1]}` : '战术召唤';
      } else if (/^单体\(([^)]+)\)/i.test(mainPart)) {
        const m = mainPart.match(/^单体\(([^)]+)\)/i);
        displayLabel = `单体(${m[1]})`;
      } else if (/^穿透\(([^)]+)\)/i.test(mainPart)) {
        const m = mainPart.match(/^穿透\(([^)]+)\)/i);
        displayLabel = `穿透(${m[1]})`;
      } else if (mainPart === '他人') {
        displayLabel = '友方目标';
      } else if (mainPart === '法术' || mainPart === '近战' || mainPart === '远程') {
        // 头部已标注伤害属性，效果行内无需重复
        return;
      } else if (/^(群驱散|驱散)(?::(\d+))?/i.test(mainPart)) {
        const m = mainPart.match(/^(群驱散|驱散)(?::(\d+))?/i);
        const isGroup = m[1].includes('群');
        displayLabel = isGroup ? '群体净化' : '单体净化';
        displayVal = m[2] ? m[2] + '层' : null;
      } else if (TAG_EXPAND_MAP[mainPart]) {
        displayLabel = TAG_EXPAND_MAP[mainPart];
      } else {
        displayLabel = mainPart;
      }

      if (extraTurns && displayVal != null) {
        displayVal += ` (${extraTurns}T)`;
      }

      const style = getPillColorStyle(displayLabel);
      pills.push(`
        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[0.64rem] font-mono border leading-none ${style}">
          <span>${displayLabel}</span>
          ${displayVal != null ? `<span class="font-bold opacity-90 font-mono">${displayVal}</span>` : ''}
        </span>
      `);
    });

    return pills.join('');
  }

  /* 核心路由渲染器 */
  function renderStage(shouldPlayVoice = true) {
    const appEl = document.getElementById('demo-app');
    if (!appEl) return;

    switch (state.stage) {
      case 'c1':
        appEl.innerHTML = viewC1();
        if (shouldPlayVoice) playHeroCurrentVoice('hero1');
        break;
      case 'c2':
        appEl.innerHTML = viewC2();
        if (shouldPlayVoice) playHeroCurrentVoice('hero2');
        break;
      case 'c3class':
        appEl.innerHTML = viewC3class();
        voiceAudio.pause();
        break;
      case 'c3skill':
        appEl.innerHTML = viewC3skill();
        voiceAudio.pause();
        break;
      default:
        appEl.innerHTML = viewC1();
        break;
    }
  }

  /* 职业切换：局部精准淡入淡出（立绘展台框架保持稳定不动） */
  function switchHeroClassLocally(heroKey, newClass) {
    const hero = DEMO_CONFIG.party[heroKey];
    if (!hero) return;

    if (heroKey === 'hero1') state.hero1Class = newClass;
    else state.hero2Class = newClass;

    const clsData = COMBAT_DATA.classes[newClass] || { hp: 100, mp: 40, atk: 12, armor: 3, speed: 100 };
    const voiceData = hero.classVoiceMap[newClass] || { quote: '', audioUrl: '' };

    // 1. 职业选项卡高亮增量切换
    document.querySelectorAll('[data-class-tab]').forEach(tab => {
      tab.classList.toggle('active', tab.getAttribute('data-class-tab') === newClass);
    });

    // 2. 左侧台词气泡平滑过渡
    const quoteEl = document.getElementById('hero-dialogue-quote');
    if (quoteEl) {
      quoteEl.style.opacity = '0';
      quoteEl.style.transform = 'translateY(4px)';
      setTimeout(() => {
        quoteEl.textContent = voiceData.quote;
        quoteEl.style.opacity = '1';
        quoteEl.style.transform = 'translateY(0)';
      }, 160);
    }

    // 3. 五维属性面板平滑更新
    const attrTitle = document.getElementById('hero-attr-profile-tag');
    if (attrTitle) attrTitle.textContent = `PROFILE // ${newClass}`;

    const attrs = [
      { id: 'hero-attr-hp', val: clsData.hp },
      { id: 'hero-attr-mp', val: clsData.mp },
      { id: 'hero-attr-atk', val: clsData.atk },
      { id: 'hero-attr-armor', val: clsData.armor },
      { id: 'hero-attr-speed', val: clsData.speed },
    ];
    attrs.forEach(({ id, val }) => {
      const el = document.getElementById(id);
      if (el) {
        el.style.opacity = '0.2';
        setTimeout(() => {
          el.textContent = val;
          el.style.opacity = '1';
        }, 120);
      }
    });

    // 4. 右侧 6 技能栏重新渲染并依次阶梯滑入
    const skillsContainer = document.getElementById('hero-skill-chips-container');
    if (skillsContainer) {
      skillsContainer.style.opacity = '0';
      skillsContainer.style.transform = 'translateY(6px)';
      setTimeout(() => {
        const sorted = getSortedHeroSkills(clsData.skills);
        skillsContainer.innerHTML = sorted.map((s, idx) => renderSkillSlotChip(s, false, idx + 1)).join('');
        skillsContainer.style.opacity = '1';
        skillsContainer.style.transform = 'translateY(0)';
      }, 150);
    }

    // 5. 播放专属台词音频与声波动画
    playHeroCurrentVoice(heroKey);
  }

  /* 跨阶段导航：柔和沉浸淡出淡入转场（250ms 淡出 + 300ms 淡入） */
  let isStageTransitioning = false;

  function gotoStageWithCrossfade(st) {
    if (isStageTransitioning) return;
    if (state.stage === st) return;

    const appEl = document.getElementById('demo-app');
    if (!appEl) {
      state.stage = st;
      renderStage(true);
      return;
    }

    isStageTransitioning = true;

    // 1. 触发柔和淡出 (250ms)
    appEl.classList.remove('stage-fade-in');
    appEl.classList.add('stage-fade-out');

    setTimeout(() => {
      // 2. 淡出完成时切换阶段与专属主题
      state.stage = st;
      if (st === 'c2') {
        document.body.className = 'theme-gilded';
      } else {
        document.body.className = 'theme-arcane';
      }

      // 同步顶部 dock 激活态
      document.querySelectorAll('[data-stage-jump]').forEach(btn => {
        if (btn.getAttribute('data-stage-jump') === st) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      // 渲染目标阶段 DOM
      renderStage(true);

      // 3. 触发平滑淡入 (300ms)
      appEl.classList.remove('stage-fade-out');
      appEl.classList.add('stage-fade-in');

      setTimeout(() => {
        appEl.classList.remove('stage-fade-in');
        isStageTransitioning = false;
      }, 300);
    }, 250);
  }

  /* 挂载到 window 供页面交互调用 */
  window.demoActions = {
    pickClass1: (cls) => {
      switchHeroClassLocally('hero1', cls);
    },
    pickClass2: (cls) => {
      switchHeroClassLocally('hero2', cls);
    },
    pickClass3: (cls) => {
      state.hero3.classType = cls;
      document.querySelectorAll('.class-tab-card').forEach(tab => {
        tab.classList.toggle('active', tab.innerText.includes(cls));
      });
      const clsObj = COMBAT_DATA.classes[cls];
      const limitedSkills = clsObj ? clsObj.skills.filter(s => s.scope === '限定') : [];
      const limitedContainer = document.querySelector('.ui-panel-soft .flex-col');
      if (limitedContainer) {
        limitedContainer.style.opacity = '0';
        setTimeout(() => {
          limitedContainer.innerHTML = limitedSkills.map((s, idx) => renderSkillSlotChip(s, false, idx + 1)).join('');
          limitedContainer.style.opacity = '1';
        }, 120);
      }
    },
    toggleSkill: (skillName) => {
      toggleGenericSkill(skillName);
    },
    removeSkill: (skillName) => {
      toggleGenericSkill(skillName);
    },
    gotoStage: (st) => {
      gotoStageWithCrossfade(st);
    },
    playVoice: (heroId) => {
      playHeroCurrentVoice(heroId);
    },
    toggleBgm: () => {
      toggleBgm();
    }
  };

  /* 快捷跳转监听 */
  function initDockEvents() {
    document.querySelectorAll('[data-stage-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const stage = btn.getAttribute('data-stage-jump');
        window.demoActions.gotoStage(stage);
      });
    });
  }

  /* 初始化启动 */
  parseCombatBlock();
  initDockEvents();
  // 默认启动进入威廉阶段，绑定密教金辉主题
  document.body.className = 'theme-arcane';
  renderStage(true);
  initBgm();

})();
</script>
</body>
</html>
