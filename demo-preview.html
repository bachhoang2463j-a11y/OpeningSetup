<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 默认：方案一 · 密教暗曜 (Noir Arcane) */
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;
    
    --bg-base: #0a0d13;
    --panel-bg: rgba(13, 17, 24, 0.72);
    --panel-glass: rgba(17, 23, 33, 0.55);
    --panel-border: rgba(198, 161, 84, 0.28);
    --panel-border-bright: rgba(224, 185, 102, 0.85);
    --accent: #d9b45c;
    --accent-glow: rgba(217, 180, 92, 0.35);
    --accent-dim: rgba(198, 161, 84, 0.15);
    --text-main: #f0e6d2;
    --text-muted: rgba(232, 220, 192, 0.65);
    --slot-bg: rgba(9, 12, 18, 0.8);
    --slot-border: rgba(198, 161, 84, 0.25);
    --slot-glow: 0 0 15px rgba(217, 180, 92, 0.2);
    --badge-limited: rgba(217, 180, 92, 0.95);
    --badge-generic: rgba(120, 200, 150, 0.95);
    --badge-reaction: rgba(235, 110, 110, 0.95);
    --card-hover: rgba(26, 34, 48, 0.7);
    --btn-bg: linear-gradient(135deg, rgba(198, 161, 84, 0.22), rgba(198, 161, 84, 0.06));
    --btn-border: rgba(198, 161, 84, 0.5);
  }

  /* 方案二 · 战术全息 (Tactical Holo) */
  body.theme-tactical {
    --font-serif: 'Rajdhani', 'Noto Serif SC', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Rajdhani', sans-serif;

    --bg-base: #060b12;
    --panel-bg: rgba(8, 16, 26, 0.78);
    --panel-glass: rgba(12, 24, 38, 0.6);
    --panel-border: rgba(64, 180, 229, 0.3);
    --panel-border-bright: rgba(80, 215, 255, 0.9);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.45);
    --accent-dim: rgba(56, 189, 248, 0.14);
    --text-main: #e0f2fe;
    --text-muted: rgba(186, 230, 253, 0.65);
    --slot-bg: rgba(6, 14, 24, 0.85);
    --slot-border: rgba(56, 189, 248, 0.25);
    --slot-glow: 0 0 18px rgba(56, 189, 248, 0.28);
    --badge-limited: rgba(56, 189, 248, 0.95);
    --badge-generic: rgba(52, 211, 153, 0.95);
    --badge-reaction: rgba(251, 113, 133, 0.95);
    --card-hover: rgba(14, 34, 52, 0.75);
    --btn-bg: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(56, 189, 248, 0.05));
    --btn-border: rgba(56, 189, 248, 0.6);
  }

  /* 方案三 · 琉璃金辉 (Gilded Crystal) */
  body.theme-gilded {
    --font-serif: 'Noto Serif SC', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-display: 'Cinzel', serif;

    --bg-base: #110c1c;
    --panel-bg: rgba(22, 15, 36, 0.75);
    --panel-glass: rgba(30, 20, 50, 0.58);
    --panel-border: rgba(236, 195, 110, 0.35);
    --panel-border-bright: rgba(255, 222, 145, 0.95);
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.45);
    --accent-dim: rgba(192, 132, 252, 0.16);
    --text-main: #fdf4ff;
    --text-muted: rgba(243, 232, 255, 0.65);
    --slot-bg: rgba(18, 11, 30, 0.85);
    --slot-border: rgba(216, 180, 254, 0.3);
    --slot-glow: 0 0 20px rgba(192, 132, 252, 0.3);
    --badge-limited: rgba(245, 158, 11, 0.95);
    --badge-generic: rgba(192, 132, 252, 0.95);
    --badge-reaction: rgba(244, 63, 94, 0.95);
    --card-hover: rgba(45, 28, 72, 0.75);
    --btn-bg: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(192, 132, 252, 0.15));
    --btn-border: rgba(245, 158, 11, 0.6);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-serif);
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* 背景氛围 */
  #ambient-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 20% 30%, rgba(217, 180, 92, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.05) 0%, transparent 60%);
    transition: all 0.5s ease;
  }
  body.theme-tactical #ambient-glow {
    background: radial-gradient(circle at 25% 35%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 75% 75%, rgba(30, 58, 138, 0.2) 0%, transparent 60%);
  }
  body.theme-gilded #ambient-glow {
    background: radial-gradient(circle at 30% 25%, rgba(245, 158, 11, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(147, 51, 234, 0.15) 0%, transparent 60%);
  }

  /* 顶部极简无感切换胶囊 */
  .switch-dock {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 9999px;
    background: rgba(10, 14, 22, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }
  .dock-btn {
    font-size: 0.75rem;
    padding: 4px 12px;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.25s ease;
    color: rgba(255, 255, 255, 0.65);
    background: transparent;
    border: none;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }
  .dock-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }
  .dock-btn.active {
    color: var(--accent);
    background: var(--accent-dim);
    font-weight: 700;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .dock-sep {
    width: 1px;
    height: 14px;
    background: rgba(255, 255, 255, 0.15);
  }

  /* 玻璃拟态面板 */
  .ui-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .ui-panel-soft {
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
  }

  /* 现代游戏按钮 */
  .ui-btn-primary {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 24px;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    border-radius: 6px;
    color: var(--accent);
    font-family: var(--font-serif);
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }
  .ui-btn-primary:hover {
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
    transform: translateY(-1px);
  }
  .ui-btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .ui-btn-ghost:hover {
    border-color: var(--accent);
    color: var(--text-main);
  }

  /* 角色立绘展台 */
  .portrait-podium {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    overflow: hidden;
    border-radius: 12px;
  }
  .portrait-img {
    max-height: 380px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.8));
    animation: float-hero 6s ease-in-out infinite alternate;
    -webkit-mask-image: linear-gradient(to bottom, black 72%, transparent 98%);
    mask-image: linear-gradient(to bottom, black 72%, transparent 98%);
    transition: all 0.5s ease;
  }
  @keyframes float-hero {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-8px) scale(1.015); }
  }

  /* 语音声波跳动条 */
  .voice-wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 18px;
  }
  .voice-bar {
    width: 3px;
    height: 100%;
    background-color: var(--accent);
    border-radius: 2px;
    animation: wave-bar 0.8s ease-in-out infinite alternate;
  }
  .voice-bar:nth-child(1) { animation-delay: 0.1s; height: 35%; }
  .voice-bar:nth-child(2) { animation-delay: 0.3s; height: 75%; }
  .voice-bar:nth-child(3) { animation-delay: 0.15s; height: 100%; }
  .voice-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
  .voice-bar:nth-child(5) { animation-delay: 0.25s; height: 40%; }
  @keyframes wave-bar {
    0% { transform: scaleY(0.25); }
    100% { transform: scaleY(1); }
  }
  .voice-wave.paused .voice-bar {
    animation-play-state: paused;
    transform: scaleY(0.3);
  }

  /* 现代插槽装配式技能卡 (Slot) */
  .skill-slot-chip {
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .skill-slot-chip:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 3px;
    background: var(--slot-border);
    transition: background 0.3s ease;
  }
  .skill-slot-chip.type-limited:before { background: var(--badge-limited); }
  .skill-slot-chip.type-generic:before { background: var(--badge-generic); }
  .skill-slot-chip.is-reaction:before { background: var(--badge-reaction); }

  .skill-slot-chip:hover {
    border-color: var(--panel-border-bright);
    box-shadow: var(--slot-glow);
    background: var(--card-hover);
    transform: translateX(2px);
  }

  /* 技能备选卡片（用于购点） */
  .skill-pick-card {
    background: var(--slot-bg);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .skill-pick-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--slot-glow);
  }
  .skill-pick-card.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .skill-pick-card.selected:after {
    content: 'EQUIPPED';
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: var(--font-mono);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: rgba(0, 0, 0, 0.7);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--accent);
    pointer-events: none;
  }

  /* 职业切换卡片 */
  .class-tab-card {
    background: var(--panel-glass);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .class-tab-card:hover {
    border-color: var(--panel-border-bright);
    background: var(--card-hover);
  }
  .class-tab-card.active {
    border-color: var(--accent);
    background: linear-gradient(145deg, var(--card-hover), var(--accent-dim));
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .class-tab-card.active:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* 能量点数条 */
  .energy-meter {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    overflow: hidden;
    position: relative;
  }
  .energy-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #fff);
    border-radius: 9999px;
    box-shadow: 0 0 10px var(--accent);
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 台词字幕浮字 */
  .dialogue-bubble {
    background: rgba(10, 14, 22, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    width: 100%;
  }

  /* 动画进场 */
  .slide-fade-in {
    animation: slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

(function() {

  const DEMO_CONFIG = {

      '隐匿者': { intro: '雾是同谋，影子是证件。低仇恨开场，远程伤害随隐匿值加深，近战命中可能触发暗袭眩晕。', passive: '低仇恨 · 隐匿加成 · 暗袭眩晕', role: '敏捷 / 刺客' },
      '狂战士': { intro: '以伤换势的疯子。损血越多攻越高，濒死时攻击穿透并附加重伤；每场一次靠毅力留存。', passive: '损血增攻 · 濒死穿透 · 毅力留存', role: '强攻 / 绝地' },
      '防守者': { intro: '移动的街垒。天生高仇恨把火力揽在自己身上，受致命伤每场一次强制留存 1 HP。', passive: '高仇恨嘲讽 · 致命留存 · 受击反打', role: '防御 / 坚壁' },
      '风行者': { intro: '快得让子弹落空。闪避随 TP 水涨船高，施法有概率触发多重施法；回避致命。', passive: '闪避成长 · 多重施法 · 回避致命', role: '极速 / 连击' },
      '施法者': { intro: '把法力变成第二层皮肤。开场自带相当于半数法力的护盾，每次耗蓝都可能转化为加速。', passive: '开场护盾 · 法力回响', role: '爆发 / 护盾' },
      '圣职者': { intro: '队伍的良心与底线。治疗与祝福为团队托底，爆发激活时另有专属支援逻辑。', passive: '强治疗 · 团队祝福 · 支援爆发', role: '支援 / 圣佑' },
      '灾厄使': { intro: '灾祸随身而行。目标每带一个减益，受到的伤害就多一成，出手还会附加剧毒。', passive: '减益增伤 · 附带剧毒', role: '减益 / 持续伤害' },
    },
    shop: {
      skillPoints: 4,
    }
  };

  /* 状态管理 */
  const state = {
    stage: 'c1', // c1, c2, c3class, c3skill
    hero1Class: '隐匿者',
    hero2Class: '施法者',
    hero3: {
      name: '亚瑟·格雷',
      classType: '风行者',
      skills: ['影缝闪避', '疾风之势'], // 已购通用技能（2+1=3点）
    },
    audioPlaying: false,
    audioMuted: false,
    currentAudioHero: null,
  };

  /* 解析 combat-data YAML */
  let COMBAT_DATA = { classes: {}, genericPool: [] };
  function parseCombatBlock() {
    const raw = document.getElementById('combat-data').textContent;
    const blocks = raw.split(/- 角色:/);
    blocks.shift();
    blocks.forEach(b => {
      const nameMatch = b.match(/名字:\s*"([^"]+)"/);
      const attrMatch = b.match(/属性:\s*"([^"]+)"/);
      if (!nameMatch || !attrMatch) return;
      const clsName = nameMatch[1];
      const attrStr = attrMatch[1];

      const hpMatch = attrStr.match(/HP:(\d+)\/(\d+)/);
      const mpMatch = attrStr.match(/MP:(\d+)\/(\d+)/);
      const atkMatch = attrStr.match(/Atk:(\d+)/);
      const armMatch = attrStr.match(/Armor:(\d+)/);
      const spdMatch = attrStr.match(/Speed:(\d+)/);

      const skillLines = b.match(/- "【[^"]+"/g) || [];
      const skills = skillLines.map(sl => {
        const text = sl.replace(/^- "/, '').replace(/"$/, '');
        const nameM = text.match(/【([^】]+)】/);
        const name = nameM ? nameM[1] : '';
        const scope = text.includes('[限定]') ? '限定' : '通用';
        const costM = text.match(/\[价:(\d+)\]/);
        const shopCost = costM ? parseInt(costM[1], 10) : 1;
        const mpM = text.match(/\[MP:(\d+)\]/);
        const hpM = text.match(/\[HP:(\d+)\]/);
        const powerM = text.match(/power:(\d+)/);
        const isReaction = text.includes('[反应');
        const isMelee = text.includes('[近战]');
        const isRanged = text.includes('[远程]');
        const isSpell = text.includes('[法术]');
        let typeTag = '战术';
        if (isMelee) typeTag = '近战';
        else if (isRanged) typeTag = '远程';
        else if (isSpell) typeTag = '法术';
        else if (isReaction) typeTag = '反应';

        return {
          name,
          rawText: text,
          scope,
          shopCost,
          mpCost: mpM ? mpM[1] : null,
          hpCost: hpM ? hpM[1] : null,
          power: powerM ? powerM[1] : null,
          typeTag,
          isReaction,
          srcClass: clsName
        };
      });

      COMBAT_DATA.classes[clsName] = {
        name: clsName,
        hp: hpMatch ? hpMatch[2] : '100',
        mp: mpMatch ? mpMatch[2] : '40',
        atk: atkMatch ? atkMatch[1] : '10',
        armor: armMatch ? armMatch[1] : '3',
        speed: spdMatch ? spdMatch[1] : '100',
        skills: skills
      };

      skills.filter(s => s.scope === '通用').forEach(s => {
        COMBAT_DATA.genericPool.push(s);
      });
    });
  }

  /* 音频控制器 */
  const audioEl = new Audio();
  audioEl.preload = 'auto';

  function playHeroVoice(heroKey) {
    if (state.audioMuted) return;
    const hero = DEMO_CONFIG.party[heroKey];
    if (!hero || !hero.audioUrl) return;

    state.currentAudioHero = heroKey;
    audioEl.src = hero.audioUrl;
    audioEl.play().then(() => {
      state.audioPlaying = true;
      updateVoiceWave(true);
    }).catch(() => {
      state.audioPlaying = false;
      updateVoiceWave(false);
    });
  }

  audioEl.onended = () => {
    state.audioPlaying = false;
    updateVoiceWave(false);
  };
  audioEl.onpause = () => {
    state.audioPlaying = false;
    updateVoiceWave(false);
  };

  function updateVoiceWave(playing) {
    const waves = document.querySelectorAll('.voice-wave');
    waves.forEach(w => {
      if (playing) w.classList.remove('paused');
      else w.classList.add('paused');
    });
  }

  /* 通用技能装配与购点计算 */
  function genericSkillUsed() {
    return state.hero3.skills.reduce((sum, name) => {
      const found = COMBAT_DATA.genericPool.find(s => s.name === name);
      return sum + (found ? found.shopCost : 1);
    }, 0);
  }

  function toggleGenericSkill(skillName) {
    const idx = state.hero3.skills.indexOf(skillName);
    if (idx >= 0) {
      state.hero3.skills.splice(idx, 1);
    } else {
      if (state.hero3.skills.length >= 3) {
        showFlashToast('通用技能槽位已满（最多装配 3 个）');
        return;
      }
      const skill = COMBAT_DATA.genericPool.find(s => s.name === skillName);
      const cost = skill ? skill.shopCost : 1;
      if (genericSkillUsed() + cost > DEMO_CONFIG.shop.skillPoints) {
        showFlashToast('通用技能点数不足（上限 ' + DEMO_CONFIG.shop.skillPoints + ' 点）');
        return;
      }
      state.hero3.skills.push(skillName);
    }
    renderStage();
  }

  function showFlashToast(msg) {
    let t = document.getElementById('flash-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'flash-toast';
      t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:99999;padding:10px 22px;background:rgba(235,87,87,0.95);color:#fff;border-radius:8px;font-size:0.88rem;box-shadow:0 8px 24px rgba(0,0,0,0.5);letter-spacing:0.08em;transition:all 0.3s ease;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(10px)';
    }, 2200);
  }

  /* 渲染：技能芯片卡片 (Slot) */
  function renderSkillSlotChip(s, isSlotEmpty = false, slotIdx = 0, canRemove = false) {
    if (isSlotEmpty) {
      return `
        <div class="skill-slot-chip border-dashed border-opacity-40" style="border-color:var(--slot-border); background:rgba(0,0,0,0.3);">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded bg-white/5 flex items-center justify-center font-mono text-xs text-white/40">0${slotIdx}</span>
            <span class="text-xs tracking-wider text-white/35">空置通用插槽 · 待购点装配</span>
          </div>
          <span class="font-mono text-[0.68rem] text-white/30">[SLOT OPEN]</span>
        </div>
      `;
    }

    const typeBadgeClass = s.scope === '限定' ? 'text-[var(--badge-limited)]' : 'text-[var(--badge-generic)]';
    const costText = s.mpCost ? `${s.mpCost} MP` : (s.hpCost ? `${s.hpCost} HP` : '无消耗');

    return `
      <div class="skill-slot-chip ${s.scope === '限定' ? 'type-limited' : 'type-generic'} ${s.isReaction ? 'is-reaction' : ''}">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-8 h-8 rounded bg-black/40 border border-white/10 flex items-center justify-center shrink-0">
            <span class="font-mono text-xs font-bold ${typeBadgeClass}">${s.scope === '限定' ? 'EX' : 'TAC'}</span>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold tracking-wider text-[var(--text-main)] truncate">${s.name}</span>
              ${s.isReaction ? '<span class="text-[0.62rem] px-1.5 py-0.5 rounded bg-rose-950/70 border border-rose-600/50 text-rose-300 font-mono">⟲反应</span>' : ''}
              <span class="text-[0.65rem] px-1.5 py-0.2 rounded bg-white/5 text-white/60 font-mono">${s.typeTag}</span>
            </div>
            <div class="text-[0.7rem] text-[var(--text-muted)] font-mono mt-0.5 truncate">${s.rawText.replace(/【[^】]+】/, '')}</div>
          </div>
        </div>

        <div class="flex items-center gap-3 shrink-0">
          <div class="text-right">
            <div class="font-mono text-xs font-bold text-[var(--accent)]">${costText}</div>
            <div class="font-mono text-[0.65rem] text-white/40">${s.scope === '限定' ? '随职业' : s.shopCost + ' 点'}</div>
          </div>
          ${canRemove ? `
            <button onclick="window.demoActions.removeSkill('${s.name}')" class="text-xs text-rose-400/80 hover:text-rose-300 p-1.5 rounded hover:bg-rose-950/40 transition-colors" title="卸下插槽">✕</button>
          ` : ''}
        </div>
      </div>
    `;
  }

  /* 渲染：左侧立绘展台 */
  function renderHeroStage(hero, selectedClass) {
    const clsInfo = DEMO_CONFIG.classIntro[selectedClass] || {};

    return `

                <span>🔊</span>
                <span class="font-mono text-[0.7rem] hidden sm:inline">VOICE</span>
              </button>
              <div class="voice-wave ${state.audioPlaying && state.currentAudioHero === hero.id ? '' : 'paused'}">
                <div class="voice-bar"></div>

            <div class="bg-black/30 p-1.5 rounded border border-white/5">

              <div class="text-sm font-bold text-white">${clsData.mp}</div>

            <div class="bg-black/30 p-1.5 rounded border border-white/5">
              <div class="text-[0.65rem] text-amber-400/80">ATK</div>
              <div class="text-sm font-bold text-white">${clsData.atk}</div>

              <div class="text-sm font-bold text-white">${clsData.speed}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* 渲染：角色 1 职业选择 (威廉) */

            <div class="flex items-center justify-between pb-4 mb-6 border-b border-white/10">
              <div>
                <span class="font-mono text-xs text-[var(--accent)] tracking-widest">TACTICAL PROTOCOL // 02</span>
                <h2 class="text-2xl font-bold tracking-wider text-[var(--text-main)] mt-0.5">选择登场职业与战技配置</h2>
              </div>
              <div class="text-right">
                <span class="font-mono text-xs text-white/40">PARTY SLOT</span>
                <div class="font-mono text-sm font-bold text-[var(--accent)]">02 / 03</div>
              </div>
            </div>

            <!-- 候选职业卡组 -->
            <div class="grid sm:grid-cols-3 gap-3 mb-6">
              ${classCards}
            </div>

            <!-- 当前职业技能 6 槽展示 -->
            <div class="mt-6">
              <div class="flex items-center justify-between mb-3">
                <span class="font-mono text-xs tracking-wider text-[var(--text-muted)]">EQUIPPED SKILL SLOTS (6/6)</span>
                <span class="font-mono text-xs text-[var(--accent)]">[ 3 EXCLUSIVE + 3 TACTICAL ]</span>
              </div>
              <div class="flex flex-col gap-2">
                ${skillChips}
              </div>
            </div>
          </div>

          <!-- 导航按钮 -->
          <div class="pt-6 mt-6 border-t border-white/10 flex items-center justify-between">
            <button class="ui-btn-ghost" onclick="window.demoActions.gotoStage('c1')">← 返回角色 1 (威廉)</button>
            <button class="ui-btn-primary" onclick="window.demoActions.gotoStage('c3class')">
              <span>确认配置 · 下一步 (主角职业)</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  /* 渲染：角色 3 职业选择 */
  function viewC3class() {
    const allClasses = Object.keys(COMBAT_DATA.classes);
    const curCls = state.hero3.classType;
    const clsObj = COMBAT_DATA.classes[curCls];
    const limitedSkills = clsObj ? clsObj.skills.filter(s => s.scope === '限定') : [];

    const cards = allClasses.map(cName => {
      const info = DEMO_CONFIG.classIntro[cName] || {};
      const active = cName === curCls;
      return `
        <div class="class-tab-card ${active ? 'active' : ''}" onclick="window.demoActions.pickClass3('${cName}')">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-sm text-[var(--text-main)]">${cName}</span>
            <span class="font-mono text-[0.62rem] text-[var(--accent)]">${info.role || ''}</span>
          </div>
          <p class="text-[0.72rem] text-[var(--text-muted)] line-clamp-2">${info.intro}</p>
        </div>
      `;
    }).join('');

    const limitedChips = limitedSkills.map(s => renderSkillSlotChip(s)).join('');

    return `
      <div class="ui-panel p-6 sm:p-8 slide-fade-in">
        <div class="flex items-center justify-between pb-4 mb-6 border-b border-white/10">
          <div>
            <span class="font-mono text-xs text-[var(--accent)] tracking-widest">CUSTOM HERO // 03</span>
            <h2 class="text-2xl font-bold tracking-wider text-[var(--text-main)] mt-0.5">登记主角职能核心</h2>
          </div>
          <div class="text-right">
            <span class="font-mono text-xs text-white/40">PARTY SLOT</span>
            <div class="font-mono text-sm font-bold text-[var(--accent)]">03 / 03</div>
          </div>
        </div>

        <div class="mb-6">
          <div class="font-mono text-xs text-[var(--accent)] mb-3">SELECT CLASS SPECIFICATION (7 CLASSES)</div>
          <div class="grid sm:grid-cols-2 md:grid-cols-4 gap-3">
            ${cards}
          </div>
        </div>

        <!-- 职业限定槽位展示 -->
        <div class="ui-panel-soft p-5 mt-6">
          <div class="flex items-center justify-between mb-3">
            <span class="font-mono text-xs tracking-wider text-[var(--text-main)]">3 个职业限定战技（随职业自动锁定生效）</span>
            <span class="font-mono text-xs text-[var(--accent)]">[ LOCKED EXCLUSIVE ]</span>
          </div>
          <div class="flex flex-col gap-2">
            ${limitedChips}
          </div>
        </div>

        <div class="pt-6 mt-6 border-t border-white/10 flex items-center justify-between">
          <button class="ui-btn-ghost" onclick="window.demoActions.gotoStage('c2')">← 返回角色 2 (冯)</button>
          <button class="ui-btn-primary" onclick="window.demoActions.gotoStage('c3skill')">
            <span>前往自由通用技能购点插槽</span>
            <span>→</span>
          </button>
        </div>
      </div>
    `;
  }

  /* 渲染：角色 3 自由通用技能购点（插槽装配式） */
  function viewC3skill() {
    const curCls = state.hero3.classType;
    const clsObj = COMBAT_DATA.classes[curCls];
    const limitedSkills = clsObj ? clsObj.skills.filter(s => s.scope === '限定') : [];
    
    // 3 个已装配的通用技能
    const genericEquipped = state.hero3.skills.map(name => COMBAT_DATA.genericPool.find(s => s.name === name)).filter(Boolean);
    const usedPoints = genericSkillUsed();
    const maxPoints = DEMO_CONFIG.shop.skillPoints;
    const remainPoints = maxPoints - usedPoints;
    const pct = Math.min(100, Math.round((usedPoints / maxPoints) * 100));

    // 渲染已装备的 6 个槽位（3 限定 + 3 自由）
    let slotHtml = '';
    limitedSkills.forEach((s, i) => {
      slotHtml += renderSkillSlotChip(s);
    });
    for (let i = 0; i < 3; i++) {
      const s = genericEquipped[i];
      if (s) {
        slotHtml += renderSkillSlotChip(s, false, i + 4, true);
      } else {
        slotHtml += renderSkillSlotChip(null, true, i + 4);
      }
    }

    // 备选技能卡片网格
    const poolCards = COMBAT_DATA.genericPool.map(s => {
      const isSelected = state.hero3.skills.includes(s.name);
      return `
        <div class="skill-pick-card ${isSelected ? 'selected' : ''}" onclick="window.demoActions.toggleSkill('${s.name}')">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-sm text-[var(--text-main)]">${s.name}</span>
            <span class="font-mono text-xs font-bold text-[var(--accent)]">${s.shopCost} 点</span>
          </div>
          <div class="flex items-center gap-2 font-mono text-[0.65rem] text-white/50 mb-1.5">
            <span>来源: ${s.srcClass}</span>
            <span>·</span>
            <span>${s.typeTag}</span>
            ${s.isReaction ? '<span class="text-rose-400">⟲反应</span>' : ''}
          </div>
          <p class="font-mono text-[0.68rem] text-[var(--text-muted)] line-clamp-2 leading-relaxed">
            ${s.rawText.replace(/【[^】]+】/, '')}
          </p>
        </div>
      `;
    }).join('');

    return `
      <div class="ui-panel p-6 sm:p-8 slide-fade-in">
        <!-- 顶栏与能量条 -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-6 border-b border-white/10 gap-4">
          <div>
            <span class="font-mono text-xs text-[var(--accent)] tracking-widest">TACTICAL CHIP SLOTS // SKILL BUDGET</span>
            <h2 class="text-2xl font-bold tracking-wider text-[var(--text-main)] mt-0.5">主角自由通用战技插槽装配</h2>
          </div>

          <!-- 购点预算刻度指示 -->
          <div class="bg-black/40 backdrop-blur-md px-5 py-3 rounded-lg border border-white/10 min-w-[240px]">
            <div class="flex items-center justify-between font-mono text-xs mb-1.5">
              <span class="text-white/60">REMAINING BUDGET</span>
              <span class="font-bold ${remainPoints === 0 ? 'text-amber-400' : 'text-[var(--accent)]'}">${remainPoints} / ${maxPoints} 点</span>
            </div>
            <div class="energy-meter">
              <div class="energy-fill" style="width: ${pct}%;"></div>
            </div>
          </div>
        </div>

        <!-- 当前 6 槽装配全景面板 -->
        <div class="mb-8">
          <div class="flex items-center justify-between mb-3">
            <span class="font-mono text-xs text-[var(--accent)] tracking-wider">CURRENT 6 SKILL SLOTS [ 3 EXCLUSIVE + 3 GENERIC CHIPS ]</span>
            <span class="font-mono text-xs text-white/40">点击装配槽 ✕ 可快速卸下</span>
          </div>
          <div class="grid md:grid-cols-2 gap-3">
            ${slotHtml}
          </div>
        </div>

        <!-- 备选池：21 个战术通用技能芯片 -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="font-mono text-xs text-[var(--text-main)] tracking-wider">ALL AVAILABLE GENERIC SKILL CHIPS (点击安装 / 移除)</span>
            <span class="font-mono text-xs text-[var(--text-muted)]">最多选择 3 个 · 预算不超 ${maxPoints} 点</span>
          </div>
          <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            ${poolCards}
          </div>
        </div>

        <!-- 导航按钮 -->
        <div class="pt-6 mt-8 border-t border-white/10 flex items-center justify-between">
          <button class="ui-btn-ghost" onclick="window.demoActions.gotoStage('c3class')">← 返回主角职业</button>
          <div class="flex items-center gap-3">
            <span class="font-mono text-xs text-[var(--text-muted)]">通用槽已装配: ${genericEquipped.length}/3</span>
            <button class="ui-btn-primary" onclick="alert('恭喜！视觉 Demo 交互流验证成功。\\n\\n三位角色的技能槽位与属性档案已装配完毕。')">
              <span>完成配置 · 查看最终档案</span>
              <span>✓</span>
            </button>
          </div>
        </div>
      </div>
    `;
  }

  /* 核心路由渲染器 */
  function renderStage() {
    const appEl = document.getElementById('demo-app');
    if (!appEl) return;

    switch (state.stage) {
      case 'c1':
        appEl.innerHTML = viewC1();
        playHeroVoice('hero1');
        break;
      case 'c2':
        appEl.innerHTML = viewC2();
        playHeroVoice('hero2');
        break;
      case 'c3class':
        appEl.innerHTML = viewC3class();
        audioEl.pause();
        break;
      case 'c3skill':
        appEl.innerHTML = viewC3skill();
        audioEl.pause();
        break;
      default:
        appEl.innerHTML = viewC1();
        break;
    }
  }

  /* 挂载到 window 供页面内无缝调用 */
  window.demoActions = {
    pickClass1: (cls) => {
      state.hero1Class = cls;
      renderStage();
    },
    pickClass2: (cls) => {
      state.hero2Class = cls;
      renderStage();
    },
    pickClass3: (cls) => {
      state.hero3.classType = cls;
      renderStage();
    },
    toggleSkill: (skillName) => {
      toggleGenericSkill(skillName);
    },
    removeSkill: (skillName) => {
      toggleGenericSkill(skillName);
    },
    gotoStage: (st) => {
      state.stage = st;
      renderStage();
      // 同步顶部 dock 激活态
      document.querySelectorAll('[data-stage-jump]').forEach(btn => {
        if (btn.getAttribute('data-stage-jump') === st) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    },
    playVoice: (heroId) => {
      playHeroVoice(heroId);
    }
  };

  /* 主题切换与快捷跳转监听 */
  function initDockEvents() {
    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.getAttribute('data-theme');
        document.body.className = `theme-${theme}`;
      });
    });

    document.querySelectorAll('[data-stage-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const stage = btn.getAttribute('data-stage-jump');
        window.demoActions.gotoStage(stage);
      });
    });
  }

  /* 初始化启动 */
  parseCombatBlock();
  initDockEvents();
  renderStage();

})();
</script>
</body>
</html>
