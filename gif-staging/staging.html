/* ================= 引擎挂载（复刻 integration-test/harness.html 模式） ================= */
const $ = (s) => document.querySelector(s);
const stage = $('#stage');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let engineHtml = null;

/* 最小酒馆 API 桩：引擎 boot 期探测/读楼用，缺了会走非酒馆兜底 */
parent.__STAGING_API = {
  tavern_events: { MESSAGE_RECEIVED: 'message_received', CHAT_CHANGED: 'chat_id_changed' },
  getVariables: () => ({}),
  insertOrAssignVariables: () => {},
  setVariables: () => {},
  replaceVariables: () => {},
  getCurrentMessageId: () => 0,
  getLastMessageId: () => 0,
  getCurrentMessage: () => null,
  getChatMessages: () => [],
  setChatMessages: () => {},
  eventOn: () => {},
  eventOnce: () => {},
  eventEmit: () => {},
  generateRaw: async () => { throw new Error('摆拍环境无 LLM'); },
  triggerSlash: () => {},
  getCurrentCharacterName: () => '摆拍',
  getCharWorldbookNames: () => ({ primary: '', additional: [] }),
  getWorldbookNames: () => [],
  getWorldbook: () => null,
  createWorldbook: () => true,
  rebindCharWorldbooks: () => true,
  createWorldbookEntries: () => true,
  updateWorldbookWith: () => true,
};

async function fetchEngine() {
  if (engineHtml) return engineHtml;
  const res = await fetch(ENGINE_URL, { cache: 'reload' });
  if (!res.ok) throw new Error('读取引擎失败：' + res.status + '（需以 D:\\Project 为根的 http 服务打开本页）');
  engineHtml = await res.text();
  return engineHtml;
}

/* 引导脚本：插在 <head> 后，先于引擎执行——注入桩 + 导演化 Math.random（0.01 让一切概率判定成功） */
function bootSnippet() {
  return '<base href="/RpgCombat/">' +
    '<script>(function(){var M=parent.__STAGING_API;for(var k in M){window[k]=M[k];}' +
    'window.__RQ=[];Math.random=function(){return window.__RQ.length?window.__RQ.shift():0.01;};})();\x3c/script>';
}

function win() { return stage.contentWindow; }
function ev(expr) { return win().eval('(function(){return (' + expr + ');})()'); }
function run(code) { win().eval(code); }

async function mountEngine() {
  const html = await fetchEngine();
  stage.srcdoc = html.replace(/<head([^>]*)>/i, (m) => m + bootSnippet());
  const deadline = Date.now() + 25000;
  while (Date.now() < deadline) {
    await sleep(150);
    try {
      if (typeof win().showBattleResult === 'function' && typeof win().onCombatDataReceived === 'function') return;
    } catch (e) { /* 未就绪 */ }
  }
  throw new Error('引擎 25 秒内未就绪');
}

async function waitActor(heroId, timeoutMs = 60000) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    try {
      const ok = ev(`(state.isGameStarted && !state.isAnimating && state.actionQueue[state.queueIndex] && state.actionQueue[state.queueIndex].ref && state.actionQueue[state.queueIndex].ref.id === '${heroId}')`);
      if (ok) return;
    } catch (e) { /* 引擎尚未就绪 */ }
    await sleep(150);
  }
  throw new Error('等待 ' + heroId + ' 行动超时');
}

/* ================= 场景运行 ================= */
let running = false;
function hint(text, cls) {
  $('#hint').className = cls || 'busy';
  $('#hint-text').textContent = text;
}

async function playScene(scene) {
  if (running) return;
  running = true;
  document.querySelectorAll('.scene-btn').forEach((b) => { b.disabled = true; b.classList.toggle('active', b.dataset.id === scene.id); });
  try {
    hint('重新挂载引擎，构建「' + scene.id + '·' + scene.model + '」战局…');
    await mountEngine();
    run('Object.assign(AVATAR_MAP, ' + JSON.stringify(scene.avatars) + ');');
    run('onCombatDataReceived(' + JSON.stringify(scene.yaml) + ');');
    await sleep(400);
    if (!ev('!!heroesData && heroesData.length > 0')) throw new Error('战局构建失败（YAML 解析异常）');
    run('startGame();');
    await scene.steps({
      sleep, run, hint: (t) => hint(t, 'busy'),
      waitActor,
      setup: async (code) => { run(code); await sleep(500); },
    });
    hint('「' + scene.id + '」演示完成 — 可点重播再看，或切换其他职业', 'done');
  } catch (e) {
    console.error(e);
    hint('摆拍出错：' + e.message, 'err');
  } finally {
    running = false;
    document.querySelectorAll('.scene-btn').forEach((b) => { b.disabled = false; });
  }
}

/* ================= UI 构建 ================= */
const toolbar = $('#toolbar');
SCENES.forEach((s) => {
  const b = document.createElement('button');
  b.className = 'scene-btn'; b.dataset.id = s.id;
  b.innerHTML = '<b>' + s.id + ' · ' + s.model + '</b><span>' + s.desc + '</span>';
  b.title = '点击开始摆拍';
  b.addEventListener('click', () => playScene(s));
  toolbar.appendChild(b);
});
const replay = document.createElement('button');
replay.className = 'tool'; replay.textContent = '↻ 重播当前职业';
replay.addEventListener('click', () => { const act = document.querySelector('.scene-btn.active'); if (act) playScene(SCENES.find((s) => s.id === act.dataset.id)); });
toolbar.appendChild(replay);

/* 取景参考框 */
const frBox = $('#frame-box'), frCheck = $('#fr-check'), frSize = $('#fr-size');
function applyFrame() {
  const size = frSize.value;
  frBox.classList.toggle('show', frCheck.checked);
  $('#fr-size-wrap').classList.toggle('show', frCheck.checked);
  frBox.style.width = size + 'px'; frBox.style.height = size + 'px';
  $('#fr-size-val').textContent = size + 'px';
  $('#fr-dim').textContent = size + '×' + size;
}
frCheck.addEventListener('change', applyFrame);
frSize.addEventListener('input', applyFrame);
applyFrame();
</script>
