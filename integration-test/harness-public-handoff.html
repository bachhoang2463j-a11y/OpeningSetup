<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OpeningSetup 公开版 · 引导/自由开局交接回归</title>
<style>
  body { background:#141210; color:#cfc6b8; font:13px/1.6 "Consolas","Microsoft YaHei",monospace; padding:16px 20px; }
  h1 { color:#d9b45c; font-size:15px; letter-spacing:.2em; }
  h2 { color:#d9b45c; font-size:13px; margin:16px 0 4px; border-bottom:1px solid #333; padding-bottom:2px; }
  #run { background:#2a241a; color:#d9b45c; border:1px solid #6b5a2e; border-radius:4px; padding:6px 18px; cursor:pointer; font:inherit; margin:10px 0; }
  #run:disabled { opacity:.5; cursor:default; }
  #total { margin-left:12px; color:#e8dcc0; }
  .row { white-space:pre-wrap; }
  .ok { color:#7fae7f; } .bad { color:#e08a8a; } .pend { color:#d9b45c; }
  #hostbar { position:fixed; left:0; bottom:0; right:0; background:#1d1a15; border-top:1px solid #4a3f27; padding:6px 10px; display:flex; gap:8px; align-items:flex-start; z-index:50; }
  #send_textarea { flex:1; height:44px; background:#0c0b09; color:#e8dcc0; border:1px solid #4a3f27; border-radius:4px; font:inherit; padding:6px; resize:vertical; }
  #send_but { background:#2a241a; color:#d9b45c; border:1px solid #6b5a2e; border-radius:4px; padding:8px 16px; cursor:pointer; font:inherit; }
  #hostnote { color:#8a8172; font-size:11px; align-self:center; }
  #out { padding-bottom:70px; }
  #stages iframe { position:fixed; right:0; top:0; width:440px; height:340px; border:1px solid #333; background:#000; opacity:.85; z-index:40; }
</style>
</head>
<body>
<h1>OPENING_SETUP（公开版） · 引导/自由开局交接回归</h1>
<div>
  <button id="run">▶ 运行交接回归</button>
  <span id="total">0 / 0 项通过</span>
</div>
<div id="out"></div>
<div id="stages"></div>
<div id="hostbar">
  <textarea id="send_textarea" placeholder="酒馆输入栏（测试宿主 · 与真实酒馆同 id）"></textarea>
  <button id="send_but">发送</button>
  <span id="hostnote">宿主 send_but 点击=记录并清空（模拟酒馆发送）</span>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * 宿主输入栏（父文档）：产品通过 window.parent.document 访问
   *   #send_textarea / #send_but —— 与真实酒馆同 id
   *   send_but.click() 记录当前文本并清空（模拟酒馆"发送后清栏"）
   * ===================================================================== */
  var HOST = { sends: [] };
  window.__HOST__ = HOST;
  document.getElementById('send_but').addEventListener('click', function () {
    var ta = document.getElementById('send_textarea');
    HOST.sends.push(ta.value);
    ta.value = ''; // 模拟酒馆发送后清空输入栏
  });
  function hostInput() { return document.getElementById('send_textarea'); }
  function setDraft(t) { hostInput().value = t; }
  function resetHost() { HOST.sends = []; hostInput().value = ''; }

  /* =====================================================================
   * 断言输出
   * ===================================================================== */
  var out = document.getElementById('out');
  var totalRow = document.getElementById('total');
  var nPass = 0, nFail = 0, nPend = 0, nTotal = 0;

  function group(name) {
    var h = document.createElement('h2');
    h.textContent = name;
    out.appendChild(h);
  }
  function row(desc, status, extra) {
    nTotal++;
    var cls, mark;
    if (status === true) { nPass++; cls = 'ok'; mark = '  ✓ '; }
    else if (status === 'pending') { nPend++; cls = 'pend'; mark = '  ◌ '; }
    else { nFail++; cls = 'bad'; mark = '  ✗ '; }
    var d = document.createElement('div');
    d.className = 'row ' + cls;
    var tail = (status === true || status === 'pending')
      ? (status === 'pending' ? '  → 待对齐：' + (extra === undefined ? '' : String(extra)) : '')
      : '  → ' + (extra === undefined ? '' : JSON.stringify(extra).slice(0, 260));
    d.textContent = mark + desc + tail;
    out.appendChild(d);
  }
  function assert(desc, fn) {
    try { var r = fn(); row(desc, r === true, r); }
    catch (e) { row(desc, false, 'EXC: ' + (e && e.message)); }
  }
  function pending(desc, note) { row(desc, 'pending', note); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* =====================================================================
   * 注入脚本（注入 <head> 最前，先于产品脚本）
   *   1. 媒体/网络护栏：先于 boot 拦外部音视频/字体，保留 DOM 可查 pause
   *   2. 酒馆助手 API mock（含真实语义深合并）
   * ===================================================================== */

  // —— 媒体护栏：play/load 置空，pause 可观测；fetch/XHR 拦外链 ——
  function mediaGuard() {
    var M = { plays: [], pauses: [], loads: 0, blocked: [] };
    window.__MEDIA__ = M;
    function tag(el) { return (el && el.tagName ? el.tagName : 'MEDIA') + ':' + (el && (el.currentSrc || el.getAttribute && el.getAttribute('src')) || ''); }
    try {
      var proto = window.HTMLMediaElement && window.HTMLMediaElement.prototype;
      if (proto) {
        proto.play = function () { this.__mockPlaying = true; M.plays.push(tag(this)); return Promise.resolve(); };
        proto.pause = function () { this.__mockPlaying = false; M.pauses.push(tag(this)); };
        proto.load = function () { M.loads++; };
        try {
          Object.defineProperty(proto, 'paused', {
            configurable: true,
            get: function () { return this.__mockPlaying !== true; },
          });
        } catch (e) { /* 原生 paused 不可重定义时降级：断言改用 __mockPlaying */ }
      }
    } catch (e) { window.__MEDIA_ERR__ = e && e.message; }
    try {
      var origFetch = window.fetch;
      window.fetch = function (u) {
        M.blocked.push(String(u));
        return Promise.reject(new Error('mock: 网络已禁用 ' + u));
      };
    } catch (e) { /* 静默 */ }
    try {
      var XO = window.XMLHttpRequest && window.XMLHttpRequest.prototype.open;
      if (XO) {
        window.XMLHttpRequest.prototype.open = function (m, u) {
          M.blocked.push('xhr:' + String(u));
          return XO.apply(this, arguments); // 打开但无网络响应，避免产品挂起
        };
      }
    } catch (e) { /* 静默 */ }
  }

  // —— 酒馆助手 API mock ——
  // 契约：getVariables / insertOrAssignVariables（真深合并：对象递归、数组整体替换）/
  //       createChatMessages（message+data，message_id 递增）/
  //       getCurrentMessageId / getLastMessageId / getChatMessages / triggerSlash
  function mockBoot() {
    var seed = window.__SEED__ || {};
    function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
    function isPlain(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }
    function deepMerge(t, p) {
      Object.keys(p).forEach(function (k) {
        var v = p[k];
        if (isPlain(v) && isPlain(t[k])) deepMerge(t[k], v); // 对象递归
        else t[k] = clone(v);                                  // 数组/标量整体替换
      });
      return t;
    }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    var store = { chat: clone(seed.chat || {}) };
    var msgs = (seed.messages || []).map(clone);
    var created = [];
    var log = [];
    var failCreate = false;
    var failAssignKeys = null;   // 命中的 key 抛错（模拟归档失败）
    var assignDelay = 0;

    var M = {
      store: store, msgs: msgs, created: created, log: log,
      generateCalls: 0, generateRawCalls: 0,
      setFailCreate: function (v) { failCreate = !!v; },
      setFailAssignKeys: function (keys) { failAssignKeys = keys ? keys.slice() : null; },
      setAssignDelay: function (ms) { assignDelay = ms | 0; },
      doneFlag: function () { return store.chat.$opening_setup_done; },
      roster: function () { return store.chat.rpg_combat_roster; },
      receipts: function () {
        return created.map(function (c) { return c.data && c.data.$opening_setup_receipt; }).filter(Boolean);
      },
      nextId: function () { return msgs.length ? Math.max.apply(null, msgs.map(function (x) { return x.message_id; })) + 1 : 0; },
    };
    window.__MOCK__ = M;

    window.getVariables = async function () { return clone(store.chat); };

    window.insertOrAssignVariables = async function (payload) {
      if (failAssignKeys) {
        var hit = Object.keys(payload || {}).filter(function (k) { return failAssignKeys.indexOf(k) >= 0; });
        if (hit.length) throw new Error('mock: 变量写入故障（' + hit.join(',') + '）');
      }
      if (assignDelay) await sleep(assignDelay);
      deepMerge(store.chat, clone(payload || {}));
      log.push('assign:' + Object.keys(payload || {}).join(','));
      return clone(store.chat);
    };

    window.createChatMessages = async function (list) {
      if (failCreate) throw new Error('mock: 消息接口故障');
      (list || []).forEach(function (m) {
        var rec = {
          message_id: M.nextId(),
          name: m.name || '',
          role: m.role,
          is_hidden: !!m.is_hidden,
          message: m.message,
          data: clone(m.data || {}),
          extra: {},
        };
        msgs.push(rec);
        created.push(rec);
      });
      log.push('create');
    };

    window.getCurrentMessageId = function () { return seed.currentId == null ? 0 : seed.currentId; };
    window.getLastMessageId = function () {
      return msgs.length ? Math.max.apply(null, msgs.map(function (x) { return x.message_id; })) : -1;
    };

    // 楼层号解析：数字 / 负数 / 'a-b' / '0-{{lastMessageId}}'
    function resolveRange(range) {
      if (typeof range === 'number') {
        return range < 0 ? [msgs.length + range, msgs.length + range] : [range, range];
      }
      var s = String(range).replace(/\{\{\s*lastMessageId\s*\}\}/g, String(window.getLastMessageId()));
      if (s.indexOf('-') > 0) {
        var p = s.split('-');
        return [Number(p[0]), Number(p[1])];
      }
      var n = Number(s);
      return n < 0 ? [msgs.length + n, msgs.length + n] : [n, n];
    }

    window.getChatMessages = function (range, option) {
      option = option || {};
      var r = resolveRange(range);
      var lo = r[0], hi = r[1];
      if (lo > hi) { var t = lo; lo = hi; hi = t; }
      return msgs
        .filter(function (m) { return m.message_id >= lo && m.message_id <= hi; })
        .filter(function (m) { return !option.role || option.role === 'all' || m.role === option.role; })
        .filter(function (m) {
          if (!option.hide_state || option.hide_state === 'all') return true;
          return option.hide_state === 'hidden' ? m.is_hidden : !m.is_hidden;
        })
        .map(clone);
    };

    window.triggerSlash = function () { log.push('slash'); };

    // 外部 LLM 调用计数器（隔离 stub，绝不打真实接口）
    window.generate = async function () { M.generateCalls++; log.push('generate'); return ''; };
    window.generateRaw = async function () { M.generateRawCalls++; log.push('generateRaw'); return ''; };
  }

  /* =====================================================================
   * 挂载与驱动
   * ===================================================================== */
  var stagesBox = document.getElementById('stages');
  var current = null;         // 当前 iframe 元素
  var htmlCache = null;       // 产品 HTML 文本缓存（避免重复网络）

  async function productHtml() {
    if (htmlCache == null) {
      var res = await fetch('../OpeningSetup-公开版.html', { cache: 'reload' });
      htmlCache = await res.text();
    }
    return htmlCache;
  }

  function injectHead(html, opts) {
    opts = opts || {};
    var seed = { chat: opts.chat || null, messages: opts.messages || [], currentId: opts.currentId == null ? 0 : opts.currentId };
    var meta = '<meta http-equiv="Content-Security-Policy" content="media-src \'none\'; font-src \'none\'">';
    var head = '<head>'
      + meta
      + '<script>window.__SEED__=' + JSON.stringify(seed) + ';\x3c/script>'
      + '<script>(' + mediaGuard.toString() + ')();\x3c/script>'
      + '<script>(' + mockBoot.toString() + ')();\x3c/script>';
    return html.replace('<head>', head);
  }

  // 新 iframe（每次全新实例；不重用、不在同实例重赋 srcdoc）
  async function makeStage(opts) {
    if (current) { current.remove(); current = null; }
    resetHost();
    var iframe = document.createElement('iframe');
    stagesBox.appendChild(iframe);
    var html = await productHtml();
    iframe.srcdoc = injectHead(html, opts);
    await new Promise(function (r) { iframe.addEventListener('load', r, { once: true }); });
    await sleep(160);
    var win = iframe.contentWindow;
    if (win.__OPENING_DEBUG__) win.__OPENING_DEBUG__.instant = true; // 打字机瞬时完成
    current = iframe;
    return { iframe: iframe, win: win, doc: win.document, mock: win.__MOCK__, media: win.__MEDIA__ };
  }
  function dispose() { if (current) { current.remove(); current = null; } }

  function D(ctx) { return ctx.win.__OPENING_DEBUG__ || {}; }
  function S(ctx) { return D(ctx).state || {}; }

  function click(ctx, sel) {
    var el = ctx.doc.querySelector(sel);
    if (!el) throw new Error('找不到元素 ' + sel + '（stage=' + (S(ctx).stage) + '）');
    el.dispatchEvent(new ctx.win.MouseEvent('click', { bubbles: true }));
  }
  function clickAction(ctx, a) { click(ctx, '[data-action="' + a + '"]'); }

  function skipStory(ctx) {
    for (var i = 0; i < 12; i++) {
      if (ctx.doc.querySelector('[data-action="story-done"]')) { clickAction(ctx, 'story-done'); return; }
      if (!ctx.doc.querySelector('[data-action="story-next"]')) throw new Error('故事页无推进按钮');
      clickAction(ctx, 'story-next');
    }
    throw new Error('故事页推进超过 12 步');
  }
  function pickClass(ctx, slot, cls) {
    var action = slot === 'c3' ? 'c3-class-pick' : slot + '-pick';
    click(ctx, '[data-action="' + action + '"][data-class="' + cls + '"]');
  }
  function setName(ctx, name) {
    var inp = ctx.doc.getElementById('name-input');
    if (!inp) throw new Error('找不到姓名输入框（stage=' + S(ctx).stage + '）');
    inp.value = name;
    inp.dispatchEvent(new ctx.win.Event('input', { bubbles: true }));
  }
  function setInput(ctx, id, val) {
    var el = ctx.doc.getElementById(id);
    if (!el) throw new Error('找不到输入框 #' + id);
    el.value = val;
    el.dispatchEvent(new ctx.win.Event('input', { bubbles: true }));
  }

  // 全流程推进到最终确认页
  function driveGuided(ctx, o) {
    o = o || {};
    clickAction(ctx, 'start');
    skipStory(ctx);
    pickClass(ctx, 'c1', o.c1 || '隐匿者'); clickAction(ctx, 'c1-done');
    pickClass(ctx, 'c2', o.c2 || '圣职者'); clickAction(ctx, 'c2-done');
    clickAction(ctx, 'c_iskandar-done');
    setName(ctx, o.name || '夜鸦');
    if (o.wearing) setInput(ctx, 'wearing-input', o.wearing);
    if (o.inner) setInput(ctx, 'inner-input', o.inner);
    if (o.storyItems) setInput(ctx, 'story-items-input', o.storyItems);
    clickAction(ctx, 'c3id-done');
    pickClass(ctx, 'c3', o.c3 || '灾厄使'); clickAction(ctx, 'c3class-done');
    (o.skills || []).forEach(function (n) { click(ctx, '[data-action="c3-skill-toggle"][data-skill="' + n + '"]'); });
    clickAction(ctx, 'c3skill-done');
    (o.items || []).forEach(function (id) { click(ctx, '[data-item-id="' + id + '"]'); });
    clickAction(ctx, 'c3item-done');
  }

  async function waitStage(ctx, targets, tries) {
    tries = tries || 50;
    for (var i = 0; i < tries; i++) {
      await sleep(60);
      var st = S(ctx).stage;
      if (targets.indexOf(st) >= 0) return st;
    }
    return S(ctx).stage;
  }

  var FREE_TEXT = [
    '我推开门，雨水顺着枪管滴落。',
    '她说："别回头。"\\',
    '- 一句以短横开头的台词',
    '钥匙: 铜色的小钥匙',
    '最后一行。',
  ].join('\n');

  /* =====================================================================
   * 契约探针
   * ===================================================================== */
  var PROBE = null;
  function probe(ctx) {
    var d = D(ctx), s = S(ctx);
    return {
      debug: !!d.state,
      buildStatusBlock: typeof d.buildStatusBlock === 'function',
      buildFreeOpeningInput: typeof d.buildFreeOpeningInput === 'function',
      buildFreeOpeningBrief: typeof d.buildFreeOpeningBrief === 'function',
      openingMode: s && ('openingMode' in s),
      compact: s && ('compact' in s),
      innerEdited: !!(s && s.hero3 && ('innerEdited' in s.hero3)),
      freeOpenBtn: !!ctx.doc.querySelector('[data-action="free-open"]'),
      freeSubmitBtn: !!ctx.doc.querySelector('[data-action="free-submit"]'),
      freeInput: !!ctx.doc.getElementById('free-opening-input'),
    };
  }

  /* =====================================================================
   * 测试组
   * ===================================================================== */

  // G0 旧回归 smoke：引导路径仍可跑通
  async function g0() {
    group('G0 旧回归 smoke（引导路径端到端仍可用）');
    var ctx;
    try {
      ctx = await makeStage({});
      assert('boot 进入标题页', function () { return S(ctx).stage === 'title' ? true : S(ctx).stage; });
      driveGuided(ctx, { name: '夜鸦', c1: '隐匿者', c2: '圣职者', c3: '灾厄使' });
      clickAction(ctx, 'confirm-submit');
      var st = await waitStage(ctx, ['done', 'error']);
      assert('引导提交后进入完成页', function () { return st === 'done' ? true : st; });
      assert('roster 四英雄 version 1', function () {
        var r = ctx.mock.roster();
        return r && r.version === 1 && r.heroes.length === 4 ? true : r && r.heroes.length;
      });
      assert('引导路径落楼一条 assistant（含 Combat_block + Status_block）', function () {
        var c = ctx.mock.created;
        return c.length === 1 && c[0].role === 'assistant'
          && c[0].message.indexOf('<Combat_block>') >= 0
          && c[0].message.indexOf('<Status_block>') >= 0 ? true : c.map(function (x) { return x.role; });
      });
      assert('落楼 data 带 $opening_setup_receipt（source=当前楼层 0，flag=完整 doneflag）', function () {
        var d = ctx.mock.created[0] && ctx.mock.created[0].data;
        var rec = d && d.$opening_setup_receipt;
        return rec && rec.source === 0 && rec.flag && Array.isArray(rec.flag.chars) && rec.flag.chars.length === 4 ? true : rec;
      });
    } catch (e) { row('G0 执行中断', false, e.message); }
    dispose();
  }

  // G1 确认页双按钮契约
  async function g1() {
    group('G1 确认页按钮契约（金色原按钮保留 · 灰色自由按钮）');
    var ctx;
    try {
      ctx = await makeStage({});
      driveGuided(ctx, { name: '夜鸦', c1: '隐匿者', c2: '圣职者', c3: '灾厄使' });
      PROBE = probe(ctx);
      assert('最终页 [data-action=confirm-submit] id=submit-btn', function () {
        var b = ctx.doc.querySelector('[data-action="confirm-submit"]');
        return b && b.id === 'submit-btn' ? true : b && b.id;
      });
      assert('金色原按钮文案含「引导开局」，class 仍含 btn-noir', function () {
        var b = ctx.doc.querySelector('[data-action="confirm-submit"]');
        if (!b) return '缺按钮';
        return b.textContent.indexOf('引导开局') >= 0 && b.className.indexOf('btn-noir') >= 0
          ? true : { text: b.textContent, cls: b.className };
      });
      if (!PROBE.freeOpenBtn) { pending('灰色自由按钮 [data-action=free-open] class 含 btn-noir btn-free', 'free-open 按钮未落地'); }
      else {
        assert('灰色自由按钮 [data-action=free-open] class 含 btn-noir btn-free', function () {
          var b = ctx.doc.querySelector('[data-action="free-open"]');
          return b.className.indexOf('btn-noir') >= 0 && b.className.indexOf('btn-free') >= 0 ? true : b.className;
        });
      }
    } catch (e) { row('G1 执行中断', false, e.message); }
    dispose();
  }

  // G2 自由开局交接
  async function g2() {
    group('G2 自由开局交接（开局背景先落楼 · 原文 + Status_block 走宿主 send_but 一次）');
    var ctx;
    try {
      ctx = await makeStage({});
      driveGuided(ctx, { name: '夜鸦', c1: '隐匿者', c2: '圣职者', c3: '灾厄使' });
      PROBE = probe(ctx);
      if (!PROBE.freeOpenBtn) {
        pending('点击自由按钮展开 stage=free', 'free-open 未落地'); dispose(); return;
      }
      assert('buildFreeOpeningBrief 构建器已落地', function () { return PROBE.buildFreeOpeningBrief ? true : '未落地'; });
      clickAction(ctx, 'free-open');
      PROBE = probe(ctx); // 自由页元素需在进入 free 后重新探测
      assert('点击自由按钮进入 stage=free', function () { return S(ctx).stage === 'free' ? true : S(ctx).stage; });
      assert('自由页存在 [data-action=free-submit] 与 [data-action=back-confirm]', function () {
        return (ctx.doc.querySelector('[data-action="free-submit"]') && ctx.doc.querySelector('[data-action="back-confirm"]')) ? true : '缺按钮';
      });

      if (!PROBE.freeInput) { pending('存在 #free-opening-input textarea', 'free-opening-input 未落地'); }
      else {
        setInput(ctx, 'free-opening-input', FREE_TEXT);
        assert('输入自由原文写入 state.freeOpening', function () {
          return S(ctx).freeOpening === FREE_TEXT ? true : S(ctx).freeOpening;
        });
      }

      resetHost();
      if (!PROBE.freeSubmitBtn) { pending('free-submit 提交', 'free-submit 未落地'); dispose(); return; }
      clickAction(ctx, 'free-submit');
      var st = await waitStage(ctx, ['done', 'error']);
      assert('自由提交后进入完成页', function () { return st === 'done' ? true : st; });
      assert('自由提交后 state.openingMode=free', function () { return S(ctx).openingMode === 'free' ? true : S(ctx).openingMode; });

      assert('宿主 send_but 恰好被点击 1 次', function () { return HOST.sends.length === 1 ? true : HOST.sends.length; });

      ctx.mock.setAssignDelay(400);

      await sleep(120); // 落在慢写中段
      var during = S(ctx).stage;
      assert('慢写中处于 loading', function () { return during === 'loading' ? true : during; });
      if (PROBE.compact) {
        assert('慢写中 state.compact=true', function () { return S(ctx).compact === true ? true : S(ctx).compact; });
      } else pending('慢写中 state.compact=true', 'compact 未落地');
      assert('慢写当下 frame 高度 = body.scrollHeight（紧凑同步）', function () {
        var sh = ctx.doc.body.scrollHeight;
        return ctx.iframe.style.height === sh + 'px' ? true : { frame: ctx.iframe.style.height, scroll: sh };
      });
      assert('慢写中音视频已暂停（BGM/语音）', function () {
        var bgm = ctx.doc.getElementById('bgm');
        var media = ctx.media || {};
        var pausedOk = bgm ? (bgm.__mockPlaying !== true || bgm.paused === true) : true;
        return (pausedOk && (media.pauses || []).length > 0) ? true
          : { bgmPlaying: bgm && bgm.__mockPlaying, pauses: (media.pauses || []).length };
      });
      var st = await waitStage(ctx, ['done', 'error']);
      assert('慢写结束后完成', function () { return st === 'done' ? true : st; });
      if (PROBE.compact) assert('完成页 state.compact=true', function () { return S(ctx).compact === true ? true : S(ctx).compact; });
    } catch (e) { row('G8 执行中断', false, e.message); }
    dispose();
  }

  // G9 特殊引号/反斜杠/YAML
  async function g9() {
    group('G9 特殊引号/反斜杠/YAML 安全');
    // 9-1 自由原文逐字交接
    var ctx;
    try {
      ctx = await makeStage({});
      driveGuided(ctx, { name: '夜鸦', c1: '隐匿者', c2: '圣职者', c3: '灾厄使' });
      PROBE = probe(ctx); // 每页元素不同，按当前 stage 重新探测
      if (!PROBE.freeOpenBtn) { pending('自由原文逐字交接', 'free-open 未落地'); dispose(); return; }
      clickAction(ctx, 'free-open');
      PROBE = probe(ctx);
      if (!PROBE.freeSubmitBtn) { pending('自由原文逐字交接', 'free-submit 未落地'); dispose(); return; }
      if (PROBE.freeInput) setInput(ctx, 'free-opening-input', FREE_TEXT);
      resetHost();
      clickAction(ctx, 'free-submit');
      await waitStage(ctx, ['done', 'error']);
      assert('含引号/反斜杠/短横线的自由原文逐字交接', function () {
        var t = HOST.sends[0] || '';
        return t.indexOf(FREE_TEXT) >= 0 ? true : t.slice(0, 220);
      });
      assert('自由交接文本用 JSON 转义（yamlText）保护 YAML 引号', function () {
        var t = HOST.sends[0] || '';
        return t.indexOf('名字: "') >= 0 && t.indexOf('<Status_block>') >= 0 ? true : '缺 Status_block';
      });
    } catch (e) { row('G9-1 执行中断', false, e.message); }
    dispose();

    // 9-2 姓名含引号/反斜杠 → Status_block 名字行须转义
    var ctx2;
    try {
      ctx2 = await makeStage({});
      clickAction(ctx2, 'start'); skipStory(ctx2);
      pickClass(ctx2, 'c1', '隐匿者'); clickAction(ctx2, 'c1-done');
      pickClass(ctx2, 'c2', '圣职者'); clickAction(ctx2, 'c2-done');
      clickAction(ctx2, 'c_iskandar-done');
      setName(ctx2, 'A"B\\C'); // 20 字内，含引号与反斜杠
      if (!probe(ctx2).buildStatusBlock) { pending('姓名 YAML 转义', 'buildStatusBlock 未落地'); dispose(); return; }
      var b = D(ctx2).buildStatusBlock('free');
      var nameLine = (b.match(/名字: "[^\n]*"/g) || []).filter(function (l) { return l.indexOf('A') >= 0; });
      assert('姓名含引号/反斜杠时 名字 行 YAML 转义安全', function () {
        if (!nameLine.length) return '未找到名字行';
        var line = nameLine[nameLine.length - 1];
        return line.indexOf('A\\"B\\\\C') >= 0 ? true : line;
      });
      assert('名字行转义后仍是合法双引号标量（首尾引号成对）', function () {
        if (!nameLine.length) return '未找到名字行';
        var line = nameLine[nameLine.length - 1];
        var m = line.match(/名字: (.*)$/);
        if (!m) return '格式异常';
        var v = m[1].trim();
        return (v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') ? true : v;
      });
    } catch (e) { row('G9-2 执行中断', false, e.message); }
    dispose();
  }

  // G10 自定义姓名同名阻止
  async function g10() {
    group('G10 自定义姓名与预置角色同名 → 阻止');
    var ctx;
    try {
      ctx = await makeStage({});
      clickAction(ctx, 'start'); skipStory(ctx);
      pickClass(ctx, 'c1', '隐匿者'); clickAction(ctx, 'c1-done');
      pickClass(ctx, 'c2', '圣职者'); clickAction(ctx, 'c2-done');
      clickAction(ctx, 'c_iskandar-done');
      setName(ctx, '威廉·退尔'); // 与角色一同名
      clickAction(ctx, 'c3id-done');
      var afterC3id = S(ctx).stage;
      assert('同名在 c3id-done 被阻止（停留 c3id）', function () {
        return afterC3id === 'c3id' ? true : { stage: afterC3id, flash: S(ctx).flash };
      });
      if (afterC3id === 'c3id') {
        // 改名后应放行
        setName(ctx, '夜鸦');
        clickAction(ctx, 'c3id-done');
        assert('改名后放行进入 c3class', function () { return S(ctx).stage === 'c3class' ? true : S(ctx).stage; });
      } else {
        // 若 c3id 未阻止，则提交阶段必须阻止
        pending('同名在 c3id-done 被阻止', 'c3id 未阻止，检查提交阶段');
        pickClass(ctx, 'c3', '灾厄使'); clickAction(ctx, 'c3class-done'); clickAction(ctx, 'c3skill-done'); clickAction(ctx, 'c3item-done');
        clickAction(ctx, 'confirm-submit');
        await sleep(200);
        assert('同名在提交阶段被阻止（未进入 done）', function () {
          var st = S(ctx).stage;
          return (st === 'confirm' || st === 'error') ? true : st;
        });
      }
    } catch (e) { row('G10 执行中断', false, e.message); }
    dispose();
  }

  // G11 重配保留无关角色并删除旧主角
  async function g11() {
    group('G11 强制重配：保留无关角色 · 删除旧主角（按 doneflag.chars slot 替换）');
    var ctx;
    try {
      var doneSeed = {
        ts: 111, mode: 'guided',
        chars: [
          { slot: 'hero1', name: '威廉·退尔', classType: '隐匿者' },
          { slot: 'hero2', name: '冯·霍恩海姆', classType: '圣职者' },
          { slot: 'hero_iskandar', name: '伊斯坎达尔', classType: '征伐者' },
          { slot: 'hero3', name: '旧主角', classType: '灾厄使' },
        ],
        customPortraits: [], skills: [], items: [],
      };
      var rosterSeed = {
        version: 1,
        heroes: [
          { name: '威廉·退尔', config: { classType: '隐匿者' }, skills: [], items: [] },
          { name: '冯·霍恩海姆', config: { classType: '圣职者' }, skills: [], items: [] },
          { name: '伊斯坎达尔', config: { classType: '征伐者' }, skills: [], items: [] },
          { name: '旧主角', config: { classType: '灾厄使' }, skills: [], items: [] },
          { name: '无关者', config: { classType: '狂战士' }, skills: [{ name: '保留技能' }], items: [] },
        ],
      };
      var seedChat = {};
      seedChat.$opening_setup_done = doneSeed;
      seedChat.rpg_combat_roster = rosterSeed;
      ctx = await makeStage({ chat: seedChat, messages: [] });
      assert('已建档 boot 进入归档摘要', function () { return S(ctx).stage === 'archived' ? true : S(ctx).stage; });
      clickAction(ctx, 'force-redo');
      assert('强制重配回到标题页', function () { return S(ctx).stage === 'title' ? true : S(ctx).stage; });
      driveGuided(ctx, { name: '新主角', c1: '防守者', c2: '圣职者', c3: '防守者' });
      clickAction(ctx, 'confirm-submit');
      var st = await waitStage(ctx, ['done', 'error']);
      assert('重配提交完成', function () { return st === 'done' ? true : st; });
      var heroes = (ctx.mock.roster() || {}).heroes || [];
      var names = heroes.map(function (h) { return h.name; });
      assert('新主角已写入', function () { return names.indexOf('新主角') >= 0 ? true : names; });
      assert('旧主角已被删除', function () { return names.indexOf('旧主角') < 0 ? true : names; });
      assert('无关角色被保留（含其数据）', function () {
        var extra = heroes.filter(function (h) { return h.name === '无关者'; })[0];
        return extra && extra.skills && extra.skills.some(function (s) { return s.name === '保留技能'; }) ? true : extra;
      });
      assert('受管四槽位替换后总数 = 4 管理 + 1 额外', function () {
        return heroes.length === 5 ? true : { len: heroes.length, names: names };
      });
    } catch (e) { row('G11 执行中断', false, e.message); }
    dispose();
  }

  /* =====================================================================
   * 运行
   * ===================================================================== */
  document.getElementById('run').addEventListener('click', runAll);

  async function runAll() {
    var btn = document.getElementById('run');
    btn.disabled = true;
    out.innerHTML = '';
    nPass = nFail = nPend = nTotal = 0;
    totalRow.textContent = '0 / 0 项通过';
    PROBE = null;

    var groups = [g0, g1, g2, g3, g4, g5, g6, g7a, g7b, g7c, g7d, g8, g9, g10, g11];
    for (var i = 0; i < groups.length; i++) {
      try { await groups[i](); }
      catch (e) { row('组 ' + groups[i].name + ' 未捕获异常', false, e && e.message); }
    }
    dispose();
    totalRow.textContent = nPass + ' 通过 / ' + nFail + ' 失败 / ' + nPend + ' 待对齐（共 ' + nTotal + '）';
    btn.disabled = false;
  }
})();
</script>
